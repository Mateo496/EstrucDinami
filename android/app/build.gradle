plugins {
    id 'com.android.application'
}

// En GitHub Actions cada compilación sube el número de versión automáticamente.
def run = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'com.mateo.estrucdinami'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mateo.estrucdinami'
        minSdk 26
        targetSdk 34
        versionCode run
        versionName "1.0.${run}"
    }

    // La app de estudio (carpeta /web del repositorio) se empaqueta tal cual dentro del APK.
    sourceSets {
        main {
            assets.srcDirs += [file("${rootDir}/../web")]
        }
    }

    signingConfigs {
        release {
            storeFile file('estrucdinami.keystore')
            storePassword 'estrucdinami-app'
            keyAlias 'estrucdinami'
            keyPassword 'estrucdinami-app'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
