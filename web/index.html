<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parcial Teórico Sismorresistente</title>
<meta name="description" content="Banco interactivo para el parcial teórico de Dinámica Estructural y Diseño Sismorresistente (NSR-10).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:ital,wght@0,400..700;1,400&display=swap">
<style>
/* Layout: barra lateral de navegación + lienzo de estudio; la cabecera de inicio imita el rótulo de un plano estructural */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#121826; --ink-soft:#485268; --ink-faint:#7A8498;
  --line:#DBE0E8; --line-2:#C4CCD8; --grid:#E3E7ED;
  --accent:#2A44AE; --accent-ink:#FFFFFF; --accent-soft:#E8ECFA; --accent-line:#B7C2EC;
  --amber:#B06900; --amber-soft:#FCF0DB;
  --ok:#1C774C; --ok-soft:#E2F2E9; --bad:#B42318; --bad-soft:#FBE8E5; --warn:#8F5F00; --warn-soft:#FBF1D8;
  --conc:#D6DBE2; --earth:#EFE8DB; --earth2:#E5DAC6;
  --f-disp:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px; --shadow:0 1px 2px rgba(18,24,38,.05),0 10px 30px -22px rgba(18,24,38,.35);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1119; --surface:#141A26; --surface-2:#10151F; --ink:#E6EAF2; --ink-soft:#A3ADC0; --ink-faint:#6E798F;
  --line:#242D3E; --line-2:#344058; --grid:#1A2130;
  --accent:#8EA2FF; --accent-ink:#0D1119; --accent-soft:#1A2242; --accent-line:#33427A;
  --amber:#F0A83A; --amber-soft:#2D2313;
  --ok:#5CC993; --ok-soft:#11271D; --bad:#F27D71; --bad-soft:#2E1815; --warn:#E5B456; --warn-soft:#2A2112;
  --conc:#2B3345; --earth:#28241E; --earth2:#332C22; --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px -24px rgba(0,0,0,.9); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1119; --surface:#141A26; --surface-2:#10151F; --ink:#E6EAF2; --ink-soft:#A3ADC0; --ink-faint:#6E798F;
  --line:#242D3E; --line-2:#344058; --grid:#1A2130;
  --accent:#8EA2FF; --accent-ink:#0D1119; --accent-soft:#1A2242; --accent-line:#33427A;
  --amber:#F0A83A; --amber-soft:#2D2313;
  --ok:#5CC993; --ok-soft:#11271D; --bad:#F27D71; --bad-soft:#2E1815; --warn:#E5B456; --warn-soft:#2A2112;
  --conc:#2B3345; --earth:#28241E; --earth2:#332C22; --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px -24px rgba(0,0,0,.9); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:15.5px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--f-disp);text-wrap:balance;margin:0;line-height:1.15}
a{color:var(--accent)}
b,strong{font-weight:650}
sub,sup{line-height:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.eyebrow{font:600 11px/1.2 var(--f-disp);font-stretch:88%;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-faint)}

/* ---------- estructura ---------- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;padding:18px 14px;gap:16px;overflow-y:auto}
.brand{display:flex;flex-direction:column;gap:8px;padding:2px 6px 14px;border-bottom:1px solid var(--line)}
.brand canvas{width:100%;height:38px;display:block}
.brand h1{font-size:19px;font-weight:800;font-stretch:108%;letter-spacing:-.01em}
.brand p{margin:0;font:500 11.5px/1.35 var(--f-mono);color:var(--ink-faint)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;border-radius:8px;padding:9px 10px;cursor:pointer;color:var(--ink-soft);font:600 14px var(--f-disp);font-stretch:96%;text-align:left}
.nav button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav .cnt{margin-left:auto;font:500 11px var(--f-mono);color:var(--ink-faint)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:12px 6px 0;border-top:1px solid var(--line)}
.meter{height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);width:0;transition:width .4s}
.side-foot .lbl{display:flex;justify-content:space-between;font:500 11.5px var(--f-mono);color:var(--ink-soft)}
.themebtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 10px;cursor:pointer;font:600 12.5px var(--f-disp);color:var(--ink-soft)}
.themebtn:hover{color:var(--ink);border-color:var(--accent-line)}
main{min-width:0;padding-block:28px 80px;padding-inline:clamp(16px,3.2vw,44px)}
.view{max-width:1040px;margin:0 auto}
.view[hidden]{display:none!important}
.vhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:20px}
.vhead h2{font-size:clamp(24px,3vw,30px);font-weight:800;font-stretch:104%;letter-spacing:-.015em}
.vhead p{margin:6px 0 0;color:var(--ink-soft);max-width:62ch}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:auto;flex-direction:column;padding:10px 16px 0;gap:8px;border-right:0;border-bottom:1px solid var(--line);overflow:visible}
  .brand{flex-direction:row;align-items:center;padding:0;border:0;gap:12px}
  .brand canvas{width:70px;height:28px}
  .brand h1{font-size:16px}
  .brand p{display:none}
  .nav{flex-direction:row;overflow-x:auto;scrollbar-width:none;gap:2px;margin:0 -16px;padding:0 12px 8px}
  .nav::-webkit-scrollbar{display:none}
  .nav button{width:auto;flex:none;padding:7px 10px;font-size:13px}
  .nav button svg{display:none}
  .nav .cnt{display:none}
  .side-foot{display:none}
  .mob-theme{display:flex!important;margin-left:auto}
  main{padding-block:18px 70px}
}
.mob-theme{display:none}

/* ---------- componentes ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer;font:600 13.5px var(--f-disp);font-stretch:96%;white-space:nowrap;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--accent-line);background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-soft)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 11px;cursor:pointer;font:600 12.5px var(--f-disp);color:var(--ink-soft)}
.chip:hover{border-color:var(--accent-line);color:var(--ink)}
.chip.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.chip i{font:500 11px var(--f-mono);font-style:normal;opacity:.7}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;font:600 10.5px/1 var(--f-disp);font-stretch:90%;letter-spacing:.07em;text-transform:uppercase;padding:4px 7px;border-radius:5px;border:1px solid var(--line);color:var(--ink-faint);white-space:nowrap}
.tag.k-vf{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.tag.k-mc,.tag.k-multi{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.tag.k-num{color:var(--amber);background:var(--amber-soft);border-color:transparent}
.tag.k-match,.tag.k-fill,.tag.k-order{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.tag.graf{color:var(--amber);border-color:var(--amber)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.field .lab{font:600 11px var(--f-disp);font-stretch:90%;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)}
.inp,select.inp{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0;width:100%;min-height:40px}
.inp:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
textarea.inp{min-height:84px;resize:vertical;line-height:1.5}
input[type=range]{width:100%;accent-color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}
.muted{color:var(--ink-soft)}
.faint{color:var(--ink-faint)}
.empty{padding:40px 16px;text-align:center;color:var(--ink-soft);border:1px dashed var(--line-2);border-radius:var(--r)}

/* ---------- inicio ---------- */
.rotulo{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);border:1.5px solid var(--ink);background:var(--surface);border-radius:4px;overflow:hidden}
.rot-main{padding:22px 24px 20px;border-right:1.5px solid var(--ink);display:flex;flex-direction:column;gap:12px;position:relative;min-width:0}
.rot-main h2{font-size:clamp(28px,4.6vw,46px);font-weight:800;font-stretch:112%;letter-spacing:-.025em;line-height:1}
.rot-main h2 span{display:block;font-weight:500;font-stretch:84%;color:var(--ink-soft);font-size:.48em;letter-spacing:0;margin-top:8px;line-height:1.2}
.rot-main canvas{width:100%;height:64px;display:block;margin-top:auto}
.rot-cells{display:grid;grid-template-columns:1fr 1fr}
.rot-cells div{padding:10px 14px;border-bottom:1px solid var(--line-2);border-right:1px solid var(--line-2);min-width:0}
.rot-cells div:nth-child(2n){border-right:0}
.rot-cells div:nth-last-child(-n+2){border-bottom:0}
.rot-cells .eyebrow{display:block;margin-bottom:3px}
.rot-cells b{font:700 22px/1.1 var(--f-disp);font-stretch:100%;font-variant-numeric:tabular-nums}
.rot-cells small{display:block;font:500 11px var(--f-mono);color:var(--ink-faint)}
@media (max-width:720px){.rotulo{grid-template-columns:1fr}.rot-main{border-right:0;border-bottom:1.5px solid var(--ink)}}
.home-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;margin-top:22px}
@media (max-width:860px){.home-grid{grid-template-columns:1fr}}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0}
.box h3{font-size:17px;font-weight:750;margin-bottom:12px}
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;counter-reset:p}
.plan li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.plan li:last-child{border-bottom:0}
.plan li::before{counter-increment:p;content:counter(p);width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font:700 12px var(--f-mono)}
.plan b{display:block;font-family:var(--f-disp);font-size:14.5px}
.plan span{font-size:13.5px;color:var(--ink-soft)}
.tprog{display:flex;flex-direction:column;gap:9px}
.tprog .tp{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:4px 10px;align-items:center;cursor:pointer;border-radius:6px}
.tprog .tp:hover .tp-n{color:var(--accent)}
.tp-n{font:600 13px var(--f-disp);font-stretch:96%}
.tp-v{font:500 11.5px var(--f-mono);color:var(--ink-faint);text-align:right}
.bar3{grid-column:1/-1;display:flex;height:7px;border-radius:9px;background:var(--line);overflow:hidden}
.bar3 i{display:block;height:100%}
.bar3 .b-ok{background:var(--ok)}.bar3 .b-bad{background:var(--bad)}.bar3 .b-seen{background:var(--accent-line)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font:500 11.5px var(--f-mono);color:var(--ink-faint);margin-top:12px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.notas{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.notas li{font-size:14px;padding:10px 12px;border-radius:8px;background:var(--amber-soft);border-left:3px solid var(--amber)}
.notas li b{font-family:var(--f-disp)}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px;margin-top:18px}
.qa{display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 16px;cursor:pointer;transition:border-color .15s,transform .15s}
.qa:hover{border-color:var(--accent-line);transform:translateY(-1px)}
.qa b{font:750 15px var(--f-disp)}
.qa span{font-size:13px;color:var(--ink-soft)}
.qa .eyebrow{color:var(--accent)}

/* ---------- guía ---------- */
.guide{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;align-items:start}
.toc{position:sticky;top:20px;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 40px);overflow:auto}
.toc button{border:0;background:none;text-align:left;padding:7px 10px;border-radius:7px;cursor:pointer;font:600 13.5px/1.3 var(--f-disp);color:var(--ink-soft);display:grid;grid-template-columns:22px 1fr;gap:4px}
.toc button span{font:500 11px var(--f-mono);color:var(--ink-faint);padding-top:2px}
.toc button:hover{background:var(--surface);color:var(--ink)}
.toc button.on{background:var(--accent-soft);color:var(--accent)}
@media (max-width:900px){.guide{grid-template-columns:1fr}.toc{position:static;flex-direction:row;overflow-x:auto;max-height:none;padding-bottom:4px}.toc button{flex:none}}
.chap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(18px,3vw,30px)}
.chap>header{display:flex;align-items:baseline;gap:12px;border-bottom:1.5px solid var(--ink);padding-bottom:12px;margin-bottom:6px}
.chap>header .num{font:700 13px var(--f-mono);color:var(--accent)}
.chap>header h3{font-size:clamp(21px,2.6vw,26px);font-weight:800;font-stretch:104%}
.tsec{padding:18px 0;border-bottom:1px solid var(--line)}
.tsec:last-of-type{border-bottom:0}
.tsec h4{font-size:17px;font-weight:750;margin-bottom:10px;display:flex;gap:10px;align-items:baseline}
.tsec h4 .n{font:600 12px var(--f-mono);color:var(--ink-faint)}
.tsec p,.tsec ul,.tsec ol{max-width:72ch}
.tsec ul,.tsec ol{padding-left:20px}
.tsec li{margin:3px 0}
.chap-foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.eq{display:block;font:500 14px/1.6 var(--f-mono);background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;padding:9px 12px;margin:10px 0;overflow-x:auto;white-space:nowrap;max-width:100%}
.sym{font-size:13.5px;color:var(--ink-soft);margin:6px 0 10px}
.callout{background:var(--amber-soft);border-radius:8px;padding:10px 14px;margin:12px 0;font-size:14.5px;max-width:72ch}
.callout b{color:var(--amber);margin-right:4px}
.tblwrap{overflow-x:auto;margin:12px 0;max-width:100%}
.tbl{border-collapse:collapse;width:100%;font-size:13.5px;min-width:420px}
.tbl th{font:600 11px var(--f-disp);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);text-align:left;padding:7px 10px;border-bottom:1.5px solid var(--ink)}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl.num td,.tbl.compact td{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tbl.compact{min-width:0}
.tbl tfoot td{font-family:var(--f-mono);font-weight:600;border-top:1.5px solid var(--ink)}
.steps{counter-reset:s;list-style:none;padding-left:0!important}
.steps li{position:relative;padding-left:34px;margin:8px 0}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:1px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--surface);font:700 11px/22px var(--f-mono);text-align:center}
details.more{margin:10px 0}
details.more summary{cursor:pointer;font:600 13.5px var(--f-disp);color:var(--accent)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:12px;margin-top:8px}
.gcard{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:4px;background:var(--surface-2)}
.gcard .fig{margin:0}
.gcard b{font:700 13.5px var(--f-disp)}
.gcard span{font-size:12.5px;color:var(--ink-soft);line-height:1.45}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}

/* ---------- figuras ---------- */
.fig{margin:14px 0;max-width:100%}
.fig svg{display:block;width:100%;max-width:560px;height:auto}
.fig svg.sm{max-width:240px}.fig svg.md{max-width:420px}
svg.plot{display:block;width:100%;max-width:640px;height:auto}
#gStage,#bList,#simHost .panel,.qrow{scroll-margin-top:24px}
@media (max-width:900px){#gStage,#bList,#simHost .panel,.qrow{scroll-margin-top:110px}}
.fig figcaption{font-size:12.5px;color:var(--ink-faint);margin-top:6px;max-width:68ch;line-height:1.5}
.pl-grid{stroke:var(--grid);stroke-width:1}
.pl-axis{stroke:var(--ink-soft);stroke-width:1.2}
.pl-tick{font:10px var(--f-mono);fill:var(--ink-soft)}
.pl-lab{font:600 11px var(--f-disp);fill:var(--ink)}
.pl-note{font:500 10.5px var(--f-mono);fill:var(--ink-soft)}
.pl-badge{font:700 12px var(--f-disp);fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:4px}
.on-bar{fill:var(--accent-ink);font-weight:600}
.n-ac{fill:var(--accent)}.n-am{fill:var(--amber)}.n-gr{fill:var(--ok)}.n-rd{fill:var(--bad)}
.s-ac,.s-am,.s-gr,.s-rd,.s-ink{fill:none;stroke-width:2;stroke-linejoin:round}
.s-ac{stroke:var(--accent)}.s-am{stroke:var(--amber)}.s-gr{stroke:var(--ok)}.s-rd{stroke:var(--bad)}.s-ink{stroke:var(--ink)}
.dash{stroke-dasharray:5 4}
.pl-area{fill:var(--accent-soft);stroke:none}
.pl-guide{stroke:var(--ink-faint);stroke-width:1;stroke-dasharray:3 3;fill:none}
.pl-guide2{stroke:var(--amber);stroke-width:1.2;stroke-dasharray:4 3;fill:none}
.pl-dim{stroke:var(--ink-soft);stroke-width:1}
.pl-dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.dot-am{fill:var(--amber)}.dot-gr{fill:var(--ok)}.dot-rd{fill:var(--bad)}
.bar-ac{fill:var(--accent)}.bar-am{fill:var(--amber)}
.d-ln{stroke:var(--ink);stroke-width:2;fill:none;stroke-linecap:round}
.d-thinc{stroke:var(--ink);stroke-width:1;fill:none;stroke-dasharray:2 2}
.d-ln2{stroke:var(--ink);stroke-width:3.4;stroke-linecap:round}
.d-thin{stroke:var(--ink-faint);stroke-width:1}
.d-dash{stroke:var(--ink-faint);stroke-width:1.2;stroke-dasharray:4 3;fill:none}
.d-gnd{stroke:var(--ink-soft);stroke-width:1.5}
.d-wall{fill:url(#hatch);stroke:var(--ink-faint);stroke-width:.8}
.hatch-ln{stroke:var(--ink-faint);stroke-width:1}

<script>
/* ===== utilidades ===== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9ñ.\s/-]/g, ' ').replace(/\s+/g, ' ').trim();
const plain = s => String(s).replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
const rnd = (a, b, step = 1) => { const n = Math.round((b - a) / step); return +(a + step * Math.floor(Math.random() * (n + 1))).toFixed(6); };
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const f = (x, d = 2) => { if (!isFinite(x)) return '—'; let s = (+x).toFixed(d); if (s.includes('.')) s = s.replace(/0+$/, '').replace(/\.$/, ''); return s === '-0' ? '0' : s; };
const fx = (x, d = 2) => (+x).toFixed(d);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
function interp(xs, ys, x) { if (x <= xs[0]) return ys[0]; if (x >= xs[xs.length - 1]) return ys[ys.length - 1]; for (let i = 0; i < xs.length - 1; i++) if (x <= xs[i + 1]) return lerp(ys[i], ys[i + 1], (x - xs[i]) / (xs[i + 1] - xs[i])); }
const ROM = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII'];

  s += `<line class="pl-axis" x1="60" y1="20" x2="60" y2="215"/><line class="pl-axis" x1="60" y1="215" x2="400" y2="215"/>`;
  for (let i = -3; i <= 4; i++) { s += `<line class="pl-grid" x1="${60 + i * 60}" y1="215" x2="${60 + i * 60 + 195}" y2="20"/><line class="pl-grid" x1="${60 + i * 60}" y1="20" x2="${60 + i * 60 + 195}" y2="215"/>`; }
  s = `<clipPath id="ctr"><rect x="60" y="20" width="340" height="195"/></clipPath><g clip-path="url(#ctr)">${s}</g>`;
  s += `<path class="s-ac" d="M64 200 C 110 120, 160 60, 225 58 C 285 57, 330 120, 398 182"/>`;
  s += D.t(66, 14, 'S<tspan baseline-shift="sub" font-size="8">v</tspan> (escala log)', 'd-ts') + D.t(400, 230, 'T (escala log)', 'd-ts', 'end');
  s += D.t(96, 150, 'S<tspan baseline-shift="sub" font-size="8">a</tspan> ≈ cte.', 'd-t d-ta', 'end') + D.t(360, 136, 'S<tspan baseline-shift="sub" font-size="8">d</tspan> ≈ cte.', 'd-t d-ta', 'start').replace('x="360"', 'x="346"');
  s += D.t(66, 246, '↗ diagonales: S<tspan baseline-shift="sub" font-size="8">a</tspan> constante   ↘ diagonales: S<tspan baseline-shift="sub" font-size="8">d</tspan> constante', 'd-ts');
  return fig(S(W, H, s, 'Representación tripartita'), 'Gráfica tripartita en escala logarítmica: T en abscisas, S<sub>v</sub> en ordenadas; las diagonales ascendentes son líneas de S<sub>a</sub> constante y las descendentes de S<sub>d</sub> constante. Posible porque S<sub>a</sub> = ω·S<sub>v</sub> y S<sub>d</sub> = S<sub>v</sub>/ω. En periodos muy cortos S<sub>a</sub> tiende a la aceleración máxima del terreno; en periodos muy largos S<sub>d</sub> tiende a su desplazamiento máximo.');
},
aislamiento() {
  const e = NSR.esp({ Aa: .25, Av: .25, Fa: 1.15, Fv: 1.55, I: 1 });
  const p = new Plot({ x: [0, 4], y: [0, 0.8], xt: [0, 0.5, 1, 1.5, 2, 2.5, 3, 3.5, 4], yt: [0, .2, .4, .6, .8], xl: 'T (s)', yl: 'Sa (g)', yd: 1, h: 250 });
  p.fn(e.Sa, 0.01, 4, 's-ac', 400);
  const T1 = 0.5, T2 = 2.8; p.line(T1, 0, T1, e.Sa(T1), 'pl-guide').line(T2, 0, T2, e.Sa(T2), 'pl-guide');
  p.dot(T1, e.Sa(T1), 'pl-dot dot-rd').dot(T2, e.Sa(T2), 'pl-dot dot-gr');
  p.text(T1, e.Sa(T1), 'base fija', 'pl-note n-rd', 'start', 8, -8).text(T2, e.Sa(T2), 'aislada', 'pl-note n-gr', 'start', 6, -10);
  p.raw(`<path class="d-am" d="M${p.sx(0.75)} ${p.sy(0.66)} Q ${p.sx(1.9)} ${p.sy(0.74)} ${p.sx(2.6)} ${p.sy(0.25)}" marker-end="url(#am)"/>`);
  return fig(p.svg('Aislamiento de base en el espectro'), 'El aislamiento alarga el periodo: la estructura pasa de la meseta a la rama descendente y la aceleración espectral cae varias veces.');
},
ductilidad() {

  p.pts([[0, 0], [2, 1], [9, 1.08]], 's-ac').pts([[9, 1.08], [9.6, 0.7]], 's-ac dash');
  p.line(2, 0, 2, 1, 'pl-guide').line(9, 0, 9, 1.08, 'pl-guide');
  p.text(2, 0, 'δ<tspan baseline-shift="sub" font-size="8">y</tspan>', 'pl-tick', 'middle', 0, 15).text(9, 0, 'δ<tspan baseline-shift="sub" font-size="8">u</tspan>', 'pl-tick', 'middle', 0, 15);
  p.text(1, 0.6, 'elástico', 'pl-note', 'end').text(5.5, 1.06, 'rango inelástico', 'pl-note', 'middle', 0, -8).text(5.5, 0.45, 'μ = δ<tspan baseline-shift="sub" font-size="8">u</tspan> / δ<tspan baseline-shift="sub" font-size="8">y</tspan>', 'pl-note n-am', 'middle');
  return fig(p.svg('Curva fuerza-desplazamiento y ductilidad'), 'Ductilidad de desplazamiento: cuántas veces el desplazamiento de fluencia puede deformarse la estructura sin perder resistencia.');
},

sismograma() {
  const p = new Plot({ x: [0, 40], y: [-1.1, 1.1], xt: [0, 5, 10, 15, 20, 25, 30, 35, 40], yt: [], xl: 't (s)', yl: 'registro', h: 200, xd: 0 });
  const tp = 8, ts = 19; const acc = synthAcc(7, 40, 0.04, true);
  p.pts(acc.map(([t, a]) => { const env = t < tp ? 0.02 : (t < ts ? 0.3 * Math.exp(-(t - tp) / 18) : 1.0 * Math.exp(-(t - ts) / 9)); return [t, a * env]; }), 's-ac');
  p.line(tp, -1.05, tp, 1.05, 'pl-guide').line(ts, -1.05, ts, 1.05, 'pl-guide').text(tp, 0.9, 'llega P', 'pl-note n-am', 'start', 4).text(ts, 0.9, 'llega S', 'pl-note n-am', 'start', 4);
  return fig(p.svg('Sismograma con llegada de ondas P y S'), 'El intervalo t<sub>S</sub> − t<sub>P</sub> crece con la distancia al foco: d = Δt·V<sub>P</sub>·V<sub>S</sub>/(V<sub>P</sub> − V<sub>S</sub>).');
},
fheK() {
  const W = 440, H = 230; let s = ''; const n = 5, hs = 34, y0 = 200;
  const draw = (x0, k, lab) => {
    let t = D.gnd(x0 - 10, x0 + 60, y0) + D.frame(x0, y0, 1, n, 50, hs);
    const tot = [1, 2, 3, 4, 5].reduce((a, i) => a + Math.pow(i, k), 0);
    for (let i = 1; i <= n; i++) { const L = 95 * Math.pow(i, k) / tot * (k === 2 ? 1.6 : 1.4) + 6; t += D.arrow(x0 - L - 6, y0 - i * hs, x0 - 4, y0 - i * hs, 'd-am', 'am'); }
    return t + D.t(x0 + 25, 224, lab, 'd-ts', 'middle');
  };
  s += draw(120, 1, 'k = 1 (T ≤ 0.5 s): triangular') + draw(330, 2, 'k = 2 (T > 2.5 s): parabólica');
  return fig(S(W, H, s, 'Distribución de fuerzas FHE'), 'F<sub>x</sub> = C<sub>vx</sub>·V<sub>s</sub>, con C<sub>vx</sub> = m<sub>x</sub>·h<sub>x</sub><sup>k</sup> / Σ m<sub>i</sub>·h<sub>i</sub><sup>k</sup>. Al aumentar k la fuerza se concentra en los pisos altos.');
},

fallas(which) {
  const one = (x, y, tipo) => {
    let s = '';
    if (tipo === 'trans') {
      s += `<rect class="d-earth" x="${x}" y="${y}" width="150" height="110"/><line class="d-hl" x1="${x}" y1="${y + 55}" x2="${x + 150}" y2="${y + 55}"/>`;
      s += D.arrow(x + 95, y + 30, x + 40, y + 30, 'd-ac', 'ar') + D.arrow(x + 55, y + 80, x + 110, y + 80, 'd-ac', 'ar');
      s += D.t(x + 75, y + 128, 'Transcurrente (planta)', 'd-t', 'middle');
      return s;
    }
    s += `<path class="d-earth" d="M${x} ${y + 20} H${x + 66} L${x + 46} ${y + 110} H${x}Z"/><path class="d-earth2" d="M${x + 74} ${y + 20} H${x + 150} V${y + 110} H${x + 54}Z"/>`;
    s += `<line class="d-hl" x1="${x + 70}" y1="${y + 12}" x2="${x + 48}" y2="${y + 116}"/>`;
    if (tipo === 'normal') s += D.arrow(x + 104, y + 52, x + 92, y + 90, 'd-ac', 'ar') + D.arrow(x + 26, y + 92, x + 36, y + 52, 'd-ac', 'ar') + D.arrow(x - 4, y + 4, x - 24, y + 4, 'd-am', 'am') + D.arrow(x + 154, y + 4, x + 174, y + 4, 'd-am', 'am');
    else s += D.arrow(x + 92, y + 90, x + 104, y + 52, 'd-ac', 'ar') + D.arrow(x + 36, y + 52, x + 26, y + 92, 'd-ac', 'ar') + D.arrow(x - 24, y + 4, x - 4, y + 4, 'd-am', 'am') + D.arrow(x + 174, y + 4, x + 154, y + 4, 'd-am', 'am');
    s += D.t(x + 110, y + 40, 'colgante', 'd-ts', 'middle') + D.t(x + 22, y + 40, 'yacente', 'd-ts', 'middle');
    s += D.t(x + 75, y + 128, tipo === 'normal' ? 'Normal (tracción)' : 'Inversa (compresión)', 'd-t', 'middle');
    return s;
  };
  if (which) { const nm = { normal: 'Bloque', inversa: 'Bloque', trans: 'Bloque' }; return S(220, 150, one(35, 6, which).replace(/<text[^>]*>(Normal|Inversa|Transcurrente)[^<]*<\/text>/, ''), 'Falla geológica'); }
  return fig(S(560, 150, one(30, 6, 'normal') + one(210, 6, 'inversa') + one(395, 6, 'trans'), 'Tipos de falla'), 'Flechas azules: movimiento relativo de los bloques. Flechas ámbar: régimen de esfuerzos (tracción o compresión). En la transcurrente el movimiento es horizontal.');
},

rigid4(only) {
  const one = (x, k) => {
    const gy = 160; let s = D.gnd(x - 8, x + 102, gy) + D.frame(x, gy, 2, 3, 47, 42);
    if (k === 1) s += [0, 1, 2].map(i => [1, 2, 3].map(j => `<circle class="d-node" cx="${x + i * 47}" cy="${gy - 42 * j}" r="3"/>`).join('')).join('');
    if (k === 2) for (let j = 0; j < 3; j++) s += D.brace(x + 47, gy - 42 * (j + 1), 47, 42);
    if (k === 3) for (let j = 0; j < 3; j++) for (let i = 0; i < 2; i++) s += D.infill(x + i * 47, gy - 42 * (j + 1), 47, 42);
    if (k === 4) s += D.conc(x + 47, gy - 126, 47, 126);
    return s;
  };
  const names = ['', ['1. Pórticos', 'rígidos'], ['2. Pórticos con', 'contravientos'], ['3. Muros de', 'mampostería'], ['4. Muros de', 'concreto']];
  if (only) return S(130, 170, one(14, only), 'Sistema de rigidización').replace('class="draw"', 'class="draw sm"');
  let s = ''; [1, 2, 3, 4].forEach((k, i) => { s += one(20 + i * 140, k) + D.t(20 + i * 140 + 47, 182, names[k][0], 'd-ts', 'middle') + D.t(20 + i * 140 + 47, 196, names[k][1], 'd-ts', 'middle'); });
  return fig(S(580, 205, s, 'Rigidización lateral'), 'Rigidización lateral de edificios (presentación del curso): de la flexibilidad del pórtico rígido a la gran rigidez de los muros de concreto.');

const LET = ['A', 'B', 'C', 'D'];
function randSpec(opts = {}) {
  const c = opts.city || pick(NSR.ciudades.filter(c => c[1] >= 0.1)); const soil = opts.soil || pick(['B', 'C', 'D', 'E']); const g = opts.g || pick(['I', 'II', 'III', 'IV']);

  return { city: c[0], soil, g, p, e: NSR.esp(p) };
}
function specPlot(sp, o = {}) {
  const e = sp.e, ymax = Math.ceil((e.plateau * 1.18) * 10) / 10, tmax = o.tmax || 4;
  const yt = []; for (let y = 0; y <= ymax + 1e-9; y += (ymax > 1.2 ? 0.2 : 0.1)) yt.push(+y.toFixed(2));
  const xt = []; for (let x = 0; x <= tmax + 1e-9; x += 0.5) xt.push(x);
  const p = new Plot({ x: [0, tmax], y: [0, ymax], xt, yt, xl: 'T (s)', yl: 'Sa (g)', yd: 2, h: o.h || 270, pad: [48, 18, 22, 40], yf: y => (yt.length > 9 && Math.round(y * 10) % 2) ? '' : f(y, 2) });
  if (o.area !== false) p.area(e.Sa, 0, tmax);
  p.fn(e.Sa, 0.001, tmax, 's-ac', 400);
  return p;
}

  do { ps = [rnd(58, 80, 1)]; let rem = 98 - ps[0]; for (let i = 1; i < 6; i++) { const v = Math.max(1, Math.round(rem * (0.35 + Math.random() * 0.4))); ps.push(v); rem -= v; if (rem < 2) break; } acc = 0; n = 0; for (const v of ps) { acc += v; n++; if (acc >= 90) break; } } while (acc < 90 || n < 2);
  const cum = ps.reduce((a, v) => { a.push((a.length ? a[a.length - 1] : 0) + v); return a; }, []);
  return { k: 'num', q: `Un análisis modal da las siguientes masas participantes en la dirección X (%): ${ps.map((v, i) => `modo ${i + 1}: ${v}`).join(' · ')}. ¿Cuántos modos como mínimo deben incluirse según la NSR-10?`, num: { v: n, abs: 0.1, u: 'modos' },
    e: `La NSR-10 (A.5.4.2) exige incluir modos hasta acumular al menos el <b>90 %</b> de la masa en cada dirección. Acumulado: ${cum.map((v, i) => `${i + 1} modo${i ? 's' : ''}: ${v} %`).join(' · ')}. Se necesitan <b>${n}</b> modos.` };
} },
{ id: 'E24', t: 'vib', g: 0, title: 'Máquina sobre una estructura: relación de frecuencias', gen() {
  const T = rnd(0.08, 0.6, 0.01), rpm = pick([600, 900, 1200, 1500, 1800, 3600]); const wbar = 2 * Math.PI * rpm / 60, w = 2 * Math.PI / T, b = wbar / w;
  return { k: 'num', q: `Una máquina que gira a ${rpm} rpm se apoya sobre una losa con periodo natural T = ${f(T, 2)} s. Calcule β = ω̄/ω.`, num: { v: b, tol: 0.015, u: '' },
    e: `<span class="eq">ω̄ = 2π·rpm/60 = 2π × ${rpm}/60 = ${f(wbar, 2)} rad/s     ω = 2π/T = ${f(w, 2)} rad/s</span><span class="eq">β = ω̄/ω = ${f(b, 3)}</span><p>${Math.abs(b - 1) < 0.2 ? 'β cercano a 1: <b>riesgo de resonancia</b>; hay que cambiar la rigidez o aislar la máquina.' : b > Math.SQRT2 ? 'β &gt; √2: la fuerza transmitida es menor que la aplicada.' : 'Lejos de resonancia, pero conviene verificar D.'}</p>` };
} },
];


const HIST = [{"id":"H001","t":"fund","src":"Repaso","origen":"hist","r":"Teoría general — Paz, cap. 1","k":"abierta","q":"¿Qué es la dinámica?","e":"Rama de la mecánica que estudia el movimiento de los cuerpos y las fuerzas que lo producen. A diferencia de la estática, las cargas, desplazamientos, velocidades y aceleraciones <b>varían con el tiempo</b>."},{"id":"H002","t":"fund","src":"Repaso","origen":"hist","r":"Teoría general — García, cap. 1","k":"abierta","q":"¿Qué es la dinámica de estructuras?","e":"Área del análisis mecánico de las construcciones que estudia el efecto de las acciones externas variables en el tiempo que producen <b>vibraciones</b>, y determina la respuesta de la estructura —desplazamientos, velocidades, aceleraciones y fuerzas internas— en cada instante."},{"id":"H003","t":"fund","src":"Repaso · 2022-1","origen":"hist","r":"Teoría general — mecánica clásica","k":"abierta","q":"¿En qué se divide la dinámica? Explique cada una.","e":"<ul><li><b>Cinemática:</b> estudia la geometría del movimiento (trayectoria, velocidad, aceleración) en función del tiempo, <em>sin</em> considerar las fuerzas que lo producen.</li>\n <li><b>Cinética:</b> relaciona las fuerzas —origen del movimiento— con las trayectorias que generan, y viceversa.</li></ul>"},{"id":"H004","t":"fund","src":"Repaso","origen":"hist","r":"NSR-10 A.3.6.6 — diafragmas","k":"abierta","q":"Defina la dinámica de los cuerpos rígidos.","e":"Aquella en que se supone que el cuerpo <b>no se deforma en su propio plano</b>: las deformaciones internas se toman nulas. Es la hipótesis de diafragma rígido, con la que cada piso queda descrito por 3 GDL: dos traslaciones (UX, UY) y una rotación (RZ)."},{"id":"H005","t":"fund","src":"Repaso","origen":"hist","r":"NSR-10 A.3.6.6","k":"abierta","q":"Defina la dinámica de los cuerpos flexibles.","e":"Aquella en que el cuerpo presenta <b>deformaciones apreciables en su propio plano</b>, que deben incluirse en el modelo (diafragma flexible). Obliga a considerar GDL adicionales dentro del entrepiso."},{"id":"H006","t":"fund","src":"Repaso","origen":"hist","r":"Teoría general — modelación estructural","k":"abierta","q":"¿Qué es discretización?","e":"Sustituir el sistema continuo real por un modelo con un <b>número finito de grados de libertad</b>: concentrar las masas en nodos y definir qué elementos del sistema estructural se consideran rígidos y cuáles flexibles."},{"id":"H007","t":"fund","src":"Repaso · 2022-1","origen":"hist","r":"Teoría general — SDOF/MDOF","k":"abierta","q":"¿Qué es un grado de libertad?","e":"Número mínimo de <b>desplazamientos independientes</b> necesarios para definir la posición deformada de todas las masas del sistema respecto de su posición original. Equivale a cualquier movimiento posible de los nodos en una dirección no restringida."},{"id":"H008","t":"fund","src":"Repaso","origen":"hist","r":"Teoría general — MDOF","k":"abierta","q":"Defina qué es un sistema con múltiples grados de libertad.","e":"Aquel cuyo movimiento se caracteriza por un <b>número finito de puntos o nodos con masa</b>, con los cuales dicho movimiento queda completamente definido. Tiene tantas frecuencias naturales y tantos modos de vibración como grados de libertad."},{"id":"H009","t":"fund","src":"Repaso","origen":"hist","r":"Teoría general — rigidez lateral","k":"abierta","q":"¿Qué es la rigidez?","e":"Medida de la resistencia que ofrece un elemento o una estructura a deformarse: <b>fuerza necesaria para producir un desplazamiento unitario.</b>\n <span class=\"eq\">k = F / δ   [kN/m]   ·   pórtico biempotrado: k = 12·E·I / h³ por columna</span>"},{"id":"H010","t":"fund","src":"Repaso","origen":"hist","r":"Teoría general — SDOF","k":"abierta","q":"¿Qué es la frecuencia de vibración?","e":"Número de ciclos completos por unidad de tiempo. Es el inverso del periodo.\n <span class=\"eq\">f = 1 / T  [Hz]   ·   ω = 2π·f = √(k / m)  [rad/s]</span>"},{"id":"H011","t":"fund","src":"Moodle 2020-07 · Moodle 2020-11 · Repaso","origen":"hist","r":"Teoría general · NSR-10 A.4.2 (Ta = Ct·h^α)","k":"abierta","q":"¿De qué depende el periodo de una estructura?","e":"Únicamente de la <b>masa</b> y de la <b>rigidez</b>:\n <span class=\"eq\">T = 2π · √(m / k)</span>\n No depende de la amplitud del movimiento ni, en la práctica, del amortiguamiento: el periodo amortiguado T<sub>D</sub> = T / √(1 − ξ²) difiere menos del 2 % para ξ ≤ 20 %. La altura influye solo porque al variar el número de pisos cambian m y k."},{"id":"H012","t":"fund","src":"Moodle 2020-07","origen":"hist","r":"Teoría general — T = 2π√(m/k)","k":"mc","q":"El periodo de una estructura depende de:","o":["rigidez y material","solo la rigidez","masa y material","masa y frecuencia","Ninguna de las anteriores"],"a":4,"e":"<b>e) Ninguna de las anteriores.</b> Depende de la masa y de la rigidez; ninguna opción reúne las dos."},{"id":"H013","t":"fund","src":"Moodle 2020-11","origen":"hist","r":"Teoría general — SDOF","k":"vf","q":"El periodo de una estructura depende de: masa, rigidez, altura y amortiguamiento.","a":false,"e":"<b>FALSO.</b> Depende de masa y rigidez. El amortiguamiento no altera de forma apreciable el periodo y la altura solo actúa indirectamente, a través de m y k."},{"id":"H014","t":"fund","src":"2024-3","origen":"hist","r":"Teoría general — SDOF","k":"vf","q":"El periodo de un sistema de un grado de libertad depende de su masa y de su rigidez.","a":true,"e":"<b>VERDADERO.</b> T = 2π√(m/k)."},{"id":"H015","t":"fund","src":"2021-L · 2021-M · 2024-3 · Repaso","origen":"hist","r":"NSR-10 A.1.3.3 y A.3.1 — capacidad de disipación de energía","k":"abierta","q":"Defina la propiedad ductilidad.","e":"Capacidad de un material o de una estructura para <b>deformarse en el rango inelástico sin perder resistencia apreciable</b>, disipando energía mediante deformaciones considerables. Es la propiedad que justifica reducir las fuerzas sísmicas elásticas mediante el coeficiente R."},{"id":"H016","t":"fund","src":"2021-L · 2024-3 · Repaso","origen":"hist","r":"Teoría general — tipos de excitación dinámica","k":"abierta","q":"Escriba cuatro fuerzas dinámicas distintas a sismo y viento.","e":"<ul><li><b>Equipos mecánicos</b> (masas rotatorias desbalanceadas, motores, bombas).</li>\n <li><b>Impacto</b> (choque vehicular, caída de cargas, hincado de pilotes).</li>\n <li><b>Explosiones</b> y voladuras.</li>\n <li><b>Oleaje</b> y empujes hidrodinámicos.</li></ul>\n <em>También válidas: tránsito vehicular o ferroviario y multitudes en movimiento (danza, marcha).</em>"},{"id":"H017","t":"fund","src":"2021-L · 2022-1 · 2024-3","origen":"hist","r":"Teoría general — SDOF","k":"fill","q":"Existen dos tipos de vibración: [[1]] y [[2]].","e":"<b>Vibración libre</b> (el sistema oscila sin fuerza externa, tras un desplazamiento o velocidad inicial; puede ser amortiguada o no amortiguada) y <b>vibración forzada</b> (el sistema responde a una excitación externa que actúa durante el movimiento).","a":[["libre","vibracion libre"],["forzada","vibracion forzada"]],"any":true},{"id":"H018","t":"fund","src":"2021-L · 2021-M · 2024-3 · Repaso","origen":"hist","r":"Teoría general — vibración forzada armónica","k":"abierta","q":"¿Qué es una fuerza armónica?","e":"Fuerza <b>periódica de frecuencia constante</b> que puede representarse mediante una función seno o coseno:\n <span class=\"eq\">p(t) = Po · sen(ω̄·t)</span>\n Lo constante es la frecuencia; la magnitud, la velocidad y la aceleración varían continuamente. Ejemplo típico: un motor con masa excéntrica."},{"id":"H019","t":"fund","src":"Moodle 2020-11","origen":"hist","r":"Teoría general — vibración forzada armónica","k":"vf","q":"Una fuerza armónica es aquella que se aplica con frecuencia y velocidad constante.","a":false,"e":"<b>FALSO.</b> La frecuencia sí es constante, pero la velocidad de la masa varía en forma sinusoidal a lo largo del ciclo."},{"id":"H020","t":"fund","src":"2021-L · 2021-M · 2022-1 · 2024-3 · Repaso","origen":"hist","r":"Teoría general — carga impulsiva","k":"abierta","q":"¿Cómo define una fuerza impulsiva?","e":"Fuerza de <b>gran magnitud aplicada durante un intervalo de tiempo muy corto</b> comparado con el periodo natural de la estructura (t<sub>d</sub> / T pequeño). La respuesta máxima ocurre en la fase de vibración libre posterior al impulso, y el amortiguamiento casi no alcanza a disipar energía, por lo que suele despreciarse."},{"id":"H021","t":"fund","src":"Moodle 2020-11","origen":"hist","r":"Teoría general — carga impulsiva","k":"vf","q":"Fuerza impulsiva es aquella de gran magnitud que actúa durante un periodo de tiempo.","a":false,"e":"<b>FALSO.</b> La definición está incompleta: debe actuar durante un periodo de tiempo <b>muy corto</b> respecto del periodo natural del sistema. Sin esa condición no es impulsiva."},{"id":"H022","t":"fund","src":"Moodle 2020-07","origen":"hist","r":"Teoría general — carga impulsiva","k":"vf","q":"Una fuerza impulsiva es aquella que se aplica con frecuencia constante.","a":false,"e":"<b>FALSO.</b> Esa es la definición de fuerza armónica. La impulsiva no es periódica: es un pulso de corta duración."},{"id":"H023","t":"fund","src":"Moodle 2020-11 · 2022-1 · Repaso","origen":"hist","r":"Teoría general — ecuación de movimiento","k":"abierta","q":"¿Qué diferencia existe entre un análisis dinámico y uno estático?","e":"En el <b>estático</b> las cargas se aplican lentamente, no generan fuerzas de inercia ni de amortiguamiento y la respuesta es única e independiente del tiempo. En el <b>dinámico</b> la carga varía con el tiempo, aparecen fuerzas de inercia (m·ü) y de amortiguamiento (c·u̇), y la respuesta —desplazamientos, velocidades, aceleraciones y fuerzas internas— es una función del tiempo de la que se extrae el máximo.\n <span class=\"eq\">m·ü + c·u̇ + k·u = p(t)</span>"},{"id":"H024","t":"fund","src":"Moodle 2020-11","origen":"hist","r":"Teoría general","k":"mc","q":"La diferencia entre análisis dinámico y estático es:","o":["en el dinámico la variable tiempo hace variar la respuesta de la estructura","en el estático el espectro es dependiente del tiempo y solo da un periodo","ninguna de las anteriores","en el análisis estático el espectro difiere en 5 % del amortiguamiento crítico del dinámico"],"a":0,"e":"<b>a) En el dinámico la variable tiempo hace variar la respuesta de la estructura.</b>"},{"id":"H025","t":"vib","src":"2021-L · 2024-3 · Repaso","origen":"hist","r":"Teoría general — mecanismos de disipación","k":"abierta","q":"Liste tres sistemas (tipos) de amortiguamiento.","e":"<b>Viscoso</b>, <b>de Coulomb</b> (fricción seca) e <b>histerético</b> (estructural o del material)."},{"id":"H026","t":"vib","src":"Repaso · 2022-1","origen":"hist","r":"NSR-10 A.2.6 (ξ = 5 %) · teoría SDOF","k":"abierta","q":"¿Qué es un amortiguamiento viscoso?","e":"Pérdida de energía por una fuerza de amortiguamiento <b>proporcional a la velocidad</b> y de signo opuesto a ella: f<sub>D</sub> = c·u̇. Es el modelo matemáticamente más sencillo y el que adopta la NSR-10 al fijar ξ = 5 %."},{"id":"H027","t":"vib","src":"2022-1 · 2024-3 · Repaso","origen":"hist","r":"Teoría general — fricción de Coulomb","k":"abierta","q":"Explique el amortiguamiento de Coulomb.","e":"Amortiguamiento por <b>fricción seca</b> entre dos superficies en contacto. La fuerza es de magnitud constante (μ·N), actúa en la dirección del desplazamiento y con signo opuesto a la velocidad. Produce un decaimiento <b>lineal</b> de la amplitud, no exponencial."},{"id":"H028","t":"vib","src":"2024-3","origen":"hist","r":"Teoría general","k":"vf","q":"El amortiguamiento de Coulomb corresponde al fenómeno físico de fricción entre superficies secas.","a":true,"e":"<b>VERDADERO.</b>"},{"id":"H029","t":"vib","src":"Repaso · 2022-1","origen":"hist","r":"Teoría general — amortiguamiento estructural","k":"abierta","q":"¿Qué es un amortiguamiento histerético?","e":"Disipación de energía por el <b>comportamiento del propio material</b> al deformarse cíclicamente: la fuerza de amortiguamiento es proporcional al desplazamiento y de signo opuesto a la velocidad. Se manifiesta como el área encerrada por los ciclos de histéresis fuerza–deformación."},{"id":"H030","t":"vib","src":"Repaso","origen":"hist","r":"Teoría general — SDOF amortiguado","k":"abierta","q":"¿Qué es el amortiguamiento crítico?","e":"El <b>menor valor de amortiguamiento</b> con el cual el sistema, al ser perturbado, regresa a su posición de equilibrio <b>sin oscilar</b>. Es la frontera entre el movimiento oscilatorio y el no oscilatorio.\n <span class=\"eq\">c_cr = 2·√(k·m) = 2·m·ω    ·    ξ = c / c_cr</span>"},{"id":"H031","t":"vib","src":"2021-M · Repaso","origen":"hist","r":"Teoría general — SDOF amortiguado","k":"abierta","q":"¿Cuál es la diferencia entre un sistema subamortiguado, uno crítico y uno sobreamortiguado?","e":"<ul><li><b>Subamortiguado (ξ &lt; 1):</b> el sistema oscila alrededor de la posición de equilibrio con amplitud que decrece exponencialmente. Es el caso de todas las estructuras reales (ξ ≈ 2–10 %).</li>\n <li><b>Crítico (ξ = 1):</b> no oscila; regresa al equilibrio en el menor tiempo posible.</li>\n <li><b>Sobreamortiguado (ξ &gt; 1):</b> no oscila y regresa al equilibrio lentamente.</li></ul>","efig":"regimenes"},{"id":"H032","t":"vib","src":"2021-L · 2021-M · 2022-1 · 2024-3 · Repaso","origen":"hist","r":"Teoría general — identificación de ξ","k":"abierta","q":"¿Para qué se utiliza la teoría del decremento logarítmico en dinámica estructural?","e":"Para determinar <b>experimentalmente la fracción de amortiguamiento crítico ξ</b> de un sistema, midiendo la relación entre amplitudes de picos sucesivos de un registro de vibración libre.\n <span class=\"eq\">δ = (1/n)·ln( x_i / x_(i+n) ) = 2π·ξ / √(1 − ξ²) ≈ 2π·ξ</span>","efig":"decremento"},{"id":"H033","t":"vib","src":"Moodle 2020-11","origen":"hist","r":"Teoría general","k":"vf","q":"El método del decremento logarítmico determina el valor del amortiguamiento histerético.","a":false,"e":"<b>FALSO.</b> Determina la fracción de amortiguamiento crítico ξ (amortiguamiento viscoso equivalente), no el histerético."},{"id":"H034","t":"vib","src":"Moodle 2020-07","origen":"hist","r":"Teoría general","k":"vf","q":"El método del decremento logarítmico determina el valor del coeficiente de amortiguamiento.","a":true,"e":"<b>VERDADERO.</b>"},{"id":"H035","t":"vib","src":"Moodle 2020-11","origen":"hist","r":"Teoría general","k":"vf","q":"La teoría del incremento logarítmico permite determinar la relación de amortiguamiento crítico de un sistema de un grado de libertad.","a":false,"e":"<b>FALSO.</b> El método se llama <b>decremento</b> logarítmico —la amplitud decrece—; el \"incremento logarítmico\" no existe."},{"id":"H036","t":"vib","src":"Repaso","origen":"hist","r":"Teoría general","k":"abierta","q":"¿Qué genera que una estructura en vibración se detenga?","e":"Las <b>fuerzas de amortiguamiento</b>, que disipan progresivamente la energía mecánica del sistema convirtiéndola en calor, fricción y deformación del material."},{"id":"H037","t":"vib","src":"2021-L · Moodle 2020-07 · Repaso","origen":"hist","r":"Teoría general — respuesta a carga armónica","k":"abierta","q":"Explique el fenómeno de resonancia.","e":"Ocurre cuando la <b>frecuencia de la excitación coincide con la frecuencia natural</b> del sistema (β = ω̄/ω = 1). La energía que entra en cada ciclo se suma a la del anterior y la amplitud crece hasta el máximo posible; si ξ = 0 la amplificación tiende a infinito. El amortiguamiento es lo único que acota el pico:\n <span class=\"eq\">D_máx ≈ 1 / (2·ξ)   →   con ξ = 5 %, D ≈ 10</span>","efig":"daf"},{"id":"H038","t":"vib","src":"Moodle 2020-07","origen":"hist","r":"Teoría general","k":"vf","q":"El fenómeno de resonancia se presenta cuando la relación de frecuencias de la carga aplicada y la del sistema es igual a 1 y el amortiguamiento es cero.","a":true,"e":"<b>VERDADERO.</b>"},{"id":"H039","t":"vib","src":"2021-L · 2021-M · 2022-1 · 2024-3 · Moodle","origen":"hist","r":"Teoría general — integral de convolución","k":"abierta","q":"¿Para qué se utiliza la integral de Duhamel (integral de convolución)?","e":"Para hallar la respuesta de un sistema dinámico ante una <b>excitación arbitraria</b> —cualquier función de carga, incluido un acelerograma—, superponiendo la respuesta a la sucesión de impulsos diferenciales que la componen.\n <span class=\"eq\">u(t) = (1/(m·ω_D)) · ∫₀ᵗ p(τ)·e^(−ξω(t−τ))·sen(ω_D(t−τ)) dτ</span>\n <em>Válida solo para sistemas lineales (aplica el principio de superposición).</em>"},{"id":"H040","t":"vib","src":"Moodle 2020-11 · Moodle 2020-07","origen":"hist","r":"Teoría general","k":"mc","q":"La integral de convolución se utiliza para:","o":["determinar la respuesta dinámica en vibración libre","en vibración amortiguada","para amortiguamiento crítico y subcrítico","para cargas arbitrarias"],"a":3,"e":"<b>d) Determinar la respuesta dinámica de una estructura para cargas arbitrarias.</b>"},{"id":"H041","t":"vib","src":"Repaso","origen":"hist","r":"Teoría general — integración paso a paso","k":"abierta","q":"¿En qué consiste el método β de Newmark?","e":"Método <b>numérico paso a paso</b> de integración directa de la ecuación de movimiento. Supone una ley de variación de la aceleración dentro de cada intervalo Δt y calcula desplazamiento, velocidad y aceleración al final del paso a partir de los del paso anterior. Sirve para cualquier excitación arbitraria y admite comportamiento no lineal —cosa que la integral de Duhamel no permite."},{"id":"H042","t":"vib","src":"2022-1","origen":"hist","r":"Teoría general — Newmark (1959)","k":"abierta","q":"¿Qué diferencia existe entre el método de Newmark y el de la aceleración lineal en la determinación de la respuesta dinámica?","e":"El de <b>aceleración lineal es un caso particular</b> del de Newmark, con β = 1/6 y γ = 1/2: supone que la aceleración varía linealmente dentro del paso, es más preciso pero <b>condicionalmente estable</b> (exige Δt / T ≤ 0.551). El de Newmark con β = 1/4 (aceleración promedio constante) es <b>incondicionalmente estable</b> para cualquier Δt, a costa de algo de precisión."},{"id":"H043","t":"vib","src":"2022-1","origen":"hist","r":"NSR-10 A.5.4 · teoría modal","k":"abierta","q":"¿Qué son los modos de vibración?","e":"Las <b>formas características de deformación</b> en que un sistema de varios grados de libertad puede vibrar libremente, cada una asociada a una frecuencia natural propia. Un sistema de N GDL tiene N modos; son ortogonales respecto de las matrices de masa y de rigidez, lo que permite desacoplar el sistema y analizar cada modo como un sistema de un grado de libertad."},{"id":"H044","t":"vib","src":"Repaso","origen":"hist","r":"Teoría modal — normalización","k":"abierta","q":"¿Qué es la normalización de los modos de vibración?","e":"Aplicar un <b>factor de escala</b> a cada modo natural para estandarizar sus amplitudes, ya que la forma modal queda definida salvo una constante. Lo habitual es normalizar respecto de la masa (φᵀ·M·φ = 1) o hacer unitaria la amplitud del último piso."},{"id":"H045","t":"vib","src":"2021-M · Repaso","origen":"hist","r":"NSR-10 A.5.4.2","k":"abierta","q":"Explique en qué consiste el factor de repartición o participación de masas.","e":"Es la relación que indica <b>qué porcentaje de la masa total de la estructura moviliza cada modo</b> de vibración en la dirección analizada. Sirve para decidir cuántos modos deben incluirse en el análisis: la NSR-10 exige acumular al menos el <b>90 %</b> de la masa participante."},{"id":"H046","t":"vib","src":"Repaso","origen":"hist","r":"NSR-10 A.5.4.4 — combinación de los modos","k":"abierta","q":"Explique la combinación modal CQC.","e":"<b>Combinación Cuadrática Completa.</b> Combinación estadística de las respuestas máximas modales que, a diferencia de la SRSS, incorpora <b>coeficientes de correlación entre modos</b>. Se usa porque los máximos de cada modo no ocurren simultáneamente y porque en estructuras con modos de periodos cercanos (edificios con torsión, 3D) la SRSS subestima la respuesta."},{"id":"H047","t":"vib","src":"Repaso","origen":"hist","r":"NSR-10 A.5.4.4","k":"abierta","q":"Nombre tres sistemas (métodos) de combinación modal.","e":"<ul><li><b>Suma de valores absolutos</b> (ABS) — muy conservadora.</li>\n <li><b>SRSS</b> — raíz cuadrada de la suma de los cuadrados.</li>\n <li><b>CQC</b> — combinación cuadrática completa.</li></ul>"},{"id":"H048","t":"vib","src":"2021-L · 2022-1","origen":"hist","r":"Teoría general — excitación en la base","k":"vf","q":"Una estructura de un grado de libertad a la que se le mueve la base es equivalente a fijar la base y aplicar una fuerza igual al negativo de la masa por la aceleración del terreno.","a":true,"e":"<b>VERDADERO.</b> Es el concepto de fuerza sísmica efectiva: al plantear la ecuación en desplazamientos relativos, la excitación de la base se convierte en una carga externa aplicada sobre la estructura de base fija.\n <span class=\"eq\">m·ü + c·u̇ + k·u = − m · ü_g(t)   =   p_ef(t)</span>\n <em>El signo negativo es esencial: la fuerza inercial se opone al movimiento del terreno.</em>"},{"id":"H049","t":"vib","src":"2021-L","origen":"hist","r":"Teoría general — espectro de respuesta","k":"mc","q":"Considere la relación entre la aceleración de un edificio y la aceleración del terreno. ¿Cuál frase es correcta?","o":["La relación depende del periodo del edificio","Es igual a 1.0 para rigidez infinita","Es igual a 1.0 para periodo natural igual a cero","La aceleración del edificio es típicamente inferior a la del terreno"],"a":0,"e":"<b>a) La relación depende del periodo del edificio.</b> Es la afirmación general y correcta: esa relación es justamente el espectro de amplificación. Las opciones b) y c) describen el mismo caso límite —estructura infinitamente rígida, T = 0— en el que la estructura se mueve con el terreno y la relación vale 1.0; la d) es falsa, pues la estructura normalmente <b>amplifica</b> la aceleración del terreno."},{"id":"H050","t":"vib","src":"2021-L","origen":"hist","r":"Teoría general — espectros de respuesta","k":"mc","q":"El espectro de velocidad se describe de la mejor forma como:","o":["la velocidad de la energía sísmica","la velocidad de una onda secundaria","la velocidad de una estructura","la velocidad de una estructura relativa al terreno"],"a":3,"e":"<b>d) La velocidad de una estructura relativa al terreno.</b> El espectro de velocidad (o pseudo-velocidad) grafica el máximo de la velocidad <b>relativa</b> de la masa respecto de la base, para cada periodo."},{"id":"H051","t":"vib","src":"2021-M · Repaso","origen":"hist","r":"Teoría general — contenido frecuencial y resonancia","k":"abierta","q":"¿Cómo afecta un sismo de periodo corto a un edificio de gran altura?","e":"Prácticamente no lo afecta. Los edificios altos tienen <b>periodos largos</b> y un sismo de periodo corto entrega su energía en la zona de periodos bajos del espectro; al no haber coincidencia de periodos no hay resonancia y la amplificación de la respuesta es pequeña. Ese sismo es, en cambio, muy destructivo para edificaciones bajas y rígidas."},{"id":"H052","t":"sism","src":"Repaso","origen":"hist","r":"NSR-10 A.2.1 · sismología general","k":"abierta","q":"¿Cuáles son las causas de los temblores?","e":"<ul><li><b>Tectónica y sismicidad general:</b> movimiento relativo de las placas litosféricas.</li>\n <li><b>Fallas geológicas:</b> acumulación y liberación súbita de energía de deformación en el plano de falla.</li>\n <li><b>Mecanismo focal:</b> tipo de ruptura que se produce en el foco.</li></ul>\n <em>Causas menores: vulcanismo, colapso de cavidades y sismicidad inducida (embalses, inyección de fluidos).</em>"},{"id":"H053","t":"sism","src":"Repaso","origen":"hist","r":"NSR-10 A.2.1 · sismología general","k":"abierta","q":"¿Qué es una falla geológica?","e":"Discontinuidad o fractura en la corteza terrestre a lo largo de la cual los bloques se han desplazado. Una <b>falla activa</b> es capaz de producir sismos porque acumula energía de deformación —por procesos de subducción o de choque de placas— que libera bruscamente al superar la resistencia por fricción."},{"id":"H054","t":"sism","src":"Repaso","origen":"hist","r":"Sismología general","k":"abierta","q":"Enuncie los tipos de falla.","e":"<ul><li><b>Transcurrente de desplazamiento derecho</b> (dextral).</li>\n <li><b>Transcurrente de desplazamiento izquierdo</b> (sinestral).</li>\n <li><b>De desplazamiento normal</b> (bloque colgante desciende — régimen de tracción).</li>\n <li><b>De desplazamiento inverso</b> (bloque colgante asciende — régimen de compresión).</li></ul>"},{"id":"H055","t":"sism","src":"Repaso","origen":"hist","r":"Sismología general","k":"abierta","q":"¿Qué es el engatillamiento de falla?","e":"Es la condición de <b>alta fricción o trabamiento entre las superficies del fallamiento</b>, que impide el deslizamiento y hace que la falla acumule energía de deformación hasta que se vence la resistencia y se produce la ruptura súbita —el sismo."},{"id":"H056","t":"sism","src":"2021-M · 2024-3 · Repaso","origen":"hist","r":"NSR-10 A.2.1 · sismología general","k":"abierta","q":"¿En qué consiste el fenómeno de subducción?","e":"Proceso de <b>hundimiento de una placa oceánica bajo una placa continental</b> (más liviana) en una zona de convergencia. En Colombia es el mecanismo dominante: la placa de Nazca subduce bajo la placa Suramericana frente a la costa Pacífica."},{"id":"H057","t":"sism","src":"Repaso","origen":"hist","r":"NSR-10 A.2.1","k":"abierta","q":"¿Qué placas convergen en Colombia?","e":"Las placas de <b>Nazca</b>, <b>Suramericana</b> y del <b>Caribe</b>."},{"id":"H058","t":"sism","src":"2021-M · 2022-1 · Repaso","origen":"hist","r":"NSR-10 A.2.1 · sismología general","k":"abierta","q":"¿Qué es el foco o hipocentro? ¿Y el epicentro, la profundidad focal y la distancia focal?","e":"<ul><li><b>Hipocentro o foco:</b> punto en el interior de la tierra donde se inicia la liberación de energía que produce el sismo.</li>\n <li><b>Epicentro:</b> proyección del hipocentro sobre la superficie terrestre.</li>\n <li><b>Profundidad focal:</b> distancia vertical del hipocentro medida desde el epicentro.</li>\n <li><b>Distancia focal:</b> distancia desde el hipocentro hasta un punto cualquiera de referencia (la estación o el sitio del proyecto).</li></ul>","efig":"foco"},{"id":"H059","t":"sism","src":"2021-M","origen":"hist","r":"Sismología general","k":"fill","q":"El punto donde se inicia la liberación de energía del sismo es el [[1]].","e":"El <b>hipocentro</b> (o foco).","a":[["hipocentro","foco","hipocentro o foco","foco o hipocentro"]]},{"id":"H060","t":"sism","src":"2021-M","origen":"hist","r":"Sismología general","k":"fill","q":"Con posterioridad a un sismo importante se presentan temblores de menor magnitud conocidos como [[1]].","e":"<b>Réplicas.</b> Los que anteceden al evento principal se llaman <b>premonitorios</b> o sismos precursores.","a":[["replicas","replica"]]},{"id":"H061","t":"sism","src":"Repaso","origen":"hist","r":"Sismología general","k":"abierta","q":"Enuncie los tipos de sismos según su profundidad.","e":"<ul><li><b>Superficiales:</b> profundidad focal menor de 70 km. Son los más destructivos.</li>\n <li><b>De foco intermedio:</b> entre 70 y 300 km.</li>\n <li><b>Profundos:</b> mayores de 300 km.</li></ul>"},{"id":"H062","t":"sism","src":"Repaso","origen":"hist","r":"Sismología general","k":"abierta","q":"Defina los tipos de ondas sísmicas.","e":"<b>Ondas de cuerpo</b> (viajan por el interior de la tierra, se generan en el punto de ruptura):\n <ul><li><b>P</b> — primarias o de dilatación: el desplazamiento de las partículas ocurre <b>en la misma dirección</b> de propagación. Son las más rápidas y las primeras en llegar.</li>\n <li><b>S</b> — secundarias o de cortante: desplazamiento <b>perpendicular</b> a la dirección de propagación. No se propagan en líquidos.</li></ul>\n <b>Ondas superficiales</b> (aparecen cuando las de cuerpo llegan a la superficie):\n <ul><li><b>Love</b> — movimiento horizontal transversal a la dirección de propagación.</li>\n <li><b>Rayleigh</b> — movimiento en órbita elíptica, semejante al de las olas del mar.</li></ul>\n La amplitud de las superficiales decrece marcadamente con la profundidad y son las que más daño causan a las edificaciones.","efig":"ondas4"},{"id":"H063","t":"sism","src":"2021-L · 2024-3 · Repaso","origen":"hist","r":"Sismología general — escala de Richter y Mw","k":"abierta","q":"Defina la magnitud de un sismo.","e":"Medida <b>cuantitativa e instrumental</b> de la <b>energía liberada</b> en el foco. Es un valor único para cada sismo, independiente del sitio de observación, y se obtiene a partir de la amplitud registrada en los sismogramas."},{"id":"H064","t":"sism","src":"Repaso","origen":"hist","r":"Sismología general","k":"abierta","q":"Enuncie los tipos de magnitud.","e":"<ul><li><b>Mb</b> — magnitud de ondas de cuerpo.</li>\n <li><b>Ms</b> — magnitud de ondas superficiales.</li>\n <li><b>Mw</b> — magnitud de momento sísmico (la más usada hoy; no se satura para sismos grandes).</li></ul>\n <em>M ≈ 5.0 se considera el límite inferior de los sismos que causan daño.</em>"},{"id":"H065","t":"sism","src":"Repaso","origen":"hist","r":"Sismología general","k":"abierta","q":"Defina la escala de Richter.","e":"Escala <b>logarítmica</b> que asigna un número para cuantificar la energía liberada por el sismo a partir de la amplitud máxima registrada. Cada unidad de magnitud representa <b>10 veces más amplitud</b> y aproximadamente <b>32 veces más energía</b> liberada."},{"id":"H066","t":"sism","src":"2021-L · 2021-M · 2024-3 · Repaso","origen":"hist","r":"Sismología general — escala MM","k":"abierta","q":"Defina la intensidad de un sismo.","e":"Medida <b>cualitativa y subjetiva</b> de los <b>efectos y daños</b> que un sismo produce en un lugar determinado: en las personas, las edificaciones y el terreno. Varía de un sitio a otro para un mismo sismo. Se mide con la escala de Mercalli Modificada, de I a XII."},{"id":"H067","t":"sism","src":"Repaso · 2022-1","origen":"hist","r":"Sismología general","k":"abierta","q":"Defina la escala de Mercalli.","e":"Escala de <b>12 grados (I a XII)</b> que califica la intensidad de un sismo a través de los efectos percibidos y de los daños causados a las estructuras y al terreno. Es descriptiva, no instrumental."},{"id":"H068","t":"sism","src":"Moodle 2020-11","origen":"hist","r":"Sismología general","k":"mc","q":"La magnitud de un sismo hace referencia a:","o":["los daños que ocasiona","cuantifica los daños en la escala de Richter","la califica una persona y la energía liberada es subjetiva","ninguna de las anteriores"],"a":3,"e":"<b>d) Ninguna de las anteriores.</b> La magnitud mide la energía liberada de forma instrumental y objetiva; las tres primeras opciones describen la <b>intensidad</b> o mezclan ambos conceptos."},{"id":"H069","t":"sism","src":"Moodle 2020-07","origen":"hist","r":"Sismología general","k":"vf","q":"La magnitud de un sismo es una medida de la energía que liberan ellos.","a":true,"e":"<b>VERDADERO.</b>"},{"id":"H070","t":"sism","src":"2022-1 · Repaso","origen":"hist","r":"Sismología general","k":"abierta","q":"Defina el mapa de isosistas.","e":"Representación gráfica de los <b>niveles de intensidad</b> de un sismo mediante curvas que unen los puntos que sufrieron <b>igual intensidad</b>, trazadas a partir de las observaciones de daños de un evento en particular. Emplea la escala de Mercalli Modificada."},{"id":"H071","t":"sism","src":"Repaso","origen":"hist","r":"Sismología general — instrumentación","k":"abierta","q":"¿Qué es un sismograma?","e":"Registro obtenido por el <b>sismógrafo</b>, adecuado para sismos ocurridos a distancias apreciables. En él se identifica el instante de llegada de las ondas P y S, y de esa diferencia de tiempos se deduce la distancia a la que ocurrió el sismo. Los sismógrafos se saturan cuando el evento ocurre cerca de su localización."},{"id":"H072","t":"sism","src":"Repaso","origen":"hist","r":"NSR-10 A.2.7 y A.11 (instrumentación sísmica)","k":"abierta","q":"¿Qué es un acelerograma? ¿Y un acelerógrafo?","e":"El <b>acelerograma</b> es el registro gráfico de la <b>aceleración del terreno en función del tiempo</b>, medido en dos direcciones horizontales ortogonales y una vertical. El <b>acelerógrafo</b> es el instrumento que lo produce: está diseñado para registrar aceleraciones altas en el campo cercano, donde el sismógrafo se satura."},{"id":"H073","t":"sism","src":"Repaso","origen":"hist","r":"Sismología general — clasificación de acelerogramas","k":"abierta","q":"¿Cuáles son los tipos de temblores según el acelerograma?","e":"<ul><li><b>Tipo 1:</b> el acelerograma consiste prácticamente en un pulso único; periodos de vibración cortos.</li>\n <li><b>Tipo 2:</b> movimiento extremadamente irregular de duración moderada.</li>\n <li><b>Tipo 3:</b> movimiento de larga duración con periodos de vibración muy definidos.</li>\n <li><b>Tipo 4:</b> casos en que se presentan deformaciones permanentes a gran escala del terreno (licuación, deslizamientos).</li></ul>"},{"id":"H074","t":"sism","src":"Repaso","origen":"hist","r":"Sismología general — procesamiento de acelerogramas","k":"abierta","q":"Defina el movimiento máximo del terreno.","e":"Los valores pico de aceleración, velocidad y desplazamiento del suelo durante el sismo. La velocidad y el desplazamiento se obtienen <b>integrando una y dos veces</b>, respectivamente, el registro de aceleraciones (el acelerograma), con la corrección de línea base correspondiente."},{"id":"H075","t":"sism","src":"Repaso","origen":"hist","r":"NSR-10 A.2.2","k":"abierta","q":"¿Qué es la aceleración efectiva?","e":"La aceleración del terreno <b>representativa del daño</b> que el sismo puede producir en el rango de periodos de interés estructural, no el pico instantáneo del acelerograma. Es el parámetro que la NSR-10 recoge en Aa (aceleración horizontal pico efectiva) y Av (velocidad horizontal pico efectiva)."},{"id":"H076","t":"sism","src":"Repaso","origen":"hist","r":"NSR-10 A.2.9 · Título H","k":"abierta","q":"Mencione la metodología o los estudios de amenaza sísmica.","e":"<ul><li>Consideraciones <b>geológicas</b> (identificación de fuentes sismogénicas y fallas activas).</li>\n <li>Información <b>sismológica</b> (catálogo histórico e instrumental).</li>\n <li>Definición del <b>sismo de diseño</b> y de sus parámetros.</li>\n <li>Estudios <b>geotécnicos</b> y de efectos locales del sitio.</li></ul>"},{"id":"H077","t":"amen","src":"Repaso · 2022-1","origen":"hist","r":"NSR-10 A.2.2 · Figura A.2.3-2 · Apéndice A-4","k":"abierta","q":"¿Qué es Aa según la NSR-10?","e":"Coeficiente que representa la <b>aceleración horizontal pico efectiva</b> del terreno para diseño, expresada como fracción de la gravedad. Define la zona de amenaza sísmica y gobierna la <b>meseta de periodos cortos</b> del espectro."},{"id":"H078","t":"amen","src":"Repaso · 2022-1","origen":"hist","r":"NSR-10 A.2.2 · Figura A.2.3-3 · Apéndice A-4","k":"abierta","q":"¿Qué es Av según la NSR-10?","e":"Coeficiente que representa la <b>velocidad horizontal pico efectiva</b> del terreno para diseño. Gobierna las ramas de <b>periodos intermedios y largos</b> del espectro."},{"id":"H079","t":"amen","src":"2021-M · Repaso","origen":"hist","r":"NSR-10 A.2.3 · Apéndice A-4 (valores por municipio)","k":"vf","q":"El mayor valor de Aa para las ciudades de Colombia es 0.50.","a":true,"e":"<b>VERDADERO.</b> El valor máximo de la zonificación corresponde a la región 10, con Aa = 0.50, en el litoral Pacífico nariñense (por ejemplo Francisco Pizarro y Mosquera). Como referencia: Villavicencio 0.35, Bogotá 0.15."},{"id":"H080","t":"amen","src":"2024-3 · Repaso","origen":"hist","r":"NSR-10 A.2.3","k":"abierta","q":"¿Qué es una zona de amenaza sísmica baja?","e":"El conjunto de lugares donde <b>tanto Aa como Av son menores o iguales a 0.10</b>."},{"id":"H081","t":"amen","src":"Repaso","origen":"hist","r":"NSR-10 A.2.3","k":"abierta","q":"¿Qué es una zona de amenaza sísmica intermedia?","e":"El conjunto de lugares donde <b>Aa o Av, o ambos, son mayores de 0.10 y ninguno de los dos excede 0.20</b>.","nota":"Una de las hojas de repaso dice \"Fa o Fv mayor a 0.1 y no exceden 0.2\". Es un error: la clasificación se hace con <b>Aa y Av</b>, nunca con los coeficientes de sitio Fa y Fv."},{"id":"H082","t":"amen","src":"2021-M · 2022-1 · Repaso","origen":"hist","r":"NSR-10 A.2.3","k":"abierta","q":"¿Qué es una zona de amenaza sísmica alta?","e":"El conjunto de lugares donde <b>Aa o Av, o ambos, son mayores de 0.20</b>."},{"id":"H083","t":"amen","src":"Repaso","origen":"hist","r":"NSR-10 A.2.3 · Apéndice A-4","k":"abierta","q":"¿Qué valores de Aa y Av se asocian a cada zona de amenaza sísmica?","e":"Valores <b>representativos</b> que se manejan en clase como referencia rápida:\n <ul><li><b>Alta:</b> Aa y Av del orden de 0.25 o mayores.</li>\n <li><b>Intermedia:</b> Aa ≈ 0.15, Av ≈ 0.20.</li>\n <li><b>Baja:</b> Aa y Av ≤ 0.10.</li></ul>\n <em>El valor real de cada municipio se toma del Apéndice A-4 o de los mapas de las Figuras A.2.3-1 y A.2.3-2; lo anterior es solo un orden de magnitud.</em>"},{"id":"H084","t":"amen","src":"Moodle 2020-11","origen":"hist","r":"NSR-10 A.2.3","k":"mc","q":"Zona sísmica alta es:","o":["la aceleración espectral para diseño supera los valores de la zona sísmica intermedia","los valores de la aceleración del terreno son mayores de 0.20","los valores de la aceleración espectral y de la seudoaceleración se encuentran en la zona de periodos intermedios","ninguna de las anteriores"],"a":0,"e":"<b>a) La aceleración espectral para diseño supera los valores de la zona sísmica intermedia.</b>"},{"id":"H085","t":"amen","src":"Repaso","origen":"hist","r":"NSR-10 A.2.4, Tabla A.2.4-1","k":"abierta","q":"Defina la clasificación de los perfiles de suelo según la NSR-10.","e":"Seis perfiles, <b>de A a F</b> (Tabla A.2.4-1), definidos con los 30 m superiores del depósito mediante la velocidad media de onda cortante V<sub>s</sub>, el número medio de golpes N del ensayo SPT y la resistencia al corte no drenada s<sub>u</sub>:\n <ul><li><b>A</b>: roca competente, V<sub>s</sub> &gt; 1500 m/s.</li><li><b>B</b>: roca de rigidez media, 1500 ≥ V<sub>s</sub> &gt; 760 m/s.</li><li><b>C</b>: suelos muy densos o roca blanda, 760 ≥ V<sub>s</sub> &gt; 360 m/s (o N ≥ 50, o s<sub>u</sub> ≥ 100 kPa).</li><li><b>D</b>: suelos rígidos, 360 ≥ V<sub>s</sub> ≥ 180 m/s (o 50 &gt; N ≥ 15, o 100 &gt; s<sub>u</sub> ≥ 50 kPa).</li><li><b>E</b>: suelos blandos, V<sub>s</sub> &lt; 180 m/s, o más de 3 m de arcillas blandas (IP &gt; 20, w ≥ 40 %).</li><li><b>F</b>: suelos que exigen evaluación particular del sitio (licuables, turbas, arcillas de muy alta plasticidad, arcillas blandas de gran espesor).</li></ul>","nota":"En varias hojas de repaso aparece citada como \"Tabla A.2.11-1\". En la NSR-10 la clasificación de los perfiles de suelo es la <b>Tabla A.2.4-1</b>."},{"id":"H086","t":"amen","src":"Repaso","origen":"hist","r":"NSR-10 A.2.4.1 y A.2.10 (efectos locales / estudios de sitio)","k":"abierta","q":"¿Cuándo se debe hacer un estudio particular de sitio?","e":"Es <b>obligatorio para el perfil de suelo tipo F</b>, que agrupa suelos susceptibles de falla o colapso, turbas y arcillas orgánicas, arcillas de muy alta plasticidad y perfiles de arcilla blanda de gran espesor. Para esos perfiles la norma no asigna valores de Fa y Fv y exige una respuesta dinámica del depósito."},{"id":"H087","t":"amen","src":"2021-M · 2024-3 · Repaso","origen":"hist","r":"NSR-10 A.2.4, Tabla A.2.4-3","k":"abierta","q":"¿Qué es el coeficiente Fa según la NSR-10?","e":"Coeficiente de <b>amplificación</b> que afecta la aceleración en la <b>zona de periodos cortos</b> del espectro, debido a los efectos de sitio. Es adimensional y depende del perfil de suelo y del valor de Aa."},{"id":"H088","t":"amen","src":"Repaso · 2022-1","origen":"hist","r":"NSR-10 A.2.4, Tabla A.2.4-4","k":"abierta","q":"¿Qué es el coeficiente Fv según la NSR-10?","e":"Coeficiente de <b>amplificación</b> que afecta la aceleración en la <b>zona de periodos intermedios</b> del espectro, debido a los efectos de sitio. Es adimensional y depende del perfil de suelo y del valor de Av."},{"id":"H089","t":"amen","src":"Moodle 2020-07","origen":"hist","r":"NSR-10 A.2.4","k":"mc","q":"El valor Fv es:","o":["coeficiente que modifica la zona de periodos cortos","coeficiente que modifica la zona de periodos intermedios","coeficiente que modifica el factor de ductilidad en la zona inelástica","ninguna es correcta","coeficiente que amplifica el factor de disipación de energía básico"],"a":1,"e":"<b>b) Coeficiente que modifica la zona de periodos intermedios del espectro.</b>"},{"id":"H090","t":"amen","src":"Moodle 2020-11","origen":"hist","r":"NSR-10 A.2.4","k":"vf","q":"El coeficiente Fv afecta el espectro en la zona de periodos cortos.","a":false,"e":"<b>FALSO.</b> Fv afecta la zona de <b>periodos intermedios</b>; el que actúa en periodos cortos es <b>Fa</b>."},{"id":"H091","t":"amen","src":"2024-3","origen":"hist","r":"NSR-10 A.2.4","k":"vf","q":"El coeficiente Fa es un coeficiente de amplificación que afecta la aceleración en la zona de periodos intermedios debido a los efectos de sitio.","a":false,"e":"<b>FALSO.</b> Fa actúa en la zona de <b>periodos cortos</b>. La afirmación describe a Fv."},{"id":"H092","t":"amen","src":"Repaso","origen":"hist","r":"NSR-10 A.2.5, Tabla A.2.5-1","k":"abierta","q":"Según la NSR-10, ¿qué es el coeficiente de importancia? Explique los grupos de uso.","e":"El coeficiente de importancia <b>I</b> <b>amplifica el espectro y las fuerzas de diseño</b> según lo importante que sea la edificación para la comunidad durante y después de un sismo. Valores de la Tabla A.2.5-1, con los ejemplos de la diapositiva del curso:\n <ul><li><b>Grupo IV, edificaciones indispensables (I = 1.50):</b> hospitales y clínicas con cirugía, cuidados intensivos o urgencias; edificaciones de aeropuertos y sistemas masivos de transporte; centrales de operación y control de líneas vitales (energía, agua, combustible, transporte); plantas de generación eléctrica de emergencia y tanques del sistema contra incendio de estas edificaciones.</li>\n <li><b>Grupo III, atención a la comunidad (I = 1.25):</b> estaciones de bomberos, defensa civil, policía y cuarteles; centros de atención de emergencias; garajes de vehículos de emergencia; guarderías, escuelas, colegios y universidades.</li>\n <li><b>Grupo II, ocupación especial (I = 1.10):</b> salones con más de 200 personas; graderías al aire libre con más de 2000 personas; almacenes y centros comerciales con más de 500 m² por piso; hospitales y clínicas no incluidos en el Grupo IV; edificaciones donde trabajen o residan más de 3000 personas; <b>edificios gubernamentales</b>.</li>\n <li><b>Grupo I, ocupación normal (I = 1.00):</b> todas las demás (vivienda, oficinas, comercio pequeño).</li></ul>","nota":"La versión anterior del banco ubicaba las sedes de gobierno en el Grupo III. La diapositiva del curso y la NSR-10 las ubican en el <b>Grupo II</b>. Para el Grupo III el valor es <b>I = 1.25</b>; una hoja de repaso dice 1.2 por error."},{"id":"H093","t":"amen","src":"2022-1","origen":"hist","r":"NSR-10 A.2.5.1","k":"vf","q":"Las líneas vitales de energía se clasifican en el grupo de uso IV.","a":true,"e":"<b>VERDADERO.</b> Las líneas vitales —centrales de generación y subestaciones, plantas de agua, telecomunicaciones— pertenecen al Grupo IV, edificaciones indispensables, con I = 1.50."},{"id":"H094","t":"amen","src":"Moodle 2020-07 · Moodle 2020-11","origen":"hist","r":"NSR-10 A.2.6","k":"vf","q":"El coeficiente de importancia amplifica el espectro en las tres zonas del espectro.","a":false,"e":"<b>FALSO</b> según la clave del curso. El coeficiente I multiplica <b>todas</b> las ramas del espectro —la rampa inicial, la meseta de aceleración constante, la rama de velocidad constante y la de desplazamiento constante—, que son <b>cuatro</b> zonas, no tres. La afirmación es incompleta.","nota":"Es una pregunta trampa que se repite en los dos cuestionarios. La respuesta esperada es FALSO por el conteo de zonas, no porque I deje de amplificar alguna rama."},{"id":"H095","t":"amen","src":"2021-L · 2024-3 · Repaso","origen":"hist","r":"NSR-10 A.2.6, Figura A.2.6-1","k":"abierta","q":"¿Qué es un espectro elástico de aceleraciones?","e":"Representación gráfica de la <b>respuesta máxima de aceleración</b> que una acción dinámica genera sobre una familia de sistemas de <b>un grado de libertad</b> con amortiguamiento fijo (ξ = 5 % en la NSR-10), expresada como fracción de la gravedad y graficada <b>en función del periodo de vibración T</b>.","efig":"espectroNSR"},{"id":"H096","t":"amen","src":"Moodle 2020-07","origen":"hist","r":"NSR-10 A.2.6","k":"mc","q":"¿Un espectro elástico de aceleraciones es?","o":["gráfico que representa energía acumulada para diseño","gráfico que representa aceleraciones sísmicas de diseño","un gráfico que se construye para cada efecto sísmico","ninguna de las anteriores","un gráfico que representa coeficientes espectrales de diseño"],"a":3,"e":"<b>d) Ninguna de las anteriores.</b> Ninguna opción incluye lo esencial: es la respuesta máxima de aceleración de sistemas de un grado de libertad, con ξ = 5 %, <b>en función del periodo</b>."},{"id":"H097","t":"amen","src":"Moodle 2020-07","origen":"hist","r":"NSR-10 A.2.2 y A.2.4","k":"vf","q":"Un espectro elástico de aceleraciones es aquel que se definió para valores de Aa o Av que dependen del perfil del suelo.","a":false,"e":"<b>FALSO.</b> Aa y Av dependen de la <b>amenaza sísmica del lugar</b>, no del suelo. El efecto del perfil de suelo entra por los coeficientes <b>Fa y Fv</b>."},{"id":"H098","t":"amen","src":"Moodle 2020-11","origen":"hist","r":"NSR-10 A.2.6","k":"mc","q":"Para el espectro de diseño, la NSR-10 asume una fracción del amortiguamiento crítico igual a:","o":["4 %","6 %","ninguna de las anteriores","5.5 %"],"a":2,"e":"<b>c) Ninguna de las anteriores.</b> El espectro de diseño de la NSR-10 está definido para <b>ξ = 5 %</b> del amortiguamiento crítico."},{"id":"H099","t":"amen","src":"Repaso","origen":"hist","r":"NSR-10 A.2.6","k":"abierta","q":"¿Qué es Sa según la NSR-10?","e":"Valor del <b>espectro de aceleraciones de diseño</b> para un periodo de vibración dado. Es la máxima aceleración horizontal de diseño, expresada como fracción de la gravedad, de un sistema de un grado de libertad con periodo T.\n <span class=\"eq\">To ≤ T ≤ Tc :  Sa = 2.5 · Aa · Fa · I</span>\n <span class=\"eq\">Tc &lt; T ≤ TL :  Sa = 1.2 · Av · Fv · I / T</span>\n <span class=\"eq\">T &gt; TL :  Sa = 1.2 · Av · Fv · TL · I / T²</span>"},{"id":"H100","t":"amen","src":"Repaso","origen":"hist","r":"NSR-10 — nomenclatura del Título A","k":"abierta","q":"¿Qué es Sv según la NSR-10?","e":"Valor del <b>espectro de velocidades de diseño</b> para un periodo de vibración dado: la máxima velocidad horizontal de diseño, en m/s, de un sistema de un grado de libertad con periodo T."},{"id":"H101","t":"amen","src":"Repaso","origen":"hist","r":"NSR-10 A.2.6 (espectro de desplazamientos)","k":"abierta","q":"¿Qué es Sd según la NSR-10?","e":"Valor del <b>espectro de desplazamientos de diseño</b> para un periodo de vibración dado: el máximo desplazamiento horizontal de diseño de un sistema de un grado de libertad con periodo T."},{"id":"H102","t":"amen","src":"Repaso","origen":"hist","r":"NSR-10 A.2.6","k":"abierta","q":"¿Qué es T, To, Tc y TL según la NSR-10?","e":"<ul><li><b>T</b> — periodo de vibración del sistema elástico, en segundos.</li>\n <li><b>To</b> — periodo en el que <b>inicia</b> la zona de aceleraciones constantes. To = 0.10 · Av·Fv / (Aa·Fa).</li>\n <li><b>Tc</b> — periodo de transición entre la zona de <b>aceleración constante</b> y la rama descendente. Tc = 0.48 · Av·Fv / (Aa·Fa).</li>\n <li><b>TL</b> — periodo de inicio de la zona de <b>desplazamiento constante</b>. TL = 2.4 · Fv.</li
