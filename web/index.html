{t:'fund',k:'vf',src:'Nueva',q:'En un análisis estático no aparecen fuerzas de inercia ni de amortiguamiento.',a:true,
 e:`<b>VERDADERO.</b> En el análisis estático la carga se aplica tan lentamente que la aceleración ü y la velocidad u̇ son prácticamente nulas; por eso m·ü = 0 y c·u̇ = 0 y solo queda k·u = p.`,r:'Teoría general — ecuación de movimiento'},

{t:'fund',k:'match',src:'Nueva',q:'Relacione cada término de la ecuación de movimiento m·ü + c·u̇ + k·u = p(t) con lo que representa.',
 o:[['m·ü','Fuerza de inercia'],['c·u̇','Fuerza de amortiguamiento'],['k·u','Fuerza elástica restauradora'],['p(t)','Excitación externa variable en el tiempo']],
 e:`<p>La ecuación es el equilibrio dinámico de la masa (principio de D'Alembert):</p><span class="eq">m·ü(t) + c·u̇(t) + k·u(t) = p(t)</span>
 <p class="sym">m: masa (kN·s²/m = t) · ü: aceleración (m/s²) · c: coeficiente de amortiguamiento viscoso (kN·s/m) · u̇: velocidad (m/s) · k: rigidez lateral (kN/m) · u: desplazamiento (m) · p(t): fuerza externa (kN).</p>`,r:'Teoría general — Chopra cap. 1 · García cap. 2'},

{t:'fund',k:'mc',src:'Nueva',q:'Si la rigidez lateral de un sistema de 1 GDL se cuadruplica y la masa no cambia, el periodo natural:',
 o:['Se duplica','Se reduce a la mitad','Se reduce a la cuarta parte','No cambia'],a:1,
 e:`<span class="eq">T = 2π·√(m/k)  →  T' = 2π·√(m/(4k)) = T/√4 = T/2</span><p>El periodo es inversamente proporcional a la raíz de la rigidez: cuatro veces más rígido significa la mitad del periodo.</p>`,r:'Teoría general — SDOF'},

{t:'fund',k:'mc',src:'Nueva',q:'Si la masa de un sistema de 1 GDL se duplica y la rigidez no cambia, el periodo natural:',
 o:['Aumenta √2 veces (≈ 1.41)','Se duplica','Disminuye √2 veces','No cambia'],a:0,
 e:`<span class="eq">T' = 2π·√(2m/k) = √2 · T ≈ 1.41·T</span>`,r:'Teoría general — SDOF'},

{t:'fund',k:'match',src:'Nueva',q:'Relacione cada propiedad con sus unidades en el Sistema Internacional usado en el curso.',
 o:[['Rigidez k','kN/m'],['Coeficiente de amortiguamiento c','kN·s/m'],['Masa m','kN·s²/m (toneladas)'],['Frecuencia circular ω','rad/s'],['Frecuencia natural f','Hz (ciclos/s)']],
 e:`Las unidades salen de que cada término de m·ü + c·u̇ + k·u sea una fuerza (kN): m·(m/s²) = kN → m en kN·s²/m; c·(m/s) = kN → c en kN·s/m; k·m = kN → k en kN/m. Además ω = √(k/m) en rad/s y f = ω/2π en Hz.`,r:'Teoría general'},

{t:'fund',k:'abierta',src:'Nueva',q:'Explique la diferencia entre periodo natural T, frecuencia natural f y frecuencia circular ω, y cómo se relacionan.',
 e:`<ul><li><b>T</b> (s): tiempo que tarda el sistema en completar un ciclo de vibración libre.</li><li><b>f</b> (Hz): número de ciclos por segundo, f = 1/T.</li><li><b>ω</b> (rad/s): velocidad angular equivalente del movimiento armónico, ω = 2π·f = 2π/T.</li></ul>
 <span class="eq">ω = √(k/m)    T = 2π/ω = 2π·√(m/k)    f = 1/T = ω/2π</span><p class="sym">k: rigidez (kN/m) · m: masa (kN·s²/m).</p>`,r:'Teoría general — SDOF'},

{t:'fund',k:'mc',src:'Nueva',q:'Dos columnas iguales (mismo E, I y h): una empotrada en ambos extremos y otra empotrada en la base y articulada arriba. ¿Cuántas veces más rígida lateralmente es la primera?',
 o:['2 veces','3 veces','4 veces','12 veces'],a:2,efig:'columnas',
 e:`<span class="eq">k(empotrada–empotrada) = 12·E·I/h³     k(empotrada–articulada) = 3·E·I/h³</span><p>La relación es 12/3 = <b>4</b>. E: módulo de elasticidad (kPa) · I: inercia de la sección (m⁴) · h: altura libre de la columna (m).</p>`,r:'Análisis estructural — rigidez lateral de columnas'},

{t:'fund',k:'abierta',src:'Nueva',q:'¿Qué es un edificio de cortante (modelo de masas concentradas) y qué hipótesis lo definen?',
 e:`Modelo en el que la masa de cada piso se concentra en la losa y cada piso tiene un solo grado de libertad lateral en la dirección analizada. Hipótesis:
 <ul><li>Las vigas y losas son <b>infinitamente rígidas</b> a flexión: los nudos no rotan.</li><li>Las deformaciones axiales de las columnas se desprecian.</li><li>La rigidez lateral del piso es la suma de la de sus columnas: k = Σ 12·E·I/h³.</li></ul>
 Con N pisos se obtienen matrices [M] diagonal y [K] tridiagonal de N×N.`,efig:'shear3',r:'García cap. 4 · Paz cap. 8'},

{t:'fund',k:'vf',src:'Nueva',q:'Un sistema de N grados de libertad tiene N frecuencias naturales y N modos de vibración.',a:true,
 e:`<b>VERDADERO.</b> El problema de valores propios det([K] − ω²[M]) = 0 es un polinomio de grado N en ω², con N raíces: N frecuencias y N formas modales.`,r:'Teoría modal'},

{t:'fund',k:'mc',src:'Nueva',q:'Un edificio de 5 pisos modelado en 3D con diafragma rígido en cada piso tiene, en total, ¿cuántos grados de libertad dinámicos?',
 o:['5','10','15','30'],a:2,
 e:`Cada diafragma rígido tiene 3 GDL en su centro de masa: dos traslaciones (UX, UY) y una rotación (RZ). 5 pisos × 3 = <b>15</b>.`,r:'NSR-10 A.3.6 · modelación con diafragma rígido'},

{t:'fund',k:'abierta',src:'Nueva',q:'Explique el principio de D\'Alembert y para qué sirve en dinámica estructural.',
 e:`Establece que una masa acelerada puede tratarse como si estuviera en equilibrio si se le agrega una <b>fuerza de inercia ficticia</b> f<sub>I</sub> = m·ü, opuesta a la aceleración. Con ella el problema dinámico se plantea como un equilibrio de fuerzas en cada instante:
 <span class="eq">f<sub>I</sub> + f<sub>D</sub> + f<sub>S</sub> = p(t)   →   m·ü + c·u̇ + k·u = p(t)</span>`,r:'Teoría general — Paz cap. 1'},

{t:'fund',k:'mc',src:'Nueva',q:'Un motor con una masa excéntrica que gira a velocidad constante aplica sobre su base una carga:',
 o:['Impulsiva','Armónica','Aleatoria','Estática'],a:1,
 e:`La fuerza centrífuga de la masa desbalanceada tiene magnitud constante m<sub>e</sub>·e·ω̄² y gira con la máquina; su componente en una dirección es p(t) = m<sub>e</sub>·e·ω̄²·sen(ω̄t), una carga <b>armónica</b>.`,r:'Teoría general — vibración forzada armónica'},

{t:'fund',k:'match',src:'Nueva',q:'Relacione cada tipo de excitación dinámica con un ejemplo.',
 o:[['Armónica','Motor o bomba con masa desbalanceada'],['Impulsiva','Explosión o impacto'],['Periódica no armónica','Hélice de barco o público saltando al ritmo de la música'],['Arbitraria (no periódica)','Sismo registrado en un acelerograma']],
 e:`Armónica: seno o coseno de frecuencia constante. Periódica no armónica: se repite con un periodo pero no es senoidal (se descompone en serie de Fourier). Impulsiva: gran magnitud en un tiempo muy corto frente a T. Arbitraria: sin patrón; se resuelve con Duhamel o métodos numéricos.`,r:'Teoría general — tipos de excitación'},

{t:'fund',k:'vf',src:'Nueva',q:'La ductilidad de desplazamiento se define como μ = δu / δy, la relación entre el desplazamiento último y el de fluencia.',a:true,
 e:`<b>VERDADERO.</b> δ<sub>y</sub>: desplazamiento en el que se inicia la fluencia · δ<sub>u</sub>: desplazamiento último antes de perder resistencia. Una estructura dúctil tiene μ alto (4 a 8 en sistemas DES).`,efig:'ductilidad',r:'NSR-10 A.3.1 · García cap. 6'},

{t:'fund',k:'mc',src:'Nueva',q:'La explosión de una carga cerca de un edificio produce sobre la fachada una excitación de tipo:',
 o:['Armónica','Periódica','Impulsiva','Estática'],a:2,
 e:`Una presión muy alta que dura milisegundos, mucho menos que el periodo de la estructura: es una carga <b>impulsiva</b>. La respuesta máxima ocurre en la vibración libre posterior.`,r:'Teoría general — carga impulsiva'},

{t:'fund',k:'abierta',src:'Nueva',q:'¿Por qué se dice que las cargas sísmicas son cargas de inercia?',
 e:`Porque el sismo no aplica fuerzas directamente sobre la estructura: mueve su base. Las fuerzas aparecen porque la masa, por inercia, se resiste a seguir ese movimiento. Por eso la fuerza sísmica es proporcional a la masa (F = m·a) y una edificación <b>ligera</b> recibe menos fuerza sísmica, como recomienda la presentación del curso.`,r:'Teoría general · Felizzola, Diseño sismo resistente'},

/* ===================== VIBRACIÓN ===================== */
{t:'vib',k:'abierta',src:'Nueva',q:'Escriba la ecuación de movimiento de un sistema de 1 GDL sometido a un movimiento del terreno ü_g(t) y explique cada término.',
 e:`<span class="eq">m·ü + c·u̇ + k·u = −m·ü<sub>g</sub>(t)</span>
 <ul><li><b>u</b>: desplazamiento de la masa <b>relativo</b> a la base (m); u̇ y ü son su velocidad y aceleración relativas.</li><li><b>ü<sub>g</sub>(t)</b>: aceleración del terreno, la que registra el acelerograma (m/s²).</li><li><b>m·ü<sub>g</sub></b>: la aceleración total de la masa es ü<sup>t</sup> = ü + ü<sub>g</sub>; al pasar m·ü<sub>g</sub> al lado derecho aparece como una <b>fuerza sísmica efectiva</b> p<sub>ef</sub> = −m·ü<sub>g</sub>.</li><li>c·u̇ y k·u: fuerzas de amortiguamiento y elástica, que dependen solo del movimiento relativo.</li></ul>`,r:'García cap. 2 · Chopra cap. 1'},

{t:'vib',k:'mc',src:'Nueva',q:'¿Qué fracción de amortiguamiento crítico es típica de una estructura de concreto reforzado en el rango elástico?',
 o:['0.5 %','5 %','25 %','50 %'],a:1,
 e:`Las estructuras reales tienen ξ entre 2 % (acero soldado) y 7–10 % (concreto con agrietamiento y mampostería). La NSR-10 fija <b>ξ = 5 %</b> para el espectro de diseño.`,r:'NSR-10 A.2.6'},

{t:'vib',k:'vf',src:'Nueva',q:'En un sistema subamortiguado el periodo amortiguado T_D es ligeramente mayor que el periodo natural T.',a:true,
 e:`<b>VERDADERO.</b><span class="eq">ω<sub>D</sub> = ω·√(1 − ξ²)   →   T<sub>D</sub> = T / √(1 − ξ²)</span><p>Como √(1 − ξ²) &lt; 1, T<sub>D</sub> &gt; T. Con ξ = 5 % la diferencia es de 0.13 %: en la práctica T<sub>D</sub> ≈ T.</p>`,r:'Teoría general — vibración libre amortiguada'},

{t:'vib',k:'mc',src:'Nueva',q:'El amortiguamiento de Coulomb (fricción seca) produce un decaimiento de la amplitud de tipo:',
 o:['Exponencial','Lineal','Logarítmico','No hay decaimiento'],a:1,efig:'coulomb',
 e:`La fuerza de fricción tiene magnitud constante F = μ·N. En cada ciclo la amplitud disminuye una cantidad fija <b>4F/k</b>, por eso la envolvente es una <b>recta</b>. En el amortiguamiento viscoso, en cambio, la envolvente es exponencial e<sup>−ξωt</sup>.`,r:'Paz cap. 1 · Chopra cap. 2'},

{t:'vib',k:'mc',src:'Nueva',q:'En resonancia (β = ω̄/ω = 1), el ángulo de fase entre la fuerza armónica y la respuesta estacionaria es:',
 o:['0°','45°','90°','180°'],a:2,
 e:`<span class="eq">tan θ = 2ξβ / (1 − β²)</span><p>Con β = 1 el denominador es cero → θ = <b>90°</b> para cualquier ξ. Para β &lt; 1 la respuesta va casi en fase (θ → 0°) y para β ≫ 1 va en contrafase (θ → 180°).</p>`,r:'Teoría general — carga armónica'},

{t:'vib',k:'mc',src:'Nueva',q:'Cuando la excitación armónica es mucho más rápida que el sistema (β ≫ 1), el factor de amplificación dinámica D tiende a:',
 o:['0','1','1/(2ξ)','Infinito'],a:0,efig:'daf',
 e:`<span class="eq">D = 1 / √[ (1 − β²)² + (2ξβ)² ]</span><p>Si β → ∞, el denominador crece sin límite y D → 0: la masa no alcanza a seguir la fuerza. Este es el principio del aislamiento de vibraciones.</p>`,r:'Teoría general — carga armónica'},

{t:'vib',k:'mc',src:'Nueva',q:'Cuando la carga se aplica muy lentamente comparada con el periodo del sistema (β → 0), el factor de amplificación dinámica D tiende a:',
 o:['0','1','2','1/(2ξ)'],a:1,
 e:`Con β → 0, D = 1/√(1 + 0) = <b>1</b>: la respuesta es igual a la estática u<sub>est</sub> = p<sub>0</sub>/k. Por eso las cargas lentas se analizan estáticamente.`,r:'Teoría general — carga armónica'},

{t:'vib',k:'abierta',src:'Nueva',q:'¿Qué es el factor de amplificación dinámica D y cuál es su expresión para carga armónica?',
 e:`Relación entre la amplitud de la respuesta dinámica estacionaria y el desplazamiento que produciría la misma fuerza aplicada estáticamente:
 <span class="eq">D = u<sub>máx</sub> / u<sub>est</sub> = 1 / √[ (1 − β²)² + (2ξβ)² ]      u<sub>est</sub> = p<sub>0</sub>/k</span>
 <p class="sym">β = ω̄/ω: relación entre la frecuencia de la carga y la natural · ξ: fracción de amortiguamiento crítico · p<sub>0</sub>: amplitud de la fuerza (kN) · k: rigidez (kN/m).</p>
 <p>Vale 1 para β → 0, crece hasta ≈ 1/(2ξ) en β = 1 (resonancia) y tiende a 0 para β ≫ 1.</p>`,efig:'daf',r:'Paz cap. 3 · Chopra cap. 3'},

{t:'vib',k:'abierta',src:'Nueva',q:'¿Qué es un espectro de respuesta y cómo se construye?',
 e:`Gráfica de la <b>respuesta máxima</b> (desplazamiento, velocidad o aceleración) de una familia de osciladores de <b>1 GDL</b> con el mismo amortiguamiento ξ, sometidos a un mismo acelerograma, en función de su periodo T.
 <ol><li>Se escoge el acelerograma ü<sub>g</sub>(t) y la fracción de amortiguamiento ξ.</li><li>Se toma un periodo T (un oscilador).</li><li>Se resuelve m·ü + c·u̇ + k·u = −m·ü<sub>g</sub> (Duhamel o Newmark) y se guarda el máximo |u|.</li><li>Se repite para todos los periodos de interés y se grafica S<sub>d</sub>(T); S<sub>v</sub> = ω·S<sub>d</sub> y S<sub>a</sub> = ω²·S<sub>d</sub>.</li></ol>`,r:'García cap. 5 · NSR-10 A.2.6'},

{t:'vib',k:'order',src:'Nueva',q:'Ordene los pasos para construir el espectro de respuesta de un acelerograma.',
 o:['Seleccionar el acelerograma del terreno','Fijar la fracción de amortiguamiento ξ','Escoger el periodo T de un oscilador de 1 GDL','Calcular la respuesta en el tiempo del oscilador (Duhamel o Newmark)','Extraer el valor máximo de la respuesta','Repetir para todos los periodos y graficar máximo contra T'],
 e:`Cada punto del espectro es el máximo de una historia de respuesta completa. Un espectro se define siempre para un ξ dado (5 % en la NSR-10).`,r:'García cap. 5'},

{t:'vib',k:'mc',src:'Nueva',q:'¿Cuál es la relación entre la pseudo-aceleración espectral Sa y el desplazamiento espectral Sd?',
 o:['Sa = ω·Sd','Sa = ω²·Sd','Sa = Sd / ω²','Sa = 2π·Sd'],a:1,
 e:`<span class="eq">S<sub>v</sub> = ω·S<sub>d</sub>     S<sub>a</sub> = ω·S<sub>v</sub> = ω²·S<sub>d</sub> = (2π/T)²·S<sub>d</sub></span><p>Estas relaciones permiten dibujar los tres espectros en una sola gráfica tripartita.</p>`,r:'García cap. 5 · Chopra cap. 6'},

{t:'vib',k:'vf',src:'Nueva',q:'La integral de Duhamel se puede aplicar directamente a sistemas con comportamiento inelástico.',a:false,
 e:`<b>FALSO.</b> Duhamel se basa en la <b>superposición</b> de respuestas a impulsos, válida solo si k y c son constantes (sistema lineal). Para comportamiento inelástico se usan métodos paso a paso (Newmark, aceleración lineal) actualizando la rigidez.`,r:'Teoría general — Duhamel'},

{t:'vib',k:'mc',src:'Nueva',q:'El método β de Newmark con β = 1/4 y γ = 1/2 corresponde al método de:',
 o:['Aceleración lineal','Aceleración promedio constante','Diferencia central','Wilson-θ'],a:1,
 e:`Con β = 1/4, γ = 1/2 se supone que dentro del paso la aceleración es constante e igual al promedio (ü<sub>i</sub> + ü<sub>i+1</sub>)/2. Es <b>incondicionalmente estable</b>. Con β = 1/6 se obtiene el de aceleración lineal.`,r:'Newmark (1959) · García cap. 3'},

{t:'vib',k:'mc',src:'Nueva',q:'El método de la aceleración lineal (β = 1/6) es estable solo si:',
 o:['Δt ≤ T','Δt/T ≤ 0.551','Siempre es estable','Δt/T ≥ 1'],a:1,
 e:`Es <b>condicionalmente estable</b>: Δt/T<sub>n</sub> ≤ 0.551, con T<sub>n</sub> el periodo más corto del modelo. Para precisión se recomienda Δt ≤ T/10.`,r:'Chopra cap. 5'},

{t:'vib',k:'abierta',src:'Nueva',q:'¿Qué es la ortogonalidad de los modos de vibración y para qué sirve?',
 e:`Para dos modos distintos m ≠ n se cumple:
 <span class="eq">{φ<sub>m</sub>}ᵀ[M]{φ<sub>n</sub>} = 0     {φ<sub>m</sub>}ᵀ[K]{φ<sub>n</sub>} = 0</span>
 <p class="sym">{φ}: vector de forma modal · [M]: matriz de masa · [K]: matriz de rigidez.</p>
 Gracias a ella, al escribir u = Σ φ<sub>n</sub>·q<sub>n</sub>(t) las N ecuaciones acopladas se convierten en N ecuaciones independientes de 1 GDL (coordenadas modales q<sub>n</sub>). Esa es la base del análisis modal espectral.`,r:'Teoría modal · NSR-10 A.5'},

{t:'vib',k:'mc',src:'Nueva',q:'En el análisis modal, las frecuencias naturales de un sistema de varios GDL se obtienen de:',
 o:['det([K] − ω²[M]) = 0','[K]{u} = {F}','[M]{ü} = 0','det([M]) = 0'],a:0,
 e:`La vibración libre no amortiguada con u = φ·sen(ωt) lleva a ([K] − ω²[M]){φ} = 0. Para que exista una solución distinta de cero, el determinante debe anularse: es la <b>ecuación característica</b>.`,r:'Teoría modal'},

{t:'vib',k:'abierta',src:'Nueva',q:'¿Qué es el factor de participación modal Γ y la masa modal efectiva?',
 e:`<span class="eq">Γ<sub>n</sub> = {φ<sub>n</sub>}ᵀ[M]{1} / {φ<sub>n</sub>}ᵀ[M]{φ<sub>n</sub>}     M<sub>n</sub>* = Γ<sub>n</sub>² · {φ<sub>n</sub>}ᵀ[M]{φ<sub>n</sub>}</span>
 <p class="sym">{1}: vector de unos (dirección del sismo) · {φ<sub>n</sub>}: forma del modo n · [M]: matriz de masa.</p>
 Γ<sub>n</sub> mide cuánto excita el sismo al modo n. M<sub>n</sub>* es la parte de la masa total que se mueve con ese modo; la suma de todas es la masa total. La NSR-10 exige incluir modos hasta acumular el <b>90 %</b> de la masa.`,r:'NSR-10 A.5.4.2'},

{t:'vib',k:'vf',src:'Nueva',q:'La combinación modal SRSS es adecuada cuando los periodos de los modos están bien separados; si son cercanos se prefiere CQC.',a:true,
 e:`<b>VERDADERO.</b><span class="eq">SRSS: r = √(Σ r<sub>n</sub>²)     CQC: r = √(Σ<sub>i</sub> Σ<sub>j</sub> ρ<sub>ij</sub>·r<sub>i</sub>·r<sub>j</sub>)</span><p>ρ<sub>ij</sub> es el coeficiente de correlación entre modos; vale casi cero si los periodos están separados (CQC → SRSS) y se acerca a 1 si son cercanos, como en edificios con torsión.</p>`,r:'NSR-10 A.5.4.4'},

{t:'vib',k:'mc',src:'Felizzola · Diseño sismo resistente',q:'¿Por qué funciona el aislamiento sísmico de base?',
 o:['Aumenta la rigidez lateral y reduce el periodo','Alarga el periodo y aleja la estructura de la zona de máxima aceleración espectral','Elimina la masa de la superestructura','Aumenta el valor de Aa del sitio'],a:1,efig:'aislamiento',
 e:`Los aisladores (elastoméricos o de fricción) son muy flexibles horizontalmente: llevan el periodo de, por ejemplo, 0.5 s a 2.5–3 s. En esa zona del espectro S<sub>a</sub> es mucho menor, y además agregan amortiguamiento. A cambio aumentan los desplazamientos en la interfaz de aislamiento.`,r:'Felizzola — "¿Aisladores sísmicos?" · NSR-10 A.3.8'},

{t:'vib',k:'vf',src:'Nueva',q:'La transmisibilidad de una fuerza armónica a la base se reduce por debajo de 1 solo cuando β > √2.',a:true,
 e:`<b>VERDADERO.</b><span class="eq">TR = √[1 + (2ξβ)²] / √[(1 − β²)² + (2ξβ)²]</span><p>Para cualquier ξ, TR = 1 en β = √2. Solo si β &gt; √2 (soporte flexible frente a la frecuencia de la máquina) la fuerza transmitida es menor que la aplicada.</p>`,r:'Paz cap. 3 — aislamiento de vibraciones'},

{t:'vib',k:'multi',src:'Nueva',q:'¿Cuáles de los siguientes métodos permiten obtener la respuesta de un sistema ante una carga arbitraria? (Seleccione todas las correctas.)',
 o:['Integral de Duhamel (convolución)','Método β de Newmark','Método de la aceleración lineal','Decremento logarítmico','Fórmula Ta = Ct·h^α'],a:[0,1,2],
 e:`Duhamel (sistemas lineales), Newmark y aceleración lineal (lineales y no lineales) resuelven cargas arbitrarias. El decremento logarítmico sirve para medir ξ y Ta = Ct·h<sup>α</sup> es una fórmula empírica de periodo.`,r:'García cap. 3'},

{t:'vib',k:'vf',src:'Nueva',q:'En vibración libre no amortiguada la amplitud se mantiene constante indefinidamente.',a:true,
 e:`<b>VERDADERO.</b> Con c = 0 no hay disipación: u(t) = u<sub>0</sub>·cos(ωt) + (v<sub>0</sub>/ω)·sen(ωt), de amplitud ρ = √(u<sub>0</sub>² + (v<sub>0</sub>/ω)²) constante. Es una idealización.`,r:'Teoría general — vibración libre'},

{t:'vib',k:'fill',src:'Nueva',q:'El amortiguamiento crítico vale c_cr = 2·√(k·m) = 2·m·ω, y la fracción de amortiguamiento crítico se define como ξ = [[1]] / c_cr.',a:[['c']],
 e:`ξ = c / c<sub>cr</sub>. c: coeficiente de amortiguamiento real (kN·s/m) · c<sub>cr</sub>: el mínimo que impide la oscilación.`,r:'Teoría general'},

/* ===================== SISMOLOGÍA ===================== */
{t:'sism',k:'mc',src:'Nueva',q:'¿Qué ondas sísmicas llegan primero a una estación sismológica?',
 o:['Ondas S','Ondas Love','Ondas P','Ondas Rayleigh'],a:2,efig:'ondas4',
 e:`Las ondas <b>P</b> (primarias, de compresión) son las más rápidas: unos 6 km/s en la corteza. Luego llegan las S (≈ 3.5 km/s) y al final las superficiales.`,r:'Sismología general'},

{t:'sism',k:'vf',src:'Nueva',q:'Las ondas S no se propagan a través de líquidos.',a:true,
 e:`<b>VERDADERO.</b> Son ondas de cortante y los líquidos no tienen rigidez al corte (G = 0). Así se dedujo que el núcleo externo de la Tierra es líquido.`,r:'Sismología general'},

{t:'sism',k:'match',src:'Nueva',q:'Relacione cada tipo de onda con el movimiento de las partículas del terreno.',
 o:[['Onda P','Paralelo a la dirección de propagación (compresión y dilatación)'],['Onda S','Perpendicular a la dirección de propagación (cortante)'],['Onda Love','Horizontal y transversal, solo cerca de la superficie'],['Onda Rayleigh','Órbita elíptica en el plano vertical, como el oleaje']],
 e:`P y S son ondas de cuerpo; Love y Rayleigh son superficiales, de mayor amplitud y más dañinas para las edificaciones.`,efig:'ondas4',r:'Sismología general'},

{t:'sism',k:'mc',src:'Nueva',q:'Un aumento de una unidad en la magnitud de un sismo equivale a una energía liberada aproximadamente:',
 o:['2 veces mayor','10 veces mayor','32 veces mayor','100 veces mayor'],a:2,
 e:`<span class="eq">log<sub>10</sub>E = 11.8 + 1.5·M  →  E<sub>2</sub>/E<sub>1</sub> = 10<sup>1.5·ΔM</sup></span><p>Con ΔM = 1: 10<sup>1.5</sup> ≈ <b>31.6</b>. La amplitud del registro sí aumenta 10 veces.</p>`,r:'Sismología general — Gutenberg-Richter'},

{t:'sism',k:'mc',src:'Nueva',q:'Un sismo de magnitud 7 libera, respecto a uno de magnitud 5, aproximadamente:',
 o:['2 veces más energía','64 veces más energía','100 veces más energía','1000 veces más energía'],a:3,
 e:`ΔM = 2 → E<sub>2</sub>/E<sub>1</sub> = 10<sup>1.5×2</sup> = 10³ = <b>1000</b>.`,r:'Sismología general'},

{t:'sism',k:'vf',src:'Nueva',q:'Un mismo sismo tiene una sola magnitud, pero puede tener diferentes intensidades en distintos lugares.',a:true,
 e:`<b>VERDADERO.</b> La magnitud mide la energía liberada en la fuente (un valor por sismo). La intensidad mide los efectos en cada sitio y depende de la distancia, el suelo y la calidad de las construcciones.`,r:'Sismología general'},

{t:'sism',k:'match',src:'Nueva',q:'Relacione cada concepto con su forma de medirlo.',
 o:[['Magnitud','Instrumental y objetiva: escalas de Richter, Ms, mb y Mw'],['Intensidad','Descriptiva, según daños y percepción: Mercalli Modificada I a XII'],['Isosistas','Curvas que unen puntos de igual intensidad'],['Acelerograma','Registro de la aceleración del terreno en el tiempo']],
 e:`Magnitud e intensidad son las dos medidas clásicas del tamaño de un sismo y se confunden con frecuencia en los parciales.`,r:'Sismología general'},

{t:'sism',k:'mc',src:'Nueva',q:'La magnitud de momento Mw se calcula a partir de:',
 o:['La amplitud máxima del sismograma a 100 km','El momento sísmico M0 = μ·A·D','Los daños observados en las edificaciones','La duración total del registro'],a:1,
 e:`<span class="eq">M<sub>0</sub> = μ·A·D     M<sub>w</sub> = (2/3)·log<sub>10</sub>M<sub>0</sub> − 10.7  (M<sub>0</sub> en dina·cm)</span><p class="sym">μ: módulo de rigidez de la roca · A: área de ruptura de la falla · D: deslizamiento promedio.</p><p>Al depender de la física de la ruptura, Mw <b>no se satura</b> en sismos grandes, como sí ocurre con ML y Ms.</p>`,r:'Sismología general'},

{t:'sism',k:'mc',src:'Nueva',q:'Un sismo de foco intermedio tiene una profundidad focal de:',
 o:['Menos de 70 km','Entre 70 y 300 km','Más de 300 km','Exactamente 33 km'],a:1,
 e:`Superficiales: &lt; 70 km. Intermedios: 70–300 km. Profundos: &gt; 300 km. El nido sísmico de Bucaramanga es un ejemplo de sismicidad de profundidad intermedia (≈ 150 km).`,r:'Sismología general'},

{t:'sism',k:'fill',src:'Nueva',q:'La proyección vertical del hipocentro sobre la superficie terrestre se denomina [[1]].',a:[['epicentro']],
 e:`<b>Epicentro.</b> La distancia del epicentro al sitio es la distancia epicentral; la del hipocentro al sitio, la distancia focal o hipocentral.`,efig:'foco',r:'Sismología general'},

{t:'sism',k:'mc',src:'Nueva',q:'Falla en la que el bloque colgante desciende respecto al bloque yacente, típica de esfuerzos de tracción:',
 o:['Falla inversa','Falla normal','Falla transcurrente dextral','Falla de cabalgamiento'],a:1,efig:'fallas',
 e:`En la falla <b>normal</b> la corteza se estira (tracción) y el bloque colgante baja. En la <b>inversa</b> (o de cabalgamiento si el ángulo es bajo) la corteza se acorta (compresión) y el bloque colgante sube. En las <b>transcurrentes</b> el movimiento es horizontal.`,r:'Sismología general'},

{t:'sism',k:'mc',src:'Nueva',q:'Las fallas inversas se asocian a un régimen de esfuerzos de:',
 o:['Tracción','Compresión','Cortante horizontal puro','Esfuerzos térmicos'],a:1,
 e:`Compresión: los bloques se empujan, el colgante sube sobre el yacente. Es el régimen típico de las zonas de convergencia como los Andes colombianos.`,r:'Sismología general'},

{t:'sism',k:'abierta',src:'Nueva',q:'¿Qué es el periodo de retorno y cómo se relaciona con la probabilidad de excedencia del sismo de diseño?',
 e:`Tiempo promedio (años) entre dos eventos que igualan o superan un nivel de movimiento dado en un sitio. Con un modelo de Poisson:
 <span class="eq">p = 1 − e<sup>−t/T<sub>R</sub></sup>   →   T<sub>R</sub> = −t / ln(1 − p)</span>
 <p class="sym">p: probabilidad de excedencia · t: tiempo de exposición o vida útil (años) · T<sub>R</sub>: periodo de retorno (años).</p>
 <p>Sismo de diseño NSR-10: p = 10 % en t = 50 años → T<sub>R</sub> = −50/ln(0.9) ≈ <b>475 años</b>.</p>`,r:'NSR-10 A.2.2'},

{t:'sism',k:'mc',src:'Nueva',q:'El sismo de diseño de la NSR-10 tiene una probabilidad de excedencia de:',
 o:['2 % en 50 años','10 % en 50 años','50 % en 50 años','10 % en 100 años'],a:1,
 e:`10 % en 50 años, que equivale a un periodo de retorno de unos <b>475 años</b>. Los movimientos del umbral de daño (edificaciones indispensables) corresponden a sismos más frecuentes.`,r:'NSR-10 A.2.2'},

{t:'sism',k:'mc',src:'Nueva',q:'¿Qué sismo motivó la expedición del primer código colombiano de construcciones sismorresistentes (Decreto 1400 de 1984)?',
 o:['Popayán, 1983','Armenia (Eje Cafetero), 1999','Tumaco, 1979','Cúcuta, 1875'],a:0,
 e:`El sismo de <b>Popayán del 31 de marzo de 1983</b> (M 5.5) llevó al Código Colombiano de Construcciones Sismo Resistentes CCCSR-84. Le siguieron la Ley 400 de 1997, la NSR-98 y la NSR-10.`,r:'Historia de la normativa colombiana'},

{t:'sism',k:'mc',src:'Nueva',q:'¿Qué instrumento es el adecuado para registrar el movimiento fuerte del terreno cerca de la zona epicentral?',
 o:['Sismógrafo de periodo largo','Acelerógrafo','Barómetro','Inclinómetro'],a:1,
 e:`El <b>acelerógrafo</b> registra aceleraciones altas sin saturarse; el sismógrafo es muy sensible y se satura en el campo cercano. Los acelerogramas son la base de los espectros de diseño.`,r:'NSR-10 A.11 · Sismología general'},

{t:'sism',k:'vf',src:'Nueva',q:'La velocidad y el desplazamiento del terreno se obtienen integrando una y dos veces el acelerograma.',a:true,
 e:`<b>VERDADERO.</b> v<sub>g</sub>(t) = ∫ ü<sub>g</sub> dt y u<sub>g</sub>(t) = ∫ v<sub>g</sub> dt, con corrección de línea base para eliminar derivas numéricas.`,r:'Sismología — procesamiento de registros'},

{t:'sism',k:'abierta',src:'Nueva',q:'¿Cómo se estima la distancia de una estación al foco con la diferencia de llegada de las ondas P y S?',
 e:`Las dos ondas parten juntas del foco pero viajan a velocidades distintas, de modo que el retraso Δt = t<sub>S</sub> − t<sub>P</sub> crece con la distancia d:
 <span class="eq">Δt = d/V<sub>S</sub> − d/V<sub>P</sub>   →   d = Δt · V<sub>P</sub>·V<sub>S</sub> / (V<sub>P</sub> − V<sub>S</sub>)</span>
 <p>Con V<sub>P</sub> ≈ 6 km/s y V<sub>S</sub> ≈ 3.5 km/s, d ≈ 8.4·Δt (km). Con tres estaciones se triangula el epicentro.</p>`,efig:'sismograma',r:'Sismología general'},

/* ===================== AMENAZA, SUELOS Y ESPECTRO ===================== */
{t:'amen',k:'mc',src:'Felizzola U2',q:'Bogotá tiene Aa = 0.15 y Av = 0.20. ¿En qué zona de amenaza sísmica se encuentra?',
 o:['Baja','Intermedia','Alta','No se puede determinar sin el perfil de suelo'],a:1,
 e:`Intermedia: Aa o Av (o ambos) son mayores de 0.10 y ninguno excede 0.20. Aquí Aa = 0.15 &gt; 0.10 y Av = 0.20 no excede 0.20. Bogotá además cuenta con microzonificación sísmica propia.`,r:'NSR-10 A.2.3 · Apéndice A-4'},

{t:'amen',k:'mc',src:'Felizzola U2',q:'Cali tiene Aa = 0.25 y Av = 0.25. ¿En qué zona de amenaza sísmica se encuentra?',
 o:['Baja','Intermedia','Alta'],a:2,
 e:`Alta: basta con que Aa o Av sea mayor que 0.20.`,r:'NSR-10 A.2.3'},

{t:'amen',k:'mc',src:'Felizzola U2',q:'Barranquilla tiene Aa = 0.10 y Av = 0.10. ¿En qué zona de amenaza sísmica se encuentra?',
 o:['Baja','Intermedia','Alta'],a:0,
 e:`Baja: <b>tanto</b> Aa como Av son menores o iguales a 0.10.`,r:'NSR-10 A.2.3'},

{t:'amen',k:'vf',src:'Felizzola U2',q:'Una ciudad con Aa = 0.10 y Av = 0.15 está en zona de amenaza sísmica baja porque Aa no supera 0.10.',a:false,
 e:`<b>FALSO.</b> La zona baja exige que <b>ambos</b> coeficientes sean ≤ 0.10. Como Av = 0.15 &gt; 0.10 y ninguno pasa de 0.20, la zona es <b>intermedia</b> (por ejemplo Montería o Sincelejo).`,r:'NSR-10 A.2.3'},

{t:'amen',k:'match',src:'NSR-10 Tabla A.2.4-1',q:'Relacione cada perfil de suelo con su descripción (NSR-10).',
 o:[['A','Roca competente, Vs > 1500 m/s'],['B','Roca de rigidez media, 760 < Vs ≤ 1500 m/s'],['C','Suelo muy denso o roca blanda, 360 < Vs ≤ 760 m/s'],['D','Suelo rígido, 180 ≤ Vs ≤ 360 m/s'],['E','Suelo blando, Vs < 180 m/s'],['F','Requiere evaluación particular del sitio']],
 e:`V<sub>s</sub> es la velocidad media de la onda de cortante en los 30 m superiores. A menor V<sub>s</sub>, suelo más blando y mayor amplificación en periodos intermedios.`,r:'NSR-10 Tabla A.2.4-1'},

{t:'amen',k:'mc',src:'NSR-10 Tabla A.2.4-1',q:'Un depósito con velocidad media de onda de cortante Vs = 250 m/s en los 30 m superiores corresponde al perfil:',
 o:['B','C','D','E'],a:2,
 e:`180 ≤ 250 ≤ 360 m/s → perfil <b>D</b> (suelos rígidos).`,r:'NSR-10 Tabla A.2.4-1'},

{t:'amen',k:'mc',src:'NSR-10 A.2.4',q:'¿Para qué perfil de suelo la NSR-10 no da valores de Fa y Fv y exige un estudio de respuesta dinámica del sitio?',
 o:['Perfil C','Perfil D','Perfil E','Perfil F'],a:3,
 e:`Perfil <b>F</b>: suelos licuables o colapsables, turbas y arcillas orgánicas, arcillas de muy alta plasticidad y arcillas blandas de gran espesor.`,r:'NSR-10 A.2.4.1 · A.2.10'},

{t:'amen',k:'vf',src:'NSR-10 Tablas A.2.4-3 y A.2.4-4',q:'Para roca competente (perfil A), Fa = Fv = 0.8 para cualquier valor de Aa y Av.',a:true,
 e:`<b>VERDADERO.</b> La roca dura <b>atenúa</b> ligeramente el movimiento respecto a la roca de referencia (perfil B, con Fa = Fv = 1.0).`,r:'NSR-10 Tablas A.2.4-3 y A.2.4-4'},

{t:'amen',k:'mc',src:'NSR-10 Tabla A.2.4-3',q:'En un suelo blando (perfil E) con Aa ≤ 0.10, el coeficiente Fa vale:',
 o:['1.0','1.6','2.5','3.5'],a:2,
 e:`Fa = <b>2.5</b>. En suelos blandos la amplificación en periodos cortos es alta cuando el sismo es débil y disminuye cuando Aa crece (comportamiento no lineal del suelo): con Aa ≥ 0.4 baja a 0.9.`,r:'NSR-10 Tabla A.2.4-3'},

{t:'amen',k:'mc',src:'NSR-10 Tabla A.2.4-4',q:'¿Cuál es el mayor valor de Fv en la Tabla A.2.4-4 y a qué caso corresponde?',
 o:['2.4, perfil D con Av ≤ 0.1','3.5, perfil E con Av ≤ 0.1','2.5, perfil E con Av ≥ 0.5','1.7, perfil C con Av ≤ 0.1'],a:1,
 e:`Fv = <b>3.5</b> en perfil E con Av ≤ 0.10. Por eso los suelos blandos son críticos para edificios de periodo intermedio y largo.`,r:'NSR-10 Tabla A.2.4-4'},

{t:'amen',k:'mc',src:'NSR-10 A.2.6',q:'En el espectro de diseño de la NSR-10, el periodo Tc = 0.48·Av·Fv/(Aa·Fa) marca:',
 o:['El inicio de la meseta de aceleración constante','El fin de la meseta y el inicio de la rama de velocidad constante','El inicio de la zona de desplazamiento constante','El periodo fundamental de la edificación'],a:1,efig:'espectroNSR',
 e:`T<sub>C</sub> es el periodo donde la meseta 2.5·Aa·Fa·I se cruza con la rama 1.2·Av·Fv·I/T. Igualando: T<sub>C</sub> = 1.2·Av·Fv/(2.5·Aa·Fa) = 0.48·Av·Fv/(Aa·Fa).`,r:'NSR-10 A.2.6'},

{t:'amen',k:'mc',src:'NSR-10 A.2.6',q:'El periodo TL = 2.4·Fv marca:',
 o:['El inicio de la meseta','El fin de la meseta','El inicio de la rama de desplazamiento constante','El límite de aplicación de la FHE'],a:2,
 e:`Para T &gt; T<sub>L</sub>, S<sub>a</sub> = 1.2·Av·Fv·T<sub>L</sub>·I/T²: la aceleración decae con 1/T², lo que corresponde a un desplazamiento espectral constante.`,r:'NSR-10 A.2.6'},

{t:'amen',k:'match',src:'Felizzola U2 · Tabla A.2.5-1',q:'Relacione cada grupo de uso con su coeficiente de importancia I.',
 o:[['Grupo IV, indispensables','1.50'],['Grupo III, atención a la comunidad','1.25'],['Grupo II, ocupación especial','1.10'],['Grupo I, ocupación normal','1.00']],
 e:`I multiplica todas las ramas del espectro: un hospital (I = 1.5) se diseña para fuerzas 50 % mayores que una vivienda.`,r:'NSR-10 Tabla A.2.5-1'},

{t:'amen',k:'match',src:'Felizzola U2',q:'Asigne a cada edificación su grupo de uso según la diapositiva del curso.',
 o:[['Hospital con cirugía y cuidados intensivos','Grupo IV'],['Estación de bomberos','Grupo III'],['Universidad','Grupo III'],['Centro comercial con 800 m² por piso','Grupo II'],['Edificio gubernamental','Grupo II'],['Edificio de apartamentos','Grupo I']],
 e:`Grupo IV: hospitales con cirugía/UCI/urgencias, aeropuertos, transporte masivo, centrales de control de líneas vitales. Grupo III: bomberos, defensa civil, cuarteles, centros de emergencia, guarderías, escuelas, colegios y universidades. Grupo II: más de 200 personas por salón, graderías &gt; 2000 personas, comercio &gt; 500 m² por piso, hospitales no incluidos en IV, &gt; 3000 personas, edificios gubernamentales.`,r:'NSR-10 A.2.5.1'},

{t:'amen',k:'vf',src:'Felizzola U2',q:'Los edificios gubernamentales pertenecen al Grupo de uso III.',a:false,
 e:`<b>FALSO.</b> Según la diapositiva y la NSR-10 A.2.5.1.3 (f), los edificios gubernamentales son <b>Grupo II</b>, ocupación especial, con I = 1.10.`,r:'NSR-10 A.2.5.1.3'},

{t:'amen',k:'vf',src:'Felizzola U2',q:'Una edificación con un salón donde se pueden reunir más de 200 personas pertenece al Grupo de uso II.',a:true,
 e:`<b>VERDADERO.</b> Es el caso (a) del Grupo II: auditorios, iglesias, salones de eventos.`,r:'NSR-10 A.2.5.1.3'},

{t:'amen',k:'mc',src:'Felizzola U2',q:'Las graderías al aire libre se clasifican en el Grupo II cuando pueden albergar a la vez más de:',
 o:['200 personas','500 personas','2000 personas','3000 personas'],a:2,
 e:`Más de <b>2000</b> personas. No confundir con los 200 por salón (caso a) ni con las 3000 personas que trabajen o residan (caso e).`,r:'NSR-10 A.2.5.1.3'},

{t:'amen',k:'mc',src:'Felizzola U2',q:'Las estructuras que albergan plantas de generación eléctrica de emergencia y los tanques del sistema contra incendio de un hospital del Grupo IV se clasifican en:',
 o:['Grupo I','Grupo II','Grupo III','Grupo IV'],a:3,
 e:`La diapositiva lo indica: deben incluirse en el <b>Grupo IV</b>, porque sin ellas la edificación indispensable no puede funcionar después del sismo.`,r:'NSR-10 A.2.5.1.1'},

{t:'amen',k:'mc',src:'NSR-10 A.2.6',q:'En la meseta del espectro, Sa = 2.5·Aa·Fa·I. ¿Qué representa el factor 2.5?',
 o:['Un factor de seguridad','La amplificación espectral promedio de la aceleración del terreno para ξ = 5 %','El coeficiente de importancia máximo','La ductilidad de la estructura'],a:1,
 e:`Los estudios de espectros de respuesta muestran que, para ξ = 5 %, los osciladores de periodo corto amplifican la aceleración pico del terreno unas <b>2.5 veces</b> en promedio.`,r:'NSR-10 A.2.6'},

{t:'amen',k:'abierta',src:'Felizzola · Diseño sismo resistente',q:'Explique paso a paso cómo se construye el espectro elástico de diseño de la NSR-10 para un proyecto.',
 e:`<ol><li><b>Aa y Av:</b> se leen para el municipio en el Apéndice A-4 (o Figuras A.2.3-2 y A.2.3-3).</li><li><b>Perfil de suelo:</b> se clasifica con el estudio geotécnico (Tabla A.2.4-1).</li><li><b>Fa y Fv:</b> Tablas A.2.4-3 y A.2.4-4, interpolando linealmente.</li><li><b>Grupo de uso e I:</b> Tabla A.2.5-1.</li><li><b>Periodos de transición:</b> T<sub>0</sub> = 0.1·Av·Fv/(Aa·Fa), T<sub>C</sub> = 0.48·Av·Fv/(Aa·Fa), T<sub>L</sub> = 2.4·Fv.</li><li><b>Ramas:</b> S<sub>a</sub> = 2.5·Aa·Fa·I (T ≤ T<sub>C</sub>); S<sub>a</sub> = 1.2·Av·Fv·I/T (T<sub>C</sub> &lt; T ≤ T<sub>L</sub>); S<sub>a</sub> = 1.2·Av·Fv·T<sub>L</sub>·I/T² (T &gt; T<sub>L</sub>).</li></ol>`,efig:'espectroNSR',r:'NSR-10 A.2.6'},

{t:'amen',k:'order',src:'NSR-10 A.2',q:'Ordene los pasos para obtener el espectro elástico de diseño.',
 o:['Ubicar el municipio y leer Aa y Av (Apéndice A-4)','Clasificar el perfil de suelo (Tabla A.2.4-1)','Obtener Fa y Fv (Tablas A.2.4-3 y A.2.4-4)','Definir el grupo de uso y el coeficiente I (Tabla A.2.5-1)','Calcular To, Tc y TL','Trazar las ramas de Sa(T)'],
 e:`Es el orden del Capítulo A.2: amenaza, efectos de sitio, importancia y espectro.`,r:'NSR-10 Capítulo A.2'},

{t:'amen',k:'mc',src:'NSR-10 Tabla A.2.5-1',q:'Si una edificación cambia de uso y pasa del Grupo I al Grupo IV, las ordenadas del espectro de diseño:',
 o:['No cambian','Aumentan 25 %','Aumentan 50 %','Se duplican'],a:2,
 e:`I pasa de 1.00 a 1.50 y multiplica todas las ramas: S<sub>a</sub> aumenta <b>50 %</b>.`,r:'NSR-10 A.2.5 · A.2.6'},

{t:'amen',k:'vf',src:'NSR-10 A.2.2',q:'Aa y Av dependen del perfil de suelo del sitio.',a:false,
 e:`<b>FALSO.</b> Aa y Av representan la amenaza sísmica del lugar (en roca de referencia) y se leen por municipio. El efecto del suelo entra con <b>Fa y Fv</b>.`,r:'NSR-10 A.2.2 · A.2.4'},

{t:'amen',k:'mc',src:'Felizzola · Diseño sismo resistente',q:'Según la presentación del curso, Aa representa:',
 o:['La velocidad horizontal pico efectiva','La aceleración pico efectiva horizontal en roca para periodos cortos, como fracción de g','La aceleración espectral máxima del edificio','La amplificación del suelo en periodos cortos'],a:1,
 e:`Aa: aceleración horizontal pico efectiva para diseño (en roca, controla periodos cortos), expresada como fracción de la gravedad. Av: velocidad horizontal pico efectiva (controla periodos intermedios).`,r:'NSR-10 A.2.2'},

{t:'amen',k:'abierta',src:'Felizzola · Diseño sismo resistente',q:'Enuncie los parámetros sísmicos necesarios para realizar un análisis sísmico según la presentación del curso.',
 e:`<ul><li><b>Aa</b>: aceleración horizontal pico efectiva de diseño.</li><li><b>Av</b>: velocidad horizontal pico efectiva de diseño.</li><li><b>Fa</b>: amplificación por efectos de sitio en periodos cortos.</li><li><b>Fv</b>: amplificación por efectos de sitio en periodos intermedios.</li><li><b>I</b>: coeficiente de importancia según el grupo de uso.</li><li><b>Sa</b>: valor del espectro de aceleraciones de diseño para el periodo T.</li><li><b>R</b>: coeficiente de capacidad de disipación de energía (R = φa·φp·φr·Ro).</li></ul>`,r:'NSR-10 A.2 · A.3'},

/* ===================== SISTEMAS Y R ===================== */
{t:'sist',k:'match',src:'Felizzola U2',q:'Relacione cada sistema estructural con la forma como resiste las cargas.',
 o:[['Muros de carga','Sin pórtico esencialmente completo; muros de carga resisten cargas verticales'],['Combinado','Pórtico no resistente a momentos para cargas verticales y muros o diagonales para las horizontales'],['Pórtico','Pórtico espacial resistente a momentos, sin diagonales, que resiste todas las cargas'],['Dual','Pórtico resistente a momentos (≥ 25 % del cortante) más muros o diagonales (≥ 75 %)']],
 e:`La NSR-10 reconoce estos <b>cuatro</b> sistemas (A.3.2). La FHE y el análisis dinámico son métodos de análisis, no sistemas.`,efig:'sistemas4',r:'NSR-10 A.3.2.1'},

{t:'sist',k:'vf',src:'Felizzola U2',q:'En un sistema dual, el pórtico resistente a momentos, actuando independientemente, debe resistir como mínimo el 25 % del cortante sísmico en la base.',a:true,
 e:`<b>VERDADERO.</b> Es el requisito (b) del sistema dual en la diapositiva.`,r:'NSR-10 A.3.2.1.4'},

{t:'sist',k:'vf',src:'Felizzola U2',q:'En un sistema dual, la responsabilidad de los muros estructurales puede ser menor del 75 % del cortante en la base si el pórtico es DES.',a:false,
 e:`<b>FALSO.</b> La diapositiva es clara: "en ningún caso la responsabilidad de los muros estructurales, o de los pórticos con diagonales, puede ser menor del 75 por ciento del cortante sísmico en la base".`,r:'NSR-10 A.3.2.1.4 (c)'},

{t:'sist',k:'mc',src:'Felizzola U2',q:'Según la diapositiva del sistema dual, ¿cuál de estos pórticos NO está permitido como pórtico resistente a momentos del sistema dual?',
 o:['Pórtico de concreto reforzado DES','Pórtico de concreto reforzado DMO','Pórtico de acero estructural DMI','Pórtico de concreto reforzado DMI'],a:3,
 e:`La diapositiva admite: pórtico DES de concreto o acero, pórtico <b>DMO de concreto</b> o pórtico <b>DMI de acero</b>. Un pórtico de concreto DMI no se menciona.`,r:'NSR-10 A.3.2.1.4 (b)'},

{t:'sist',k:'vf',src:'Felizzola U2',q:'Un pórtico resistente a momentos combinado con muros estructurales que no cumple los requisitos del sistema dual se clasifica como sistema combinado.',a:true,
 e:`<b>VERDADERO.</b> Es la condición (b) del sistema combinado.`,r:'NSR-10 A.3.2.1.2'},

{t:'sist',k:'mc',src:'Felizzola U2',q:'Sistema estructural que no dispone de un pórtico esencialmente completo y en el que las cargas verticales las resisten muros:',
 o:['Sistema de pórtico','Sistema dual','Sistema de muros de carga','Sistema combinado'],a:2,
 e:`<b>Muros de carga</b>: las fuerzas horizontales las resisten muros estructurales o pórticos con diagonales.`,r:'NSR-10 A.3.2.1.1'},

{t:'sist',k:'vf',src:'Felizzola · Diseño sismo resistente',q:'Como R = φa·φp·φr·Ro y cada φ ≤ 1, siempre se cumple R ≤ Ro.',a:true,
 e:`<b>VERDADERO.</b> Los coeficientes φ penalizan las irregularidades y la falta de redundancia; valen 1.0 en una estructura regular y redundante.`,r:'NSR-10 A.3.3.3'},

{t:'sist',k:'mc',src:'NSR-10 A.3.3',q:'Pórtico de concreto DES (Ro = 7.0) con irregularidad torsional 1aP (φp = 0.9), regular en altura y redundante. ¿Cuánto vale R?',
 o:['7.0','6.3','5.6','7.9'],a:1,
 e:`<span class="eq">R = φa·φp·φr·Ro = 1.0 × 0.9 × 1.0 × 7.0 = 6.3</span>`,r:'NSR-10 A.3.3.3 · Tabla A.3-6'},

{t:'sist',k:'mc',src:'NSR-10 A.3.3.4',q:'Una edificación tiene simultáneamente dos irregularidades en planta, con φp = 0.9 y φp = 0.8. ¿Qué valor de φp se usa?',
 o:['0.72 (producto)','0.85 (promedio)','0.8 (el menor)','0.9 (el mayor)'],a:2,
 e:`Se usa el <b>menor</b> valor de φp entre las irregularidades presentes; no se multiplican. Lo mismo para φa.`,r:'NSR-10 A.3.3.4 · A.3.3.5'},

{t:'sist',k:'match',src:'NSR-10 Tablas A.3-1 a A.3-4',q:'Relacione cada sistema con su coeficiente Ro.',
 o:[['Dual: muros de concreto DES + pórtico de concreto DES','8.0'],['Pórtico de concreto DES','7.0'],['Pórtico de concreto DMO','5.0'],['Pórtico de concreto DMI','2.5'],['Muros de carga de mampostería no reforzada','1.0']],
 e:`A mayor capacidad de disipación de energía, mayor Ro y menor fuerza de diseño (S<sub>a</sub>/R), pero más exigencias de detallado.`,r:'NSR-10 Tablas A.3-1 a A.3-4'},

{t:'sist',k:'vf',src:'Nueva',q:'Diseñar con capacidad especial (DES) permite usar un R mayor y fuerzas menores, a cambio de requisitos de detallado más estrictos.',a:true,
 e:`<b>VERDADERO.</b> El detallado DES (confinamiento, longitudes de traslapo, columna fuerte–viga débil) es lo que garantiza la ductilidad supuesta al dividir por R.`,r:'NSR-10 A.3.1 · C.21'},

{t:'sist',k:'abierta',src:'Nueva',q:'¿Por qué se permite dividir el espectro elástico por R para diseñar?',
 e:`Porque una estructura bien detallada puede <b>incursionar en el rango inelástico</b> sin colapsar: disipa energía mediante deformación plástica (ductilidad), tiene sobrerresistencia y redundancia. Diseñarla para las fuerzas elásticas completas sería antieconómico. Se acepta daño controlado ante el sismo de diseño, siempre que el detallado garantice esa ductilidad. Por eso E = F<sub>s</sub>/R para diseñar elementos, mientras las derivas se revisan con F<sub>s</sub> sin reducir.`,r:'NSR-10 A.3.1 · A.3.3'},

{t:'sist',k:'mc',src:'NSR-10 A.3.3.9',q:'El coeficiente de sobrerresistencia Ωo se usa para:',
 o:['Reducir las fuerzas sísmicas de todos los elementos','Amplificar las fuerzas de diseño de elementos que no deben fallar antes que los dúctiles','Calcular el periodo aproximado Ta','Clasificar el perfil de suelo'],a:1,
 e:`Es diseño por capacidad: ciertos elementos frágiles o críticos (columnas que soportan elementos discontinuos, conexiones) se diseñan con E multiplicado por Ωo para que la falla ocurra en las zonas dúctiles previstas.`,r:'NSR-10 A.3.3.9'},

{t:'sist',k:'mc',src:'Felizzola · Diseño sismo resistente',q:'Según la presentación, la capacidad de disipación de energía se cuantifica por medio de:',
 o:['El periodo fundamental','La energía de deformación que el elemento es capaz de disipar','El coeficiente de importancia','La masa de la estructura'],a:1,efig:'histeresis',
 e:`Capacidad de trabajar en el rango inelástico sin perder resistencia, cuantificada por la <b>energía de deformación</b> disipada: el área encerrada por los ciclos de histéresis fuerza–desplazamiento.`,r:'NSR-10 A.3.1'},

{t:'sist',k:'vf',src:'NSR-10 A.3.3.8',q:'φr = 0.75 penaliza a las estructuras con ausencia de redundancia en el sistema de resistencia sísmica.',a:true,
 e:`<b>VERDADERO.</b> φr vale 1.0 si hay redundancia (varias líneas resistentes y la falla de un elemento no compromete la estabilidad) y 0.75 si no la hay.`,r:'NSR-10 A.3.3.8'},

{t:'sist',k:'match',src:'Felizzola · Diseño sismo resistente',q:'Relacione cada sigla con el grado de capacidad de disipación de energía y la zona donde es exigible como mínimo.',
 o:[['DMI','Mínima: zona de amenaza baja'],['DMO','Moderada: zona de amenaza intermedia'],['DES','Especial: zona de amenaza alta']],
 e:`En cada zona se puede diseñar con el grado exigido o uno superior: baja → DMI, DMO o DES; intermedia → DMO o DES; alta → solo DES.`,r:'NSR-10 A.3.1'},

{t:'sist',k:'abierta',src:'Felizzola · Diseño sismo resistente',q:'Escriba la expresión del coeficiente R y explique cada término.',
 e:`<span class="eq">R = φa · φp · φr · Ro</span>
 <ul><li><b>Ro</b>: coeficiente de capacidad de disipación de energía <b>básico</b>, según sistema estructural, material y grado (Tablas A.3-1 a A.3-4).</li><li><b>φa</b>: reducción por irregularidades <b>en altura</b> (Tabla A.3-7).</li><li><b>φp</b>: reducción por irregularidades <b>en planta</b> (Tabla A.3-6).</li><li><b>φr</b>: reducción por <b>ausencia de redundancia</b> (1.0 o 0.75).</li></ul>`,r:'NSR-10 A.3.3.3'},

/* ===================== CONFIGURACIÓN ===================== */
{t:'conf',k:'abierta',src:'Felizzola · Diseño sismo resistente',q:'Mencione las recomendaciones generales de estructuración que da la presentación para un buen comportamiento sísmico.',
 e:`<ul><li>El edificio debe ser <b>ligero</b> (la fuerza sísmica es proporcional a la masa).</li><li>El sistema estructural debe ser <b>simple</b>.</li><li>Evitar plantas <b>excesivamente alargadas</b> o de áreas muy grandes.</li><li>Los elementos no estructurales deben <b>aislarse</b> de la estructura o <b>integrarse</b> a ella y diseñarse como tal.</li><li>Detallar para que las deformaciones plásticas ocurran en las <b>regiones deseadas</b>, según una jerarquía preestablecida (columna fuerte–viga débil).</li><li>La estructura debe ser <b>redundante</b>.</li></ul>`,r:'Felizzola — Aspectos que afectan el comportamiento sísmico'},

{t:'conf',k:'multi',src:'Felizzola · Diseño sismo resistente',q:'¿Cuáles de las siguientes son recomendaciones de estructuración de la presentación del curso? (Seleccione todas.)',
 o:['El edificio debe ser ligero','El sistema estructural debe ser simple','Concentrar la masa en los pisos superiores','La estructura debe ser redundante','Dejar el primer piso libre de muros para parqueaderos','Aislar o integrar los elementos no estructurales'],a:[0,1,3,5],
 e:`Concentrar masa arriba y dejar un piso blando son, precisamente, configuraciones que la presentación muestra como indeseables.`,r:'Felizzola — Recomendaciones'},

{t:'conf',k:'mc',src:'Felizzola · Diseño sismo resistente',fig:'masaArriba',q:'La figura muestra un edificio con un tanque de agua y una piscina en la cubierta. ¿Qué aspecto desfavorable ilustra?',
 o:['Esbeltez del edificio','Distribución indeseable de la masa','Ejes resistentes unidireccionales','Planta alargada'],a:1,
 e:`Las grandes masas en pisos altos aumentan las fuerzas de inercia donde la aceleración de respuesta es mayor y elevan el momento de vuelco. Las masas importantes deben ubicarse en los niveles bajos.`,r:'Felizzola — Distribución indeseable de la masa · NSR-10 Tabla A.3-7 (2A)'},

{t:'conf',k:'mc',src:'Felizzola · Diseño sismo resistente',fig:'alas',q:'La planta de la figura tiene forma de L con alas largas. ¿Cuál es el problema y la solución usual?',
 o:['Ninguno: la forma en L es más rígida','Cada ala vibra distinto y se concentran esfuerzos en la esquina entrante; se separan los cuerpos con juntas sísmicas','El edificio queda muy liviano; se agrega masa','Se reduce el periodo; se usan aisladores'],a:1,
 e:`Las alas responden con desplazamientos diferentes y la esquina entrante concentra esfuerzos; además aparece torsión. La solución es dividir en cuerpos rectangulares con <b>juntas de separación sísmica</b> o rigidizar la esquina.`,r:'Felizzola — Alas alargadas · NSR-10 Tabla A.3-6 (2P)'},

{t:'conf',k:'mc',src:'Felizzola · Diseño sismo resistente',fig:'plantaLarga',q:'¿Por qué es desfavorable una planta muy alargada como la de la figura?',
 o:['Porque el movimiento del terreno no es igual en los dos extremos y el diafragma se comporta como flexible','Porque aumenta el coeficiente de importancia','Porque reduce la masa','Porque la NSR-10 la clasifica como irregularidad en altura'],a:0,
 e:`En plantas muy largas el sismo llega con desfase a los extremos, el diafragma deja de ser rígido y aparecen torsiones y esfuerzos altos en la losa. Se recomienda dividir con juntas.`,r:'Felizzola — Plantas alargadas'},

{t:'conf',k:'mc',src:'Felizzola · Diseño sismo resistente',fig:'reduccion',q:'La figura muestra una reducción brusca de la planta en los pisos superiores. ¿Qué efecto produce?',
 o:['Concentración de esfuerzos y de demanda de ductilidad en el piso donde cambia la planta','Disminuye el periodo de toda la estructura','Elimina la torsión','Reduce las derivas del último piso'],a:0,
 e:`El cambio brusco de rigidez y masa concentra la respuesta (efecto de látigo) en la zona de transición. Soluciones de la presentación: escalonar gradualmente la reducción o separar los volúmenes. La NSR-10 la penaliza como irregularidad geométrica 3A.`,r:'Felizzola — Reducciones bruscas · NSR-10 Tabla A.3-7'},

{t:'conf',k:'mc',src:'Felizzola · Diseño sismo resistente',fig:'esbeltez',q:'¿Qué problema principal tiene un edificio muy esbelto (altura grande frente al ancho)?',
 o:['Momento de vuelco alto: grandes cargas axiales en las columnas exteriores y efectos P-Δ','Exceso de rigidez lateral','Periodo demasiado corto','Golpeteo con el edificio vecino'],a:0,
 e:`Con H/B alto (se recomienda no pasar de ≈ 4), el momento de vuelco genera tracciones y compresiones muy grandes en las columnas y la cimentación exteriores, y aumentan los desplazamientos y los efectos de segundo orden.`,r:'Felizzola — Esbeltez del edificio'},

{t:'conf',k:'mc',src:'Felizzola · Diseño sismo resistente',fig:'golpeteo',q:'La figura muestra dos edificios colindantes con losas a distinta altura. ¿Qué fenómeno se debe evitar?',
 o:['Resonancia','Golpeteo entre estructuras','Licuación','Pandeo de las riostras'],a:1,
 e:`Si la separación es insuficiente, los edificios chocan al vibrar. Es más grave cuando las losas no coinciden, porque la losa de uno golpea las columnas del otro a media altura. La NSR-10 A.6.5 exige una separación sísmica mínima.`,r:'Felizzola — Estructuras colindantes · NSR-10 A.6.5'},

{t:'conf',k:'vf',src:'Felizzola · Diseño sismo resistente',q:'Cuando las losas de dos edificios colindantes están a distinta altura, el golpeteo es más peligroso porque la losa de uno impacta las columnas del otro a media altura.',a:true,
 e:`<b>VERDADERO.</b> Las columnas no están diseñadas para una fuerza concentrada a media altura; pueden fallar por cortante. Por eso la norma exige más separación cuando los entrepisos no coinciden.`,r:'NSR-10 A.6.5'},

{t:'conf',k:'mc',src:'Felizzola · Diseño sismo resistente',fig:'unidireccional',q:'La planta de la figura tiene pórticos solo en una dirección. ¿Cuál es el problema?',
 o:['Falta de rigidez y resistencia en la dirección ortogonal','Exceso de redundancia','Periodo muy corto en ambas direcciones','Ninguno si los pórticos son DES'],a:0,
 e:`El sismo actúa en cualquier dirección. Con <b>ejes resistentes unidireccionales</b>, en la otra dirección solo quedan columnas aisladas o losas, con muy poca rigidez. Hay que formar pórticos o muros en las dos direcciones.`,r:'Felizzola — Ejes resistentes unidireccionales'},

{t:'conf',k:'mc',src:'Felizzola · Diseño sismo resistente',fig:'pisoBlando',q:'El primer piso de la figura no tiene muros y los pisos superiores están llenos de muros de mampostería. ¿Cómo se llama esta irregularidad?',
 o:['Piso flexible (piso blando)','Columna corta','Irregularidad torsional','Retroceso en esquinas'],a:0,
 e:`Discontinuidad de rigidez en elevación: el primer piso es mucho más flexible que los de arriba y concentra toda la deformación. En la NSR-10 es la irregularidad 1aA/1bA (piso flexible).`,r:'Felizzola — Discontinuidades de rigidez · NSR-10 Tabla A.3-7'},

{t:'conf',k:'mc',src:'Nueva',fig:'columnaCorta',q:'En la figura un muro de relleno a media altura restringe la columna. ¿Qué problema se genera?',
 o:['Columna corta: rigidez alta, atrae mucho cortante y falla frágil','Columna esbelta: pandeo','Aumento de la ductilidad','Piso débil extremo'],a:0,
 e:`La rigidez lateral de una columna es proporcional a 1/h³. Si el muro reduce la altura libre a la mitad, la rigidez se multiplica por 8 y la columna atrae un cortante muy grande que la hace fallar por <b>cortante</b> (frágil), con grietas en X.`,r:'Configuración estructural — columna corta'},

{t:'conf',k:'abierta',src:'Nueva',q:'¿Qué es la columna corta y por qué es peligrosa?',
 e:`Columna cuya altura libre se reduce por muros de relleno parciales, vigas a media altura o desniveles. Como k = 12·E·I/h³, al reducir h la rigidez crece con el cubo y la columna absorbe una fracción grande del cortante de piso. Su falla es por <b>cortante</b>, frágil y súbita, antes de desarrollar flexión. Se evita separando los muros de la columna o diseñándola para ese cortante.`,efig:'columnaCorta',r:'Configuración estructural'},

{t:'conf',k:'mc',src:'Felizzola · Diseño sismo resistente',fig:'torsionAsim',q:'En la planta de la figura los muros rígidos están en un solo costado. ¿Qué efecto produce?',
 o:['Torsión en planta, por la excentricidad entre el centro de masa y el centro de rigidez','Piso débil','Golpeteo','Reducción del periodo sin otros efectos'],a:0,
 e:`El centro de rigidez se desplaza hacia los muros mientras el centro de masa queda en el centro: la fuerza sísmica (aplicada en el CM) genera un momento torsor e·V. Los elementos rigidizantes deben distribuirse en forma <b>simétrica</b> y preferiblemente en la periferia.`,r:'Felizzola — Distribución de elementos rigidizantes · NSR-10 Tabla A.3-6 (1aP)'},

{t:'conf',k:'match',src:'NSR-10 Tabla A.3-6',q:'Relacione cada irregularidad en planta con su coeficiente φp.',
 o:[['1aP Irregularidad torsional','0.9'],['1bP Irregularidad torsional extrema','0.8'],['2P Retrocesos excesivos en las esquinas','0.9'],['3P Discontinuidades en el diafragma','0.9'],['4P Desplazamiento de los planos de acción','0.8'],['5P Sistemas no paralelos','0.9']],
 e:`Las irregularidades "extremas" y el desplazamiento de planos de acción, que rompe la trayectoria de las fuerzas, tienen la mayor penalización (0.8).`,r:'NSR-10 Tabla A.3-6'},

{t:'conf',k:'match',src:'NSR-10 Tabla A.3-7',q:'Relacione cada irregularidad en altura con su coeficiente φa.',
 o:[['1aA Piso flexible','0.9'],['1bA Piso flexible extremo','0.8'],['2A Distribución de masa','0.9'],['3A Geométrica','0.9'],['4A Desplazamiento dentro del plano de acción','0.8'],['5aA Piso débil','0.9'],['5bA Piso débil extremo','0.8']],
 e:`Mismo patrón que en planta: las versiones extremas y el desplazamiento dentro del plano de acción valen 0.8.`,r:'NSR-10 Tabla A.3-7'},

{t:'conf',k:'mc',src:'NSR-10 Tabla A.3-6',q:'Existe irregularidad torsional (1aP) cuando la deriva máxima en un extremo de la estructura es mayor que:',
 o:['1.0 vez el promedio de las derivas de los dos extremos','1.2 veces el promedio de las derivas de los dos extremos','1.4 veces el promedio de las derivas de los dos extremos','2.0 veces la deriva del centro de masa'],a:1,efig:'torsionPlanta',
 e:`<span class="eq">Δ<sub>1</sub> &gt; 1.2 · (Δ<sub>1</sub> + Δ<sub>2</sub>)/2  →  1aP     Δ<sub>1</sub> &gt; 1.4 · (Δ<sub>1</sub> + Δ<sub>2</sub>)/2  →  1bP (extrema)</span><p class="sym">Δ<sub>1</sub>, Δ<sub>2</sub>: derivas en los dos extremos opuestos de la planta, en la dirección analizada, incluyendo la torsión accidental.</p>`,r:'NSR-10 Tabla A.3-6'},

{t:'conf',k:'mc',src:'NSR-10 Tabla A.3-6',q:'Hay retrocesos excesivos en las esquinas (2P) cuando:',
 o:['A > 0.15B y C > 0.15D','A > 0.5B','La planta no es rectangular','Hay una abertura mayor del 50 %'],a:0,efig:'retrocesos',
 e:`A y C son las proyecciones de la estructura más allá de la esquina entrante; B y D las dimensiones totales en cada dirección. Deben cumplirse <b>ambas</b> condiciones.`,r:'NSR-10 Tabla A.3-6'},

{t:'conf',k:'mc',src:'NSR-10 Tabla A.3-6',q:'Hay discontinuidad en el diafragma (3P) cuando:',
 o:['Hay aberturas mayores del 50 % del área bruta del diafragma o cambios de rigidez efectiva mayores del 50 % entre pisos','El diafragma es de concreto','La losa es aligerada','Hay una escalera'],a:0,efig:'diafragma',
 e:`Grandes vacíos (patios, dobles alturas) impiden que el diafragma reparta las fuerzas como cuerpo rígido.`,r:'NSR-10 Tabla A.3-6'},

{t:'conf',k:'mc',src:'NSR-10 Tabla A.3-7',q:'Existe piso flexible (1aA) cuando la rigidez lateral de un piso es:',
 o:['Menor del 70 % de la del piso superior o menor del 80 % del promedio de los tres pisos superiores','Menor del 90 % de la del piso inferior','Mayor que la del piso superior','Menor del 50 % de la total'],a:0,
 e:`Piso flexible extremo (1bA): menor del 60 % del superior o menor del 70 % del promedio de los tres superiores.`,r:'NSR-10 Tabla A.3-7'},

{t:'conf',k:'mc',src:'NSR-10 Tabla A.3-7',q:'Existe piso débil (5aA) cuando la resistencia del piso es:',
 o:['Menor del 80 % de la del piso superior','Menor del 65 % de la del piso superior','Menor del 70 % de la rigidez del superior','Mayor que la del piso inferior'],a:0,
 e:`Piso débil extremo (5bA): menor del <b>65 %</b>. La resistencia del piso es la suma de las resistencias al cortante de los elementos que comparten el cortante del piso.`,r:'NSR-10 Tabla A.3-7'},

{t:'conf',k:'mc',src:'NSR-10 Tabla A.3-7',q:'Hay irregularidad en la distribución de masa (2A) cuando la masa de un piso es mayor que:',
 o:['1.1 veces la de un piso contiguo','1.5 veces la de un piso contiguo (excepto una cubierta más liviana)','2.0 veces la del piso superior','La del piso de cubierta'],a:1,
 e:`<b>1.5 veces</b> la masa de un piso contiguo. No aplica cuando el piso más liviano es la cubierta.`,r:'NSR-10 Tabla A.3-7'},

{t:'conf',k:'mc',src:'NSR-10 Tabla A.3-7',q:'Hay irregularidad geométrica (3A) cuando la dimensión horizontal del sistema de resistencia sísmica en un piso es mayor que:',
 o:['1.1 veces la del piso adyacente','1.3 veces la del piso adyacente','2 veces la del primer piso','La dimensión vertical'],a:1,
 e:`<b>1.3 veces</b> la del piso adyacente (excepto altillos de un solo piso).`,r:'NSR-10 Tabla A.3-7'},

{t:'conf',k:'vf',src:'NSR-10 Tabla A.3-7',q:'El piso flexible se refiere a la rigidez y el piso débil se refiere a la resistencia.',a:true,
 e:`<b>VERDADERO.</b> Rigidez: fuerza por unidad de desplazamiento (kN/m). Resistencia: fuerza máxima que soporta el piso (kN). Son conceptos distintos y la norma los penaliza por separado.`,r:'NSR-10 Tabla A.3-7'},

{t:'conf',k:'mc',src:'NSR-10 A.3.6.7',q:'La excentricidad accidental que exige la NSR-10 para considerar la torsión accidental es:',
 o:['1 % de la dimensión de la planta','5 % de la dimensión de la planta perpendicular a la dirección del sismo','10 % de la altura','La distancia entre CM y CR'],a:1,
 e:`Se desplaza el centro de masa ±<b>0.05·L</b>, con L la dimensión de la planta perpendicular a la dirección del sismo, para cubrir incertidumbres en la distribución de masas y rigideces.`,r:'NSR-10 A.3.6.7'},

{t:'conf',k:'abierta',src:'Felizzola · Diseño sismo resistente',q:'¿Qué es la estructuración y cuál es su reto según la presentación?',
 e:`Es la etapa en la que se define la configuración del sistema estructural <b>integrando la labor de arquitectos e ingenieros</b> estructurales, planteando las necesidades mínimas de <b>rigidez, resistencia y regularidad</b> (o asumiendo conscientemente sus consecuencias). El reto: conjugar las necesidades arquitectónicas y estructurales para lograr un proyecto <b>funcional, seguro y estéticamente atractivo</b>.`,r:'Felizzola — Estructuración'},

{t:'conf',k:'vf',src:'Felizzola · Diseño sismo resistente',q:'Los elementos no estructurales deben aislarse de la estructura para que no interactúen con ella, o integrarse al sistema estructural y diseñarse en conformidad.',a:true,
 e:`<b>VERDADERO.</b> Un muro de relleno pegado a la estructura sin diseñarse cambia la rigidez (columna corta, piso blando, torsión). Hay que dilatarlo o tratarlo como parte del sistema.`,r:'Felizzola — Recomendaciones'},

{t:'conf',k:'multi',src:'Felizzola · Diseño sismo resistente',q:'¿Cuáles son aspectos que afectan el comportamiento sísmico de edificios según la presentación? (Seleccione todos.)',
 o:['Distribución indeseable de la masa','Alas alargadas y plantas alargadas','Color de la fachada','Reducciones bruscas de la planta en pisos superiores','Esbeltez del edificio','Estructuras colindantes','Ejes resistentes unidireccionales','Discontinuidades de rigidez en elevación'],a:[0,1,3,4,5,6,7],
 e:`Todas, excepto el color de la fachada, aparecen en las diapositivas "Aspectos que afectan el comportamiento sísmico de edificios", junto con la distribución en planta y la distribución de elementos rigidizantes.`,r:'Felizzola — Aspectos que afectan el comportamiento sísmico'},

/* ===================== ANÁLISIS ===================== */
{t:'anal',k:'mc',src:'NSR-10 Tabla A.4.2-1',q:'Para pórticos resistentes a momentos de concreto reforzado, los parámetros de Ta = Ct·h^α son:',
 o:['Ct = 0.047, α = 0.9','Ct = 0.072, α = 0.8','Ct = 0.049, α = 0.75','Ct = 0.1, α = 1.0'],a:0,
 e:`<span class="eq">T<sub>a</sub> = C<sub>t</sub>·h<sup>α</sup> = 0.047·h<sup>0.9</sup></span><p class="sym">h: altura del edificio desde la base hasta la cubierta (m). Acero resistente a momentos: 0.072 y 0.8. Otros sistemas: 0.049 y 0.75.</p>`,r:'NSR-10 A.4.2.2 · Tabla A.4.2-1'},

{t:'anal',k:'mc',src:'NSR-10 Tabla A.4.2-1',q:'Para pórticos resistentes a momentos de acero estructural, los parámetros de Ta = Ct·h^α son:',
 o:['Ct = 0.047, α = 0.9','Ct = 0.072, α = 0.8','Ct = 0.049, α = 0.75','Ct = 0.073, α = 0.75'],a:1,
 e:`C<sub>t</sub> = 0.072 y α = 0.8. El acero es más flexible que el concreto para la misma altura, por eso C<sub>t</sub> es mayor.`,r:'NSR-10 Tabla A.4.2-1'},

{t:'anal',k:'vf',src:'NSR-10 A.4.2.2',q:'Para edificaciones de pórticos de 12 pisos o menos con altura de piso no mayor de 3 m, se permite Ta = 0.1·N, con N el número de pisos.',a:true,
 e:`<b>VERDADERO.</b> Es la Ecuación A.4.2-3, alternativa para pórticos resistentes a momentos de concreto o acero. Es la regla práctica T ≈ 0.1·N.`,r:'NSR-10 A.4.2.2'},

{t:'anal',k:'mc',src:'NSR-10 A.4.2.1',q:'El periodo fundamental T usado en la FHE, calculado con un modelo, no puede exceder:',
 o:['2·Tc','Cu·Ta','TL','1.0 s'],a:1,
 e:`<span class="eq">T ≤ C<sub>u</sub>·T<sub>a</sub>     C<sub>u</sub> = 1.75 − 1.2·Av·Fv ≥ 1.2</span><p>Evita que un modelo demasiado flexible conduzca a fuerzas de diseño muy bajas.</p>`,r:'NSR-10 A.4.2.1'},

{t:'anal',k:'mc',src:'NSR-10 A.4.2.1',q:'El coeficiente Cu que limita el periodo de cálculo vale:',
 o:['Cu = 1.75 − 1.2·Av·Fv, pero no menor de 1.2','Cu = 1.2 siempre','Cu = 2.5·Aa·Fa','Cu = 0.1·N'],a:0,
 e:`Av: velocidad pico efectiva · Fv: coeficiente de sitio de periodos intermedios. Para amenaza alta y suelos blandos (Av·Fv grande) C<sub>u</sub> se acerca al mínimo 1.2.`,r:'NSR-10 A.4.2.1'},

{t:'anal',k:'mc',src:'NSR-10 A.4.3.2',q:'¿Cuánto vale el exponente k de la distribución de fuerzas en altura para T = 0.4 s?',
 o:['0.75','1.0','1.5','2.0'],a:1,
 e:`k = 1.0 para T ≤ 0.5 s; k = 0.75 + 0.5·T para 0.5 &lt; T ≤ 2.5 s; k = 2.0 para T &gt; 2.5 s. Con T = 0.4 s → <b>k = 1.0</b>.`,r:'NSR-10 A.4.3.2'},

{t:'anal',k:'mc',src:'NSR-10 A.4.3.2',q:'¿Cuánto vale k para un edificio con T = 3.0 s?',
 o:['1.0','1.5','2.0','2.25'],a:2,
 e:`Para T &gt; 2.5 s, k = <b>2.0</b>: la distribución de fuerzas es parabólica, con más fuerza en los pisos altos por el aporte de los modos superiores.`,r:'NSR-10 A.4.3.2'},

{t:'anal',k:'mc',src:'NSR-10 A.4.3.2',q:'Con k = 1, masas iguales y alturas de entrepiso iguales, la distribución de las fuerzas Fx en altura es:',
 o:['Uniforme','Triangular invertida (crece linealmente con la altura)','Parabólica','Concentrada en la base'],a:1,efig:'fheK',
 e:`Con k = 1, C<sub>vx</sub> = m<sub>x</sub>·h<sub>x</sub> / Σ m<sub>i</sub>·h<sub>i</sub>: si las masas son iguales, F<sub>x</sub> es proporcional a h<sub>x</sub>. Representa la forma del primer modo, casi lineal.`,r:'NSR-10 A.4.3.2'},

{t:'anal',k:'abierta',src:'Felizzola · Obtención de las fuerzas sísmicas',q:'Explique cómo se obtienen y distribuyen en altura las fuerzas sísmicas en el método de la fuerza horizontal equivalente.',
 e:`<span class="eq">V<sub>s</sub> = S<sub>a</sub>·g·M      F<sub>x</sub> = C<sub>vx</sub>·V<sub>s</sub>      C<sub>vx</sub> = m<sub>x</sub>·h<sub>x</sub><sup>k</sup> / Σ m<sub>i</sub>·h<sub>i</sub><sup>k</sup></span>
 <ul><li><b>V<sub>s</sub></b>: cortante sísmico en la base (kN) · <b>S<sub>a</sub></b>: ordenada espectral en el periodo T (fracción de g) · <b>g</b>: 9.81 m/s² · <b>M</b>: masa total (t). Equivale a V<sub>s</sub> = S<sub>a</sub>·W con W el peso total.</li><li><b>m<sub>x</sub></b>, <b>h<sub>x</sub></b>: masa y altura sobre la base del piso x · <b>k</b>: exponente según T.</li><li>Cada F<sub>x</sub> se aplica en el centro de masa del piso, desplazado ±5 % por torsión accidental.</li></ul>`,efig:'fheK',r:'NSR-10 A.4.3'},

{t:'anal',k:'order',src:'NSR-10 Capítulo A.4',q:'Ordene los pasos del método de la fuerza horizontal equivalente.',
 o:['Calcular Ta = Ct·h^α y verificar T ≤ Cu·Ta','Leer Sa(T) en el espectro de diseño','Calcular el cortante basal Vs = Sa·g·M','Calcular k y los coeficientes Cvx de cada piso','Distribuir Fx = Cvx·Vs en el centro de masa de cada piso','Analizar la estructura y verificar las derivas'],
 e:`Después se dividen las fuerzas por R para diseñar los elementos (E = F<sub>s</sub>/R), mientras las derivas se revisan con F<sub>s</sub>.`,r:'NSR-10 A.4'},

{t:'anal',k:'vf',src:'NSR-10 A.6.2',q:'En la NSR-10, las derivas se calculan con los desplazamientos producidos por las fuerzas sísmicas Fs, sin dividir por R.',a:true,
 e:`<b>VERDADERO.</b> R reduce fuerzas para diseñar resistencia, pero el desplazamiento real de la estructura dúctil es parecido al elástico; por eso las derivas se calculan con F<sub>s</sub> completas.`,r:'NSR-10 A.6.2'},

{t:'anal',k:'mc',src:'NSR-10 Tabla A.6.4-1',q:'Deriva máxima permitida para estructuras de concreto reforzado:',
 o:['0.5 % de hpi','1.0 % de hpi','1.5 % de hpi','2.0 % de hpi'],a:1,efig:'deriva',
 e:`<b>1.0 %</b> de la altura del entrepiso, igual para estructuras metálicas, de madera y de mampostería que cumple A.6.4.2.2. Para mampostería que cumple A.6.4.2.3: 0.5 %.`,r:'NSR-10 Tabla A.6.4-1'},

{t:'anal',k:'mc',src:'NSR-10 Tabla A.6.4-1',q:'Deriva máxima para edificaciones de mampostería que cumplen A.6.4.2.3:',
 o:['0.5 % de hpi','1.0 % de hpi','0.25 % de hpi','2.0 % de hpi'],a:0,
 e:`<b>0.5 %</b>: la mampostería es frágil y se agrieta con deformaciones pequeñas.`,r:'NSR-10 Tabla A.6.4-1'},

{t:'anal',k:'multi',src:'Felizzola · Derivas',q:'Según la presentación, la deriva está asociada con: (Seleccione todas.)',
 o:['Deformación inelástica de los elementos estructurales y no estructurales','Estabilidad global de la estructura','Daño a los elementos que no hacen parte del sistema de resistencia sísmica y a los no estructurales','El periodo de retorno del sismo','El coeficiente de sitio Fa'],a:[0,1,2],
 e:`Son las tres asociaciones de la diapositiva "Derivas". El periodo de retorno y Fa son parámetros de amenaza, no de deformación.`,r:'Felizzola — Derivas · NSR-10 A.6'},

{t:'anal',k:'mc',src:'NSR-10 A.5.4.5',q:'En el análisis dinámico elástico de una estructura regular, el cortante dinámico total en la base no puede ser menor que:',
 o:['El 50 % del cortante de la FHE','El 80 % del cortante de la FHE','El 90 % del cortante de la FHE','El 100 % del cortante de la FHE'],a:1,
 e:`<b>80 %</b> para estructuras regulares y <b>90 %</b> para irregulares. Si resulta menor, se escalan todos los resultados del análisis dinámico.`,r:'NSR-10 A.5.4.5'},

{t:'anal',k:'mc',src:'NSR-10 A.3.4.2.1',q:'La FHE se permite para edificaciones irregulares que no tengan más de:',
 o:['3 niveles ni 9 m','6 niveles ni 18 m','10 niveles ni 30 m','20 niveles ni 60 m'],a:1,
 e:`Irregulares: <b>6 niveles y 18 m</b>. Regulares: 20 niveles y 60 m (con la excepción de suelos D, E, F con T &gt; 2T<sub>C</sub>).`,r:'NSR-10 A.3.4.2.1'},

{t:'anal',k:'vf',src:'NSR-10 A.3.4.2.1',q:'La FHE puede usarse en todas las edificaciones, regulares o irregulares, localizadas en zona de amenaza sísmica baja.',a:true,
 e:`<b>VERDADERO.</b> Es el caso (a) de A.3.4.2.1.`,r:'NSR-10 A.3.4.2.1'},

{t:'anal',k:'vf',src:'NSR-10 A.3.4.2.1',q:'La FHE puede usarse en edificaciones regulares de 20 niveles o menos y 60 m o menos, salvo en suelos D, E o F cuando el periodo es mayor que 2Tc.',a:true,
 e:`<b>VERDADERO.</b> En suelos blandos con periodos largos los modos superiores y la amplificación del suelo hacen poco confiable la distribución supuesta de la FHE.`,r:'NSR-10 A.3.4.2.1'},

{t:'anal',k:'vf',src:'NSR-10 A.4.2 · A.5',q:'El periodo obtenido con un modelo matemático en el análisis dinámico suele ser menor que el periodo aproximado Ta.',a:false,
 e:`<b>FALSO.</b> Suele ser <b>mayor</b>: el modelo no incluye la rigidez de muros divisorios y otros elementos, y Ta es una cota empírica deliberadamente corta. Por eso la norma limita T ≤ C<sub>u</sub>·T<sub>a</sub>.`,r:'NSR-10 A.4.2.1',nota:'Esta es la corrección aplicada a la hoja de repaso, que decía "menor".'},

{t:'anal',k:'mc',src:'Felizzola · Métodos de análisis',q:'Los métodos de análisis alternos que admite la NSR-10 deben:',
 o:['Ser más sencillos que la FHE','Tener en cuenta las características dinámicas de la edificación y el comportamiento inelástico de los materiales, y ser de aceptación general en la ingeniería','Usar solo el primer modo','Ignorar las derivas'],a:1,
 e:`Es el texto del literal (d) de la diapositiva "Métodos de análisis".`,r:'NSR-10 A.3.4.1'},

{t:'anal',k:'abierta',src:'Felizzola · Métodos de análisis',q:'¿En qué consiste el análisis dinámico inelástico?',
 e:`Análisis cronológico (paso a paso en el tiempo) con un modelo que representa el <b>comportamiento no lineal</b> de los elementos: rótulas plásticas, degradación de rigidez y ciclos de histéresis. Se excita con acelerogramas compatibles con el espectro de diseño y se integra la ecuación de movimiento con métodos como Newmark, actualizando la rigidez en cada paso. Da la demanda real de ductilidad y de deriva; es el más exigente de los cuatro métodos.`,r:'NSR-10 A.3.4.1 (c)'},

{t:'anal',k:'abierta',src:'Felizzola · Separación entre estructuras',q:'¿Por qué se exige una separación sísmica entre estructuras adyacentes?',
 e:`Para evitar el <b>golpeteo</b>: durante el sismo cada edificio se desplaza según su propia rigidez y periodo, y si están muy juntos chocan. La separación debe ser mayor que la suma de los desplazamientos esperados; la NSR-10 (A.6.5) da valores mínimos en función de la altura y exige más separación cuando los entrepisos de los dos edificios no coinciden.`,efig:'golpeteo',r:'NSR-10 A.6.5'},

{t:'anal',k:'mc',src:'NSR-10 A.3 · A.6',q:'Para diseñar los elementos estructurales, las fuerzas sísmicas reducidas se obtienen como:',
 o:['E = Fs·R','E = Fs/R','E = Fs·I','E = Fs/Ωo'],a:1,
 e:`<b>E = F<sub>s</sub>/R</b>. F<sub>s</sub>: fuerzas sísmicas obtenidas con el espectro elástico · R: coeficiente de capacidad de disipación de energía. Las combinaciones de carga usan E.`,r:'NSR-10 A.3.1 · B.2'},

{t:'anal',k:'mc',src:'NSR-10 A.4.3',q:'Un edificio pesa W = 12 000 kN y Sa = 0.375 g. El cortante sísmico en la base es:',
 o:['450 kN','4500 kN','32 000 kN','44 145 kN'],a:1,
 e:`<span class="eq">V<sub>s</sub> = S<sub>a</sub>·g·M = S<sub>a</sub>·W = 0.375 × 12 000 kN = 4500 kN</span><p>Como S<sub>a</sub> está en fracción de g, se multiplica directamente por el peso.</p>`,r:'NSR-10 A.4.3.1'},
