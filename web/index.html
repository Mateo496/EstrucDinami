></ul>","efig":"espectroNSR"},{"id":"H103","t":"amen","src":"Repaso","origen":"hist","r":"NSR-10 A.2.4, Tablas A.2.4-3 y A.2.4-4","k":"order","q":"Ordene de mayor a menor los valores de Sa en la meseta de periodos cortos, como se plantea en el curso.","e":"Para la <b>meseta de periodos cortos</b>, que es como se plantea la pregunta en el curso:\n <ol><li>Roca</li><li>Suelo denso</li><li>Arcilla blanda</li><li>Suelos muy blandos</li></ol>\n <em>Advertencia técnica: el orden depende del periodo. En la rama de periodos intermedios y largos los suelos blandos amplifican más (Fv crece hasta 3.5), de modo que allí el orden se invierte respecto de la roca.</em>","o":["Roca","Suelo denso","Arcilla blanda","Suelos muy blandos"]},{"id":"H104","t":"amen","src":"2022-1","origen":"hist","r":"NSR-10 A.3.3 · A.4.3 · A.5.4","k":"abierta","q":"¿Para qué se emplea el espectro elástico de aceleraciones reducido?","e":"Para obtener las <b>fuerzas sísmicas de diseño</b>. El espectro elástico se divide por el coeficiente de capacidad de disipación de energía R, con lo cual se reconoce que la estructura incursionará en el rango inelástico y disipará energía por ductilidad:\n <span class=\"eq\">Sa_diseño = Sa / R</span>\n Es el espectro con el que se corren el método de la fuerza horizontal equivalente y el análisis dinámico elástico."},{"id":"H105","t":"amen","src":"2021-M · 2022-1 · Repaso","origen":"hist","r":"Teoría general — espectros de respuesta (Newmark-Hall)","k":"abierta","q":"¿Qué es la representación tripartita?","e":"Representación gráfica que reúne los <b>tres espectros —aceleración, velocidad y desplazamiento— en una sola curva</b>, sobre papel logarítmico: el periodo en el eje horizontal, la velocidad espectral en el vertical, y Sa y Sd leídos sobre dos familias de ejes inclinados a ±45°. Es posible porque, con la aproximación de pseudo-espectros, Sa = ω·Sv y Sd = Sv/ω.","efig":"tripartita"},{"id":"H106","t":"amen","src":"2021-M","origen":"hist","r":"NSR-10 A.12 (edificaciones indispensables) · A.2.2 (umbral de daño)","k":"vf","q":"El espectro para umbral de daño se aplica a todas las estructuras para verificar derivas.","a":false,"e":"<b>FALSO.</b> Los movimientos sísmicos del umbral de daño y la verificación de derivas para ese nivel son un requisito <b>exclusivo de las edificaciones indispensables del Grupo de uso IV</b>. Las demás edificaciones verifican deriva con el sismo de diseño."},{"id":"H107","t":"amen","src":"Repaso","origen":"hist","r":"NSR-10 A.3.1.1 · Título C (Capítulo C.21)","k":"abierta","q":"¿En qué zona sísmica una estructura requiere más armadura?","e":"Es una pregunta con la respuesta invertida en la hoja de repaso del curso. Técnicamente, a mayor amenaza sísmica mayores fuerzas y requisitos de detallado, de modo que la <b>zona de amenaza sísmica alta</b> exige más refuerzo y despiece más estricto (DES). La hoja de repaso responde \"zona baja\", razonando que allí se permite DMI y por tanto se diseña con R menor y fuerzas elásticas mayores.","nota":"Pregunta ambigua. Si aparece, conviene responder <b>zona de amenaza sísmica alta</b> y justificar en una línea: mayor Aa, mayores fuerzas y requisitos DES de detallado del refuerzo."},{"id":"H108","t":"sist","src":"2021-L · 2021-M · 2022-1 · 2024-3 · Repaso","origen":"hist","r":"NSR-10 A.3.2","k":"abierta","q":"Nombre tres sistemas estructurales según la NSR-10.","e":"La norma reconoce <b>cuatro</b>: sistema de <b>muros de carga</b>, sistema <b>combinado</b>, sistema de <b>pórtico</b> resistente a momentos y sistema <b>dual</b>."},{"id":"H109","t":"sist","src":"2022-1 · Repaso","origen":"hist","r":"NSR-10 A.3.2.1.1","k":"abierta","q":"¿Qué es un sistema de muros de carga?","e":"Sistema estructural que <b>no dispone de un pórtico espacial resistente a cargas verticales completo</b>. Las cargas verticales son resistidas principalmente por <b>muros de carga</b>, y las fuerzas horizontales por muros estructurales o pórticos con diagonales."},{"id":"H110","t":"sist","src":"2021-M · Repaso","origen":"hist","r":"NSR-10 A.3.2.1.2","k":"abierta","q":"Explique el sistema estructural de resistencia sísmica combinado.","e":"Sistema en el cual dos condiciones son posibles:\n <ul><li>Las cargas <b>verticales</b> las resiste un pórtico espacial completo <b>no resistente a momentos</b>, y las <b>horizontales</b> muros estructurales o pórticos con diagonales.</li>\n <li>Las cargas verticales y horizontales las resiste un pórtico espacial <b>resistente a momentos</b> combinado con muros estructurales o pórticos con diagonales, <b>sin</b> cumplir los requisitos de un sistema dual.</li></ul>"},{"id":"H111","t":"sist","src":"Repaso","origen":"hist","r":"NSR-10 A.3.2.1.3","k":"abierta","q":"¿Qué es un sistema de pórtico?","e":"Sistema compuesto por un <b>pórtico espacial resistente a momentos, esencialmente completo y sin diagonales</b>, que resiste todas las cargas verticales y las fuerzas horizontales."},{"id":"H112","t":"sist","src":"2022-1 · Repaso","origen":"hist","r":"NSR-10 A.3.2.1.4","k":"abierta","q":"Explique en qué consiste el sistema dual.","e":"Sistema en el que un <b>pórtico espacial resistente a momentos, sin diagonales</b>, actúa combinado con muros estructurales o pórticos con diagonales, cumpliendo simultáneamente:\n <ul><li>El pórtico resiste como mínimo el <b>25 %</b> del cortante sísmico en la base.</li>\n <li>Los muros o pórticos con diagonales resisten el resto (mínimo el 75 %), en proporción a sus rigideces.</li>\n <li>Ambos sistemas se diseñan para resistir la totalidad del cortante que les corresponde según su rigidez, considerando la interacción.</li></ul>"},{"id":"H113","t":"sist","src":"Moodle 2020-11","origen":"hist","r":"NSR-10 A.3.2 (sistemas) vs. A.3.4 (métodos)","k":"mc","q":"Es un sistema estructural NO aceptado por la NSR-10:","o":["dual","pórticos","combinado","sistema de la fuerza horizontal equivalente"],"a":3,"e":"<b>d) Sistema de la fuerza horizontal equivalente.</b> La FHE es un <b>método de análisis</b>, no un sistema estructural."},{"id":"H114","t":"sist","src":"Moodle 2020-07","origen":"hist","r":"NSR-10 A.3.2 vs. A.3.4","k":"mc","q":"NO es un sistema estructural aceptado por la NSR-10:","o":["sistema de análisis dinámico elástico","sistema de pórticos","sistema dual","N.A.","combinado"],"a":0,"e":"<b>a) Sistema de análisis dinámico elástico.</b> Igual que la anterior: es un método de análisis, no un sistema estructural."},{"id":"H115","t":"sist","src":"Repaso","origen":"hist","r":"NSR-10 A.3.2","k":"abierta","q":"¿Cómo se puede dar rigidez lateral a los edificios?","e":"<ul><li><b>Pórticos rígidos</b> resistentes a momentos.</li>\n <li><b>Contravientos</b> o diagonales (arriostramientos concéntricos o excéntricos).</li>\n <li><b>Muros estructurales</b> de concreto reforzado.</li>\n <li><b>Muros de mampostería</b> estructural.</li></ul>"},{"id":"H116","t":"sist","src":"Repaso","origen":"hist","r":"NSR-10 A.1.3.3 · A.3.1","k":"abierta","q":"Defina la capacidad de disipación de energía.","e":"Capacidad que tiene un sistema estructural de <b>trabajar dentro del rango inelástico de respuesta sin perder su resistencia</b>. Se cuantifica con el coeficiente R y se garantiza mediante los requisitos de detallado de cada material."},{"id":"H117","t":"sist","src":"Repaso","origen":"hist","r":"NSR-10 A.3.1.1","k":"abierta","q":"Enuncie los grados de capacidad de disipación de energía.","e":"<ul><li><b>DMI</b> — mínima.</li><li><b>DMO</b> — moderada.</li><li><b>DES</b> — especial.</li></ul>\n Y su relación con la amenaza sísmica:\n <ul><li><b>Zona baja:</b> se permiten DMI, DMO y DES.</li>\n <li><b>Zona intermedia:</b> DMO y DES.</li>\n <li><b>Zona alta:</b> solo DES.</li></ul>"},{"id":"H118","t":"sist","src":"2021-L · Moodle 2020-11","origen":"hist","r":"NSR-10 A.3.1.1","k":"mc","q":"Para un edificio localizado en zona sísmica baja, ¿para qué grados de disipación de energía puede el ingeniero diseñar la estructura?","o":["solo DMI","DMI y DMO","solo DES","DMI, DMO y DES"],"a":3,"e":"<b>d) DMI, DMO y DES.</b> En zona baja el mínimo exigido es DMI, pero siempre se puede diseñar con un grado superior."},{"id":"H119","t":"sist","src":"2022-1","origen":"hist","r":"NSR-10 A.3.1.1","k":"abierta","q":"Para un edificio localizado en zona sísmica media (intermedia), ¿con qué grados de disipación de energía puede diseñarse?","e":"<b>DMO y DES.</b> No se permite DMI."},{"id":"H120","t":"sist","src":"Moodle 2020-07","origen":"hist","r":"NSR-10 A.3.1.1","k":"mc","q":"Para un edificio localizado en zona sísmica alta, ¿para qué grados de disipación de energía puede diseñar el ingeniero?","o":["N.A.","DMI, DMO y DES","solo DMI","solo DES"],"a":3,"e":"<b>d) Solo DES.</b>"},{"id":"H121","t":"sist","src":"2021-M · Moodle 2020-07 · Repaso","origen":"hist","r":"NSR-10 A.3.3.3 · Tablas A.3-1 a A.3-4","k":"abierta","q":"¿Qué es Ro según la NSR-10?","e":"<b>Coeficiente de capacidad de disipación de energía básico</b>, definido para cada <b>sistema estructural</b> y cada grado de disipación (DMI, DMO, DES) en las Tablas A.3-1 a A.3-4. Es el punto de partida, antes de aplicar las penalizaciones por irregularidad."},{"id":"H122","t":"sist","src":"Moodle 2020-07","origen":"hist","r":"NSR-10 A.3.3.3","k":"mc","q":"Según la NSR-10, Ro es:","o":["N.A.","coeficiente de capacidad de disipación de energía básico definido para cada método de análisis","coeficiente definido en el rango elástico","coeficiente de capacidad de disipación de energía básico definido para cada sistema estructural","coeficiente básico definido para el espectro de aceleraciones"],"a":3,"e":"<b>d) Coeficiente de capacidad de disipación de energía básico definido para cada sistema estructural.</b>"},{"id":"H123","t":"sist","src":"2021-M · Moodle 2020-07 · Repaso","origen":"hist","r":"NSR-10 A.3.3.3","k":"abierta","q":"Según la NSR-10, ¿qué significa R?","e":"<b>Coeficiente de capacidad de disipación de energía para ser empleado en el diseño</b>. Es el valor con el que se reduce el espectro elástico y se obtiene ya afectado por las irregularidades de la edificación:\n <span class=\"eq\">R = φa · φp · φr · Ro</span>"},{"id":"H124","t":"sist","src":"Moodle 2020-11","origen":"hist","r":"NSR-10 A.3.3.3","k":"vf","q":"Según la NSR-10, R es el coeficiente de capacidad de disipación de energía BÁSICO para ser empleado en el diseño.","a":false,"e":"<b>FALSO.</b> El coeficiente <b>básico</b> es Ro. R es el coeficiente ya reducido por irregularidades: R = φa·φp·φr·Ro."},{"id":"H125","t":"sist","src":"Moodle 2020-07","origen":"hist","r":"NSR-10 A.3.3.3","k":"vf","q":"Según la NSR-10, R es el coeficiente de capacidad de disipación de energía para ser empleado en el diseño.","a":true,"e":"<b>VERDADERO.</b> Sin la palabra \"básico\", la afirmación es la definición correcta de R."},{"id":"H126","t":"sist","src":"2021-M · Repaso","origen":"hist","r":"NSR-10 Tablas A.3-1 a A.3-4","k":"abierta","q":"¿Cuál es el mayor Ro para sistemas estructurales?","e":"<b>Ro = 8.0</b>: sistema <b>dual</b> de muros de concreto con capacidad especial de disipación (DES) combinados con pórticos de concreto DES. Otros valores que conviene recordar:\n <ul><li>7.0: sistema de pórtico resistente a momentos de concreto DES.</li><li>5.0: pórtico de concreto DMO, o muros de carga de concreto DES.</li><li>2.5: pórtico de concreto DMI.</li><li>1.0: muros de carga de mampostería no reforzada (el menor valor).</li></ul>"},{"id":"H127","t":"sist","src":"Moodle 2020-07","origen":"hist","r":"NSR-10 Tablas A.3-1 a A.3-4","k":"vf","q":"El mayor valor de Ro es 6.0 según la NSR-10.","a":false,"e":"<b>FALSO.</b> El mayor valor de Ro es <b>8.0</b>."},{"id":"H128","t":"sist","src":"2021-M","origen":"hist","r":"NSR-10 Tablas A.3-1 a A.3-4","k":"vf","q":"El mayor valor de Ro para sistemas estructurales es 8.0.","a":true,"e":"<b>VERDADERO.</b>"},{"id":"H129","t":"sist","src":"2022-1","origen":"hist","r":"NSR-10 Tabla A.3-1","k":"vf","q":"El menor valor de Ro es 1.5 según la NSR-10.","a":false,"e":"<b>FALSO.</b> El menor valor de Ro es <b>1.0</b> (muros de carga en mampostería no reforzada, DMI)."},{"id":"H130","t":"sist","src":"2021-L","origen":"hist","r":"NSR-10 A.3.3.3","k":"vf","q":"El valor de Ro que mejor describe la respuesta sísmica es 5.0.","a":false,"e":"<b>FALSO.</b> No existe un valor de Ro que \"describa mejor\" la respuesta: Ro depende del sistema estructural, del material y del grado de disipación de energía adoptado."},{"id":"H131","t":"sist","src":"Repaso","origen":"hist","r":"NSR-10 — nomenclatura del Título A","k":"abierta","q":"¿Qué es Rc según la NSR-10?","e":"Coeficiente de capacidad de disipación de energía aplicable a la <b>zona de periodos cortos (T menores que Tc)</b>, obtenido en función de R. Reconoce que las estructuras muy rígidas no alcanzan a desarrollar toda la ductilidad supuesta, por lo que el valor de R debe reducirse en esa zona del espectro.","nota":"Símbolo poco frecuente. Si lo preguntan, basta con la idea: es el R corregido para periodos cortos, porque allí la estructura no alcanza a disipar por ductilidad."},{"id":"H132","t":"sist","src":"2021-L · 2021-M · 2022-1 · 2024-3 · Repaso","origen":"hist","r":"NSR-10 A.3.3.4 a A.3.3.8 · Tablas A.3-6 y A.3-7","k":"abierta","q":"¿Qué es φa, φp y φr según la NSR-10?","e":"Los tres <b>coeficientes de reducción</b> de la capacidad de disipación de energía:\n <ul><li><b>φa</b> — por irregularidades <b>en altura</b> de la edificación.</li>\n <li><b>φp</b> — por irregularidades <b>en planta</b>.</li>\n <li><b>φr</b> — por <b>ausencia de redundancia</b> en el sistema estructural de resistencia sísmica.</li></ul>\n <span class=\"eq\">R = φa · φp · φr · Ro</span>"},{"id":"H133","t":"sist","src":"2021-L · 2022-1 · 2024-3","origen":"hist","r":"NSR-10 A.3.3.8","k":"abierta","q":"Según la NSR-10, ¿qué significado tiene φr?","e":"<b>Coeficiente de reducción de la capacidad de disipación de energía causado por la ausencia de redundancia</b> en el sistema estructural de resistencia sísmica. Penaliza a las estructuras con pocas líneas resistentes, en las que la falla de un elemento compromete la estabilidad del conjunto. Vale 1.00 o 0.75."},{"id":"H134","t":"conf","src":"2021-L · 2021-M · 2022-1 · Repaso","origen":"hist","r":"NSR-10 A.3.3.5, Tabla A.3-7","k":"abierta","q":"Liste tres irregularidades en altura según la NSR-10.","e":"<ul><li><b>Piso flexible</b> — irregularidad en rigidez (y su versión extrema).</li>\n <li><b>Irregularidad en la distribución de las masas.</b></li>\n <li><b>Irregularidad geométrica.</b></li>\n <li><b>Desplazamiento dentro del plano de acción</b> de los elementos verticales.</li>\n <li><b>Piso débil</b> — discontinuidad en la resistencia (y su versión extrema).</li></ul>"},{"id":"H135","t":"conf","src":"2024-3 · Repaso","origen":"hist","r":"NSR-10 A.3.3.4, Tabla A.3-6","k":"abierta","q":"Liste tres irregularidades en planta según la NSR-10.","e":"<ul><li><b>Irregularidad torsional</b> (y torsional extrema).</li>\n <li><b>Retrocesos excesivos en las esquinas.</b></li>\n <li><b>Discontinuidades en el diafragma.</b></li>\n <li><b>Desplazamiento de los planos de acción</b> de elementos verticales.</li>\n <li><b>Sistemas no paralelos.</b></li></ul>"},{"id":"H136","t":"conf","src":"Moodle 2020-07","origen":"hist","r":"NSR-10 Tabla A.3-6","k":"mc","q":"Es una irregularidad en planta:","o":["distribución de masas","piso flexible","piso débil","geométrica","irregularidad del diafragma"],"a":4,"e":"<b>e) Irregularidad del diafragma.</b> Las otras cuatro son irregularidades en altura."},{"id":"H137","t":"conf","src":"2022-1","origen":"hist","r":"NSR-10 Tablas A.3-6 y A.3-7","k":"mc","q":"NO es una irregularidad en planta:","o":["retrocesos en las esquinas","irregularidad torsional","geométrica","sistemas no paralelos"],"a":2,"e":"<b>c) Geométrica.</b> La irregularidad geométrica está clasificada en <b>altura</b>."},{"id":"H138","t":"conf","src":"Moodle 2020-07","origen":"hist","r":"NSR-10 Tabla A.3-7","k":"vf","q":"Piso débil extremo es una irregularidad en planta según la NSR-10.","a":false,"e":"<b>FALSO.</b> Piso débil —y su versión extrema— es una irregularidad <b>en altura</b>."},{"id":"H139","t":"sist","src":"Repaso","origen":"hist","r":"NSR-10 A.3.3.9 · Tablas A.3-1 a A.3-4 (columna Ωo)","k":"abierta","q":"Según la NSR-10, ¿qué es la sobrerresistencia?","e":"Coeficiente (Ω<sub>o</sub>) que <b>amplifica la fuerza sísmica de diseño</b> para el dimensionamiento de los <b>elementos frágiles</b> —aquellos que no deben fallar antes que los dúctiles—, cuando así lo exijan el material estructural y el grado de capacidad de disipación de energía empleado. Es la traducción del diseño por capacidad."},{"id":"H140","t":"conf","src":"2021-M · Repaso","origen":"hist","r":"NSR-10 A.3.3.4 y A.3.3.5 · configuración estructural","k":"abierta","q":"Nombre tres aspectos que afecten el comportamiento sísmico de una edificación.","e":"<ul><li><b>Esbeltez</b> del edificio (relación altura/base).</li>\n <li><b>Distribución indeseable de la masa</b> en planta y en altura.</li>\n <li><b>Plantas alargadas</b> o irregulares y retrocesos en esquinas.</li>\n <li><b>Reducciones bruscas</b> de la planta en pisos superiores.</li>\n <li><b>Discontinuidades de rigidez en elevación</b> (piso flexible, columna corta).</li>\n <li><b>Ejes resistentes unidireccionales</b> y mala distribución de elementos rigidizantes.</li>\n <li><b>Estructuras colindantes</b> (golpeteo entre edificios).</li></ul>"},{"id":"H141","t":"anal","src":"Repaso","origen":"hist","r":"NSR-10 A.3.4","k":"abierta","q":"Enuncie los métodos de análisis de estructuras según la NSR-10.","e":"<ul><li>Método de la <b>fuerza horizontal equivalente</b> (FHE).</li>\n <li>Método del <b>análisis dinámico elástico</b>.</li>\n <li>Método del <b>análisis dinámico inelástico</b>.</li>\n <li><b>Métodos de análisis alternos</b>.</li></ul>"},{"id":"H142","t":"anal","src":"Repaso · 2021-M","origen":"hist","r":"NSR-10 A.3.4.2.1 · Capítulo A.4","k":"abierta","q":"¿En qué consiste el método de la fuerza horizontal equivalente y cuándo se puede usar?","e":"Método de análisis <b>estático lineal</b> que reemplaza la acción sísmica por <b>fuerzas laterales estáticas equivalentes</b> aplicadas en el centro de masa de cada piso. Supone que la respuesta la controla el <b>primer modo</b> de vibración, por eso usa un periodo aproximado T<sub>a</sub> = C<sub>t</sub>·h<sup>α</sup> y una distribución de fuerzas en altura prefijada.\n <p><b>Se permite (NSR-10 A.3.4.2.1) en:</b></p>\n <ul><li>Todas las edificaciones, regulares o irregulares, en zona de amenaza sísmica <b>baja</b>.</li>\n <li>Todas las edificaciones del <b>Grupo de uso I</b> en zona de amenaza <b>intermedia</b>.</li>\n <li>Edificaciones <b>regulares</b> de <b>20 niveles o menos y 60 m o menos</b> de altura, en cualquier zona, excepto en perfiles de suelo D, E o F cuando el periodo es mayor que 2T<sub>C</sub>.</li>\n <li>Edificaciones <b>irregulares</b> de no más de <b>6 niveles ni 18 m</b> de altura.</li>\n <li>Estructuras flexibles apoyadas sobre estructuras más rígidas que cumplan A.3.2.4.3.</li></ul>"},{"id":"H143","t":"anal","src":"Repaso","origen":"hist","r":"NSR-10 A.3.4.2.2 · Capítulo A.5 (A.5.4.5)","k":"abierta","q":"¿En qué consiste el análisis dinámico elástico?","e":"Análisis <b>modal espectral</b> (o cronológico) en el que se calculan las propiedades dinámicas reales del modelo: matrices de masa [M] y rigidez [K], periodos y formas modales. Con el espectro de diseño se obtiene la respuesta máxima de cada modo y las respuestas se combinan (CQC o SRSS) incluyendo modos hasta acumular al menos el 90 % de la masa.\n <p>Es obligatorio en las edificaciones que no cumplen las condiciones de la FHE. El periodo que sale del modelo suele ser <b>mayor</b> que el T<sub>a</sub> empírico de la FHE (el modelo no incluye toda la rigidez real de la construcción), por eso la norma limita el periodo de cálculo a T ≤ C<sub>u</sub>·T<sub>a</sub> y exige ajustar el cortante dinámico si queda por debajo del 80 % (regulares) o 90 % (irregulares) del cortante de la FHE.</p>","nota":"La hoja de repaso decía que el periodo del análisis dinámico resulta \"menor\". Lo correcto es que suele resultar mayor; de ahí el límite T ≤ Cu·Ta."},{"id":"H144","t":"anal","src":"2021-L · 2021-M · 2024-3 · Repaso","origen":"hist","r":"NSR-10 A.3.4 · A.4 · A.5.4.5","k":"abierta","q":"¿Qué diferencia encontraría al realizar un análisis sísmico de un edificio por fuerza horizontal equivalente frente a uno dinámico elástico?","e":"<ul><li><b>FHE:</b> estático; sustituye el sismo por fuerzas laterales fijas; considera solo el modo fundamental; usa un periodo aproximado T<sub>a</sub> = C<sub>t</sub>·h<sup>α</sup> deliberadamente conservador (corto, por tanto S<sub>a</sub> alta); la distribución de fuerzas en altura es una forma supuesta (exponente k).</li>\n <li><b>Dinámico elástico:</b> usa las propiedades modales reales; incluye <b>todos los modos</b> necesarios hasta acumular el 90 % de la masa; captura torsión y modos superiores; suele dar un periodo mayor y fuerzas menores, con una distribución de cortantes más realista.</li></ul>\n <p>Por eso la norma exige que el cortante dinámico en la base no sea menor que el <b>80 %</b> del de la FHE en estructuras regulares, ni del <b>90 %</b> en irregulares; si lo es, se escalan los resultados.</p>"},{"id":"H145","t":"anal","src":"Repaso","origen":"hist","r":"NSR-10 A.4.3.1","k":"abierta","q":"¿Qué es el cortante sísmico en la base (cortante basal)?","e":"La <b>fuerza horizontal total</b> que el sismo induce en la base de la edificación, que luego se distribuye en altura como fuerzas Fx por piso.\n <span class=\"eq\">Vs = Sa · g · M     (Sa en fracción de g; M = masa total de la edificación)</span>"},{"id":"H146","t":"anal","src":"2021-L","origen":"hist","r":"NSR-10 A.4.3.1 (Vs = Sa·g·M)","k":"num","q":"En el espectro de respuesta que se muestra, ¿cuál es el cortante en la base para un edificio que pesa W = 500 kN con T = 0.4 s?","fig":"espectroParcial","e":"<p><b>Paso 1 — Entrar al espectro con el periodo.</b> Con T = 0.4 s se lee la aceleración espectral. En el gráfico del parcial la curva pasa por Sa ≈ 0.8–0.9 g en ese periodo.</p>\n <p><b>Paso 2 — Aplicar la segunda ley de Newton.</b> Como Sa viene expresada en fracción de la gravedad y W = m·g:</p>\n <span class=\"eq\">V = m · a = (W / g) · (Sa · g) = Sa · W</span>\n <p><b>Paso 3 — Reemplazar.</b> Con Sa = 0.9 g: V = 0.9 × 500 kN = <b>450 kN</b>. Con Sa = 0.8 g: V = 400 kN.</p>\n <p><em>Lo que califican es el procedimiento: leer Sa en el periodo dado y multiplicarlo por el peso. Indique siempre el valor que leyó en el gráfico.</em></p>","num":{"v":425,"min":395,"max":460,"u":"kN"}},{"id":"H147","t":"anal","src":"2024-3","origen":"hist","r":"NSR-10 A.4.3.1","k":"num","q":"Del espectro mostrado, calcule el cortante en la base asumiendo W = 150 kN y T = 0.4 s.","fig":"espectroParcial","e":"<p>Del espectro, para T = 0.4 s se lee <b>Sa ≈ 0.8 g</b>, es decir a = 0.8 × 9.81 ≈ 7.85 m/s².</p>\n <span class=\"eq\">V = m · a = (W / g) · (0.8 · g) = 0.8 · W</span>\n <span class=\"eq\">V = 0.8 × 150 kN = 120 kN</span>\n <p><b>V = 120 kN.</b></p>\n <p><em>Error frecuente: escribir V = 150 kN × 0.8 m/s² = 120 kN·m/s². Las unidades no cuadran. Sa está en fracción de g, no en m/s²; al multiplicarla por el peso el resultado queda directamente en kN.</em></p>","num":{"v":120,"min":112,"max":135,"u":"kN"}},{"id":"H148","t":"anal","src":"Moodle 2020-07","origen":"hist","r":"NSR-10 A.4.2, Tabla A.4.2-1","k":"abierta","q":"Para un edificio de 10 pisos, ¿de qué orden es de esperar que sea el periodo?","e":"Del orden de <b>1.0 s</b>. La regla práctica es T ≈ 0.1·N, con N el número de pisos, coherente con la expresión aproximada de la norma Ta = Ct·h<sup>α</sup>."},{"id":"H149","t":"anal","src":"Moodle 2020-11","origen":"hist","r":"NSR-10 A.4.2","k":"vf","q":"Para un edificio de 8 pisos, regular, no esbelto y con cargas normales, es de esperar que el periodo sea del orden de 0.4 segundos.","a":false,"e":"<b>FALSO.</b> Con la regla T ≈ 0.1·N el periodo esperado es del orden de <b>0.8 s</b>, no 0.4 s."},{"id":"H150","t":"anal","src":"Repaso","origen":"hist","r":"NSR-10 A.4.2 · teoría SDOF","k":"abierta","q":"¿Por qué las estructuras altas tienen mayor periodo?","e":"Porque al aumentar la altura crece la <b>masa</b> y disminuye la <b>rigidez lateral</b> del conjunto: T = 2π√(m/k) aumenta. Por eso los edificios altos son más sensibles a sismos de contenido frecuencial bajo (periodos largos) y a suelos blandos."},{"id":"H151","t":"anal","src":"Moodle 2020-11 · Repaso","origen":"hist","r":"NSR-10 A.5.4.2","k":"mc","q":"Para el análisis dinámico (edificios irregulares) se considerarán aquellos modos de vibración cuya suma de masas efectivas sea por lo menos el ___ % de la masa total:","o":["90","80 %","75 %","85 %"],"a":0,"e":"<b>a) 90 %.</b> La norma exige incluir modos suficientes para acumular al menos el 90 % de la masa participante en cada dirección de análisis."},{"id":"H152","t":"anal","src":"2021-L · 2021-M · 2022-1 · 2024-3 · Repaso","origen":"hist","r":"NSR-10 Capítulo A.6 (A.6.3 y Tabla A.6.4-1)","k":"abierta","q":"Explique el concepto de deriva.","e":"<b>Desplazamiento horizontal relativo entre dos puntos situados en la misma línea vertical, en dos pisos o niveles consecutivos</b> de la edificación, dividido por la altura de entrepiso. Controla el daño a los elementos no estructurales y la estabilidad global.\n <span class=\"eq\">Deriva = Δ<sup>i</sup> / h<sub>pi</sub> = (δ<sub>i</sub> − δ<sub>i−1</sub>) / h<sub>pi</sub></span>\n <p class=\"sym\">δ<sub>i</sub>, δ<sub>i−1</sub>: desplazamientos horizontales de los pisos i e i−1 (m) · h<sub>pi</sub>: altura del entrepiso i (m).</p>\n <p>Límites (Tabla A.6.4-1): <b>1.0 % de h<sub>pi</sub></b> para concreto reforzado, estructuras metálicas, madera y mampostería que cumple A.6.4.2.2; <b>0.5 %</b> para mampostería que cumple A.6.4.2.3. Los desplazamientos se calculan con las fuerzas sísmicas F<sub>s</sub> <b>sin dividir por R</b>, incluyendo torsión (accidental y real) y efectos P-Δ.</p>","efig":"deriva"},{"id":"H153","t":"anal","src":"Moodle 2020-07","origen":"hist","r":"NSR-10 A.6.3","k":"mc","q":"¿Qué entiende por derivas de entrepiso?","o":["el desplazamiento máximo del centro de rigidez","el desplazamiento máximo del centro de masa","la diferencia de desplazamientos de dos pisos consecutivos","N.A.","la diferencia de desplazamientos de dos pisos consecutivos entre la altura de entrepiso"],"a":4,"e":"<b>e) La diferencia de desplazamientos de dos pisos consecutivos entre la altura de entrepiso.</b> La opción c) queda incompleta: sin dividir por hp se tiene el desplazamiento relativo, no la deriva."},{"id":"H154","t":"anal","src":"Moodle 2020-11","origen":"hist","r":"NSR-10 A.6.3","k":"vf","q":"La deriva es el desplazamiento relativo que sufren los entrepisos de un edificio.","a":false,"e":"<b>FALSO</b> según la clave del curso. Le faltan dos precisiones que la norma sí exige: los puntos deben estar sobre la <b>misma línea vertical</b>, y el valor debe expresarse <b>dividido por la altura de entrepiso</b>. Sin ellas la afirmación describe el desplazamiento relativo, no la deriva.","nota":"Contradice a la pregunta de selección múltiple del otro cuestionario, donde la respuesta correcta sí incluye la división por hp. Cuando la pregunta sea abierta, dé siempre la definición completa: misma línea vertical, pisos consecutivos y dividido por hp."},{"id":"H155","t":"anal","src":"2021-L · 2021-M · 2024-3 · Moodle 2020-11 · Repaso","origen":"hist","r":"NSR-10 A.3.6.7 (efectos torsionales)","k":"abierta","q":"¿Qué entiende por centro de masa?","e":"Punto de cada diafragma donde se considera <b>concentrada la masa del piso</b> —el centro de gravedad de esa masa— y, en consecuencia, el <b>lugar geométrico donde se aplican las fuerzas inerciales del sismo</b> en el modelo."},{"id":"H156","t":"anal","src":"2021-L · 2024-3 · Moodle 2020-11","origen":"hist","r":"NSR-10 A.3.6.7","k":"mc","q":"¿Qué entiende por centro de masa?","o":["es el lugar geométrico donde se aplica el movimiento sísmico","es el centro de gravedad del piso","es el lugar donde se generan los mayores desplazamientos","es arbitrario y queda a criterio del ingeniero","N.A."],"a":0,"e":"<b>a) Es el lugar geométrico donde se aplica el movimiento sísmico.</b> Es la respuesta de la clave del curso: en el modelo la acción sísmica se aplica en el centro de masa.","nota":"La opción \"centro de gravedad del piso\" es físicamente correcta, pero la clave del docente premia la primera. Si la pregunta es abierta, mencione las dos ideas: es el centro de gravedad de la masa del piso y por eso es donde se aplica la fuerza sísmica."},{"id":"H157","t":"anal","src":"Moodle 2020-11 · Repaso","origen":"hist","r":"NSR-10 A.3.6.6 · modelación con diafragma rígido","k":"mc","q":"Para un edificio en 3D, los grados de libertad del centro de masa son (eje Z perpendicular al diafragma rígido):","o":["UY, RZ, UX","ninguna de las anteriores","UZ, RX, RY","UZ, UX, RY"],"a":0,"e":"<b>a) UY, RZ, UX.</b> Con la hipótesis de diafragma rígido cada piso tiene tres grados de libertad: dos traslaciones en el plano (UX, UY) y la rotación alrededor del eje vertical (RZ)."},{"id":"H158","t":"anal","src":"2021-L · 2022-1 · 2024-3 · Repaso","origen":"hist","r":"NSR-10 A.3.6.7 (torsión accidental y excentricidad)","k":"abierta","q":"¿Qué entiende por centro de rigidez?","e":"<b>Lugar geométrico en el que, al aplicar una fuerza en cualquier dirección, no se presenta rotación del diafragma</b> alrededor de un eje ortogonal a la fuerza aplicada. Es el punto donde puede considerarse concentrada la rigidez de todos los elementos verticales del piso. La distancia entre el centro de masa y el centro de rigidez es la <b>excentricidad</b>, causa de la torsión en planta."},{"id":"H159","t":"anal","src":"Moodle 2020-07","origen":"hist","r":"NSR-10 A.3.6.7","k":"mc","q":"¿Qué entiende por centro de rigidez?","o":["es arbitrario y queda a criterio del ingeniero","N.A.","es el lugar geométrico donde la estructura es capaz de soportar cargas y deformarse menos","es el lugar donde se generan los mayores desplazamientos","es el punto más alejado de la losa"],"a":1,"e":"<b>b) N.A.</b> Ninguna opción recoge la definición correcta: el punto donde una fuerza aplicada no produce rotación del diafragma."},{"id":"H160","t":"anal","src":"2022-1","origen":"hist","r":"NSR-10 Tabla A.3-6 · A.2.6","k":"mc","q":"Una de las siguientes aseveraciones es correcta:","o":["el desplazamiento de los planos de acción es una irregularidad en planta","una estructura rígida apoyada sobre una estructura con menor rigidez es aceptada por la NSR-10","el periodo de una estructura depende de la masa, la rigidez, la altura y los modos de vibración","Sd es el valor del espectro de aceleraciones de diseño para un periodo dado"],"a":0,"e":"<b>a) El desplazamiento de los planos de acción de elementos verticales es una irregularidad en planta.</b> b) describe una configuración prohibida; c) confunde de qué depende el periodo (masa y rigidez); d) confunde Sd —espectro de desplazamientos— con Sa."},{"id":"H161","t":"anal","src":"2022-1","origen":"hist","r":"Sismología general · NSR-10 A.2.1","k":"mc","q":"NO es cierta una de las siguientes aseveraciones:","o":["la región de choque de dos placas tectónicas se denomina zona de subducción","el lugar dentro de la Tierra donde se produce la liberación de energía se denomina hipocentro","durante un sismo se propagan ondas internas y superficiales","el periodo de retorno es el tiempo promedio entre dos movimientos sísmicos con la misma aceleración del suelo"],"a":0,"e":"<b>a) es la falsa.</b> No toda zona de choque de placas es de subducción: la subducción exige que una placa —normalmente oceánica, más densa— se hunda bajo la otra. Dos placas continentales pueden converger sin que haya subducción. Las opciones b), c) y d) son correctas."},{"id":"H162","t":"sism","src":"2022-1","origen":"hist","r":"NSR-10 A.2.2 (movimientos sísmicos de diseño)","k":"abierta","q":"¿Qué es el periodo de retorno?","e":"Tiempo promedio, en años, entre dos movimientos sísmicos que producen <b>la misma aceleración del suelo</b> en un sitio. Es el inverso de la probabilidad anual de excedencia. El sismo de diseño de la NSR-10 corresponde a una probabilidad de excedencia del 10 % en 50 años, es decir, un periodo de retorno de <b>475 años</b>."},{"id":"H163","t":"norm","src":"Repaso","origen":"hist","r":"NSR-10 A.1.2 (objetivo) · Ley 400 de 1997","k":"abierta","q":"¿Cuál es el objetivo de la NSR-10?","e":"Reglamentar y establecer los <b>requisitos mínimos</b> para que las edificaciones diseñadas y construidas conforme a ella sean capaces de <b>resistir el sismo de diseño sin colapsar</b>, protegiendo la vida de sus ocupantes; y de resistir sismos menores sin daño y sismos moderados con daño reparable en elementos no estructurales."},{"id":"H164","t":"norm","src":"Repaso","origen":"hist","r":"NSR-10 A.1.3 · Ley 400 de 1997 y Ley 388 de 1997","k":"abierta","q":"Explique el procedimiento de diseño según la NSR-10.","e":"<ol><li><b>Estudios geotécnicos:</b> exploración del subsuelo para determinar los parámetros del suelo y los movimientos sísmicos de diseño.</li>\n <li><b>Diseño arquitectónico:</b> debe cumplir la reglamentación urbana vigente y los Títulos J y K, e indicar los usos definidos en A.2.</li>\n <li><b>Diseño estructural:</b> a cargo de un ingeniero civil facultado (Ley 400 de 1997). Debe dar resistencia y rigidez frente a las cargas mínimas y limitar las deformaciones bajo cargas de servicio.</li>\n <li><b>Revisión de los diseños:</b> planos, memorias y estudios revisados para obtener la licencia de construcción.</li>\n <li><b>Construcción:</b> conforme a los requisitos del material y bajo supervisión técnica.</li>\n <li><b>Supervisión técnica.</b></li></ol>"},{"id":"H165","t":"norm","src":"Repaso","origen":"hist","r":"NSR-10 Título I · Ley 400 de 1997 (mod. Ley 1796 de 2016)","k":"abierta","q":"Defina la revisión de diseños y la supervisión técnica.","e":"<p><b>Revisión de los diseños:</b> los planos, memorias y estudios deben revisarse para obtener la licencia de construcción (Ley 400 de 1997, Ley 388 de 1997). La revisión la hace la curaduría u oficina que expide las licencias, o un profesional independiente a costo de quien solicita la licencia.</p>\n <p><b>Supervisión técnica:</b> verificación, durante la construcción, de que la obra se ejecuta según planos y especificaciones (Título I). Según la diapositiva del curso (Título V de la Ley 400, modificado por la Ley 1796 de 2016) es obligatoria para:</p>\n <ul><li>Construcciones con <b>más de 2000 m²</b> de área construida.</li><li>Edificaciones de los <b>Grupos de uso III y IV</b>.</li><li>Edificaciones diseñadas con el <b>Título E</b> con más de <b>15 unidades</b> de vivienda.</li></ul>","nota":"El texto original de la Ley 400 de 1997 fijaba 3000 m². El umbral vigente, que es el que muestra la diapositiva del profesor, es de 2000 m²."},{"id":"H166","t":"norm","src":"2021-M","origen":"hist","r":"Ley 400 de 1997, art. 18 · NSR-10 Título I","k":"vf","q":"De conformidad con la Ley 400 de 1997 se debe realizar supervisión técnica a construcciones de más de 2000 m².","a":true,"e":"<b>VERDADERO.</b> El Título V de la Ley 400 de 1997, modificado por la Ley 1796 de 2016, exige supervisión técnica a construcciones de <b>más de 2000 m²</b>, a los Grupos de uso III y IV y a edificaciones del Título E con más de 15 unidades de vivienda. Así aparece en la diapositiva del curso.","nota":"La clave del parcial 2021 marcó FALSO porque usaba el texto original de la ley (3000 m²). Si aparece, responda VERDADERO y cite la Ley 1796 de 2016."},{"id":"H167","t":"norm","src":"Repaso","origen":"hist","r":"NSR-10 A.1.3 · A.3.1","k":"abierta","q":"Enuncie los aspectos principales del diseño sísmico.","e":"<ul><li><b>Selección de un sistema estructural adecuado</b> (configuración y regularidad).</li>\n <li><b>El análisis sísmico</b> (obtención de las fuerzas y desplazamientos de diseño).</li>\n <li><b>El detallado</b> de la estructura (despiece que garantiza la ductilidad supuesta).</li></ul>"},{"id":"H168","t":"norm","src":"Repaso","origen":"hist","r":"Teoría general — proceso de diseño sismorresistente","k":"abierta","q":"Enuncie las fases del proceso global de diseño sísmico.","e":"<ul><li><b>Conceptual</b> — definición de la configuración y del sistema estructural.</li>\n <li><b>Numérica</b> — modelación, análisis y dimensionamiento.</li>\n <li><b>Implantación</b> — detallado, planos y construcción conforme a lo diseñado.</li></ul>"}];
